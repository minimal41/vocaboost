<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">

<title>パスワード再設定</title>

<link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
<link rel="icon" type="image/x-icon" href="./images/favicon.ico">

<link rel="stylesheet" type="text/css" href="style.css">
<link rel="stylesheet" type="text/css" href="login.css">
</head>

<body>

<div class="card">

  <h2>パスワード再設定</h2>

  <form onsubmit="sendResetMail(); return false;">

    <div class="mailaddress">

      <input
        id="emailHead"
        placeholder="メール"
      >

      <div class="domain">
        @edu.nishiyamato.ed.jp
      </div>

    </div>

    <button type="submit">
      再設定メールを送信
    </button>

    <div class="notice" id="msg"></div>

    <div class="link">
      <a href="login.html">
        ログインに戻る
      </a>
    </div>

  </form>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
  authDomain: "quiz1-4ffdc.firebaseapp.com",
  projectId: "quiz1-4ffdc"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

window.sendResetMail = async function(){

  const input =
    document.getElementById("emailHead").value.trim();

  const msg =
    document.getElementById("msg");

  msg.textContent = "";

  if(!input){
    msg.textContent =
      "メールアドレスを入力してください";
    return;
  }

  let email = "";

  if(input.includes("@")){
    email = input;
  }else{
    email =
      input + "@edu.nishiyamato.ed.jp";
  }

  try{

    await auth.sendPasswordResetEmail(email);

    msg.textContent =
      "再設定メールを送信しました\nメールが届かない場合は迷惑メールフォルダをご確認ください";
    msg.style.whiteSpace = "pre-wrap";

  }catch(e){

    msg.textContent =
      "送信失敗：" + e.message;

    console.error(e);

  }

};

</script>

</body>
</html>
