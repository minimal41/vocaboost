<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>マイページ</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 90%;
      margin-top: 8px;
    }

    .notice {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="mypageBtn" class="header-btn" style="display:none" onclick="goPage('mypage.html')">マイページ</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>

    <div class="card">
      <h2>ユーザー情報</h2>
      <p>UID: <span id="uid"></span></p>
      <p>Email: <span id="email"></span></p>
      <p>ユーザー名: <span id="usernameText">未設定</span></p>
      <p>作成した単語帳数: <span id="bookCount">0</span></p>
    </div>

    <div class="card">
      <h2>ユーザー名設定・変更</h2>
      <form autocomplete="off" onsubmit="return false;">
        <input type="text" id="usernameInput" name="vocaboost_username_change" placeholder="新しいユーザー名" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" onclick="updateUsername()">変更する</button>
      </form>
      <div id="nameMsg" class="notice"></div>
    </div>

    <div class="card">
      <h2>パスワード変更</h2>
      <form autocomplete="off" onsubmit="return false;">
        <input type="password" id="currentPass" name="vocaboost_current_pass" placeholder="現在のパスワード" autocomplete="off">
        <input type="password" id="newPass" name="vocaboost_new_pass" placeholder="新しいパスワード" autocomplete="new-password">
        <input type="password" id="newPassConfirm" name="vocaboost_new_pass_confirm" placeholder="新しいパスワード（確認）" autocomplete="new-password">
        <button type="button" onclick="changePassword()">変更する</button>
      </form>
      <div id="passMsg" class="notice"></div>
    </div>

  </main>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="mypage.html">マイページ</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    /* ===== Firebase設定（完全版） ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const mypageBtn = document.getElementById("mypageBtn");

    // ログイン情報のキャッシュを利用してヘッダーを即時表示
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      mypageBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    function handleSignedOut() {
      localStorage.removeItem("cachedUser");
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      mypageBtn.style.display = "none";
      // 一時的な認証エラーで強制的にログイン画面へ飛ばされることがないよう、
      // ここでは画面遷移はせずヘッダー表示のみ更新する。
    }

    /* ===== ログインチェック =====
       Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
       一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
       残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
       未ログインのままかを再確認する（実際はログインしたままなのに強制的に
       ログイン画面へ飛ばされてしまう不具合を防ぐため）。 */
    auth.onAuthStateChanged(async user => {
      if (!user) {
        if (localStorage.getItem("cachedUser")) {
          (function () {
            // 端末やネットワークが遅いと1回・1.5秒の再確認だけでは間に合わないことがあるため、
            // 間隔を広げながら最大4回(合計15秒)まで再確認してから本当に未ログインと判断する。
            const delays = [1000, 2000, 4000, 8000];
            const recheck = (i) => {
              setTimeout(() => {
                if (auth.currentUser) return;
                if (i + 1 < delays.length) recheck(i + 1);
                else handleSignedOut();
              }, delays[i]);
            };
            recheck(0);
          })();
          return;
        }
        handleSignedOut();
        return;
      }

      currentUser = user;

      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        mypageBtn.style.display = "inline-block";

        document.getElementById("uid").textContent = user.uid;
        document.getElementById("email").textContent = user.email;
        document.getElementById("usernameText").textContent = user.displayName || "未設定";

        loadBookCount();
        cleanupEmptyBooks();
      } else {
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        mypageBtn.style.display = "none";
      }
    });

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      if (currentUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    }

    /* ===== 作成単語帳数 ===== */
    async function loadBookCount() {
      try {
        const snap = await db.collection("wordbooks")
          .where("owner", "==", currentUser.uid)
          .get();

        document.getElementById("bookCount").textContent = snap.size;
      } catch (e) {
        console.error(e);
      }
    }

    /* ===== 空の単語帳を自動削除 (DBからも完全に消去) ===== */
    async function cleanupEmptyBooks() {
      try {
        // wordCountフィールドで絞り込み、削除候補になりうる単語帳だけを取得する。
        // 以前は自分の全単語帳に対して words サブコレクションをget()していたため、
        // 単語帳が増えるほど読み込みが重くなっていた。
        let snap;
        try {
          snap = await db.collection("wordbooks")
            .where("owner", "==", currentUser.uid)
            .where("wordCount", "==", 0)
            .get();
        } catch (e) {
          // 複合インデックスが無い環境向けのフォールバック
          console.warn("wordCount絞り込みクエリに失敗。全件取得にフォールバックします。", e);
          const all = await db.collection("wordbooks")
            .where("owner", "==", currentUser.uid)
            .get();
          snap = {
            docs: all.docs.filter(d => (d.data().wordCount || 0) === 0)
          };
        }

        const now = Date.now();
        const ONE_HOUR = 60 * 60 * 1000;

        for (const doc of snap.docs) {
          const data = doc.data();

          // 作成直後のものを消さないよう、1時間以上経過しているかチェック
          const createdAt = data.createdAt ? data.createdAt.toDate().getTime() : 0;

          if (now - createdAt <= ONE_HOUR) continue;

          // wordCountが0でも古いデータでフィールド自体が無い/不整合な場合があるため、
          // 削除前に実際のサブコレクションも確認する（最大1件だけ取得すれば十分）
          const wordsSnap = await db.collection("wordbooks").doc(doc.id).collection("words").limit(1).get();

          if (wordsSnap.empty) {
            await db.collection("wordbooks").doc(doc.id).delete();
            console.log("Cleanup: Deleted empty book", doc.id);
          }
        }
        // 削除後にカウントを更新
        loadBookCount();
      } catch (e) {
        console.warn("Cleanup failed:", e);
      }
    }

    /* ===== ユーザー名変更 ===== */
    async function updateUsername() {
      const newName = document.getElementById("usernameInput").value.trim();
      const msg = document.getElementById("nameMsg");

      if (!newName) {
        msg.textContent = "ユーザー名を入力してください";
        msg.className = "notice";
        return;
      }

      try {
        await currentUser.updateProfile({
          displayName: newName
        });

        await db.collection("users").doc(currentUser.uid).set({
          username: newName
        }, { merge: true });

        document.getElementById("usernameText").textContent = newName;
        msg.textContent = "ユーザー名を変更しました";
        msg.className = "success";
        document.getElementById("usernameInput").value = "";
      } catch (e) {
        msg.textContent = "エラー: " + e.message;
        msg.className = "notice";
      }
    }

    /* ===== パスワード変更 ===== */
    async function changePassword() {
      const current = document.getElementById("currentPass").value;
      const newPass = document.getElementById("newPass").value;
      const newPassConfirm = document.getElementById("newPassConfirm").value;
      const msg = document.getElementById("passMsg");

      if (!current || !newPass || !newPassConfirm) {
        msg.textContent = "すべて入力してください";
        msg.className = "notice";
        return;
      }

      if (newPass !== newPassConfirm) {
        msg.textContent = "新しいパスワードが一致しません";
        msg.className = "notice";
        return;
      }

      try {
        const cred = firebase.auth.EmailAuthProvider.credential(
          currentUser.email,
          current
        );

        await currentUser.reauthenticateWithCredential(cred);
        await currentUser.updatePassword(newPass);

        msg.textContent = "パスワードを変更しました";
        msg.className = "success";

        document.getElementById("currentPass").value = "";
        document.getElementById("newPass").value = "";
        document.getElementById("newPassConfirm").value = "";
      } catch (e) {
        msg.textContent = "エラー: " + e.message;
        msg.className = "notice";
      }
    }

    // ブラウザのパスワードマネージャーが自動入力したメールアドレス断片などが
    // ユーザー名入力欄に残ってしまう場合があるため、複数のタイミングでクリアする
    function clearUsernameAutofill() {
      const input = document.getElementById("usernameInput");
      if (input) input.value = "";
    }

    window.addEventListener("load", () => {
      clearUsernameAutofill();
      setTimeout(clearUsernameAutofill, 100);
      setTimeout(clearUsernameAutofill, 500);
    });

    document.addEventListener("DOMContentLoaded", clearUsernameAutofill);

  </script>

  <script src="account-widgets.js"></script>
  <script src="analytics-tracker.js"></script>
</body>

</html>
