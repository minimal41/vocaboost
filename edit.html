<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>単語帳編集</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>

  <style>
    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .wordItem {
      border-bottom: 1px solid var(--color-border);
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .danger {
      background: var(--color-danger);
    }

    a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      color: var(--color-danger);
      margin-top: 10px;
    }

    .success {
      color: var(--color-success);
      margin-top: 10px;
    }

    .wordRow {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .wordRow input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 14px;
      width: calc(50% - 10px);
      min-width: 150px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .wordRow input {
        width: 100%;
      }
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    .titleInput {
      width: 100%;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-bottom: 2px solid var(--color-border);
      padding: 10px 0;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .titleInput:focus {
      border-bottom: 2px solid var(--color-accent);
    }

    .editInput {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      font-size: 14px;
    }

    .frontInput,
    .backInput {
      width: 35%;
    }

    .deleteCheck {
      transform: scale(1.2);
    }

    .swapBtn {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: var(--color-accent);
      color: var(--color-accent-text);

      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .checkWrap {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .deleteCheck {
      display: none;
    }

    .checkMark {
      width: 26px;
      height: 26px;
      border: 2px solid var(--color-accent);
      border-radius: 50%;
      background: var(--color-surface);
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 2px 6px var(--color-shadow);
    }

    .deleteCheck:checked + .checkMark {
      background: var(--color-accent);
      transform: scale(1.1);
      box-shadow: 0 4px 12px var(--color-shadow);
    }

    .deleteCheck:checked + .checkMark::after {
      content: "";
      position: absolute;

      left: 8px;
      top: 4px;

      width: 6px;
      height: 12px;

      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    /* 他の単語帳から取り込むモーダル */
    .modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    .modalBox {
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .modalDesc {
      font-size: 13px;
      color: var(--color-text-sub);
      margin-bottom: 10px;
    }

    .importBookList,
    .importWordList {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }

    .importBookItem {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .importBookItem:last-child {
      border-bottom: none;
    }

    .importBookItem:hover {
      background: var(--color-bg);
    }

    .importBookItem .bookTitle {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .importBookItem .bookCount {
      font-size: 12px;
      color: var(--color-text-sub);
      flex-shrink: 0;
    }

    .importWordRow {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .importWordRow:last-child {
      border-bottom: none;
    }

    .importWordRow:hover {
      background: var(--color-bg);
    }

    .importWordRow .wordPair {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .smallActionBtn {
      background: var(--color-border);
      color: var(--color-text);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .importEmpty {
      padding: 20px;
      text-align: center;
      color: var(--color-text-sub);
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <button id="settingsBtn" class="header-btn" style="display:none" onclick="goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="card">
      <input id="title" class="titleInput" placeholder="タイトル">
      <textarea id="description" placeholder="説明文を入力してください"></textarea>
      <div id="owner" style="margin-top:10px; color:var(--color-text-sub); font-size:13px;"></div>
      <button class="danger" onclick="deleteBook()" style="margin-top:15px;">この単語帳を削除</button>
      <div id="msg" class="notice"></div>
    </div>

    <div class="card">
      <button onclick="duplicateBook()" id="duplicateBtn">この単語帳を複製</button>
      <div id="duplicateMsg" class="notice"></div>
    </div>

    <div class="card">
      <h3>単語を追加</h3>
      <div class="wordRow">
        <input id="front" placeholder="例：犬">
        <input id="back" placeholder="例：dog">
      </div>
      <div style="text-align:center;margin-top:10px">
        <button onclick="addWord()">追加</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>単語一覧</h3>
        <button onclick="reverseSelectedWords()">
          選択項目を表裏反転
        </button>
        <button class="danger" onclick="deleteSelectedWords()">
          選択削除
        </button>
      </div>
      <div id="wordList"></div>
    </div>

    <div class="card">
      <h3>CSV操作</h3>
      <input type="file" id="csvFile" accept=".csv,.txt"><br><br>
      <button onclick="importCSV()">CSV読み込み</button>
      <button onclick="exportCSV()">CSV書き出し</button>
      <button onclick="exportReverseCSV()">逆CSV書き出し</button>
      <button onclick="openImportModal()">他の単語帳から取り込む</button>
    </div>

    <!-- 追加：保存ボタン -->
    <div class="card" style="text-align:center;">
      <button onclick="saveAndBack()">保存</button>
    </div>

  </main>

  <!-- 他の単語帳から単語を取り込むモーダル -->
  <div id="importModal" class="modalOverlay" style="display:none;">
    <div class="modalBox">
      <h3>他の単語帳から取り込む</h3>

      <div id="importStep1">
        <p class="modalDesc">取り込み元の単語帳を選んでください</p>
        <div id="importBookList" class="importBookList"></div>
      </div>

      <div id="importStep2" style="display:none;">
        <p class="modalDesc">取り込む単語を選んでください</p>
        <div style="text-align:right; margin-bottom:8px;">
          <button type="button" class="smallActionBtn" onclick="toggleSelectAllImportWords()">全選択/解除</button>
        </div>
        <div id="importWordList" class="importWordList"></div>
        <div id="importMsg" class="notice"></div>
        <div class="modalActions">
          <button type="button" onclick="backToBookList()">単語帳選択に戻る</button>
          <button type="button" onclick="confirmImportWords()">選択した単語を取り込む</button>
        </div>
      </div>

      <div class="modalActions">
        <button type="button" onclick="closeImportModal()">閉じる</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Firestoreオフラインキャッシュ
    db.enablePersistence({
      synchronizeTabs: true
    }).catch(err => {
      console.log("Persistence:", err.code);
    });

    const params = new URLSearchParams(location.search);
    const bookId = params.get("id");

    let currentUser = null;
    let bookOwner = null;
    let bookListener = null;
    let wordsListener = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    // ログイン情報のキャッシュを利用（他ページと統一されたキー名 "cachedUser" を使用）
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
        loadBook();
      } else {
        localStorage.removeItem("cachedUser");
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        settingsBtn.style.display = "none";
        alert("ログインしてください");
        location.href = "login.html";
      }
    });

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    }



    async function loadBook() {

      const cacheKey = `edit_${bookId}`;

      // キャッシュを先に表示
      const cache = localStorage.getItem(cacheKey);

      if (cache) {
        try {
          const data = JSON.parse(cache);

          document.getElementById("title").value = data.title;
          document.getElementById("description").value = data.description;
          document.getElementById("owner").textContent = data.owner;
          document.getElementById("wordList").innerHTML = data.wordsHtml;

        } catch(e){}
      }

      bookListener = db.collection("wordbooks")
        .doc(bookId)
        .onSnapshot(doc => {

          if (!doc.exists) {
            alert("単語帳が見つかりません");
            location.href = "index.html";
            return;
          }

          const data = doc.data();

          bookOwner = data.owner;

          if (currentUser.uid !== bookOwner) {
            alert("他人の単語帳は編集できません");
            location.href = "view.html?id=" + bookId;
            return;
          }

          document.getElementById("title").value =
            data.title || "";

          document.getElementById("description").value =
            data.description || "";

          document.getElementById("owner").textContent =
            "作成者: " + data.ownerName;

          updateCache();

      });

      wordsListener = db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .orderBy("createdAt")
        .onSnapshot(snapshot => {

          const area = document.getElementById("wordList");

          area.innerHTML = "";

          snapshot.forEach(doc => {

            area.insertAdjacentHTML(
              "beforeend",
              createWordHTML(doc.id, doc.data())
            );

          });

          updateCache();

      });
    }

        document.getElementById("title").addEventListener("input", updateCache);
        document.getElementById("description").addEventListener("input", updateCache);

        function updateCache() {

          localStorage.setItem(
            `edit_${bookId}`,
            JSON.stringify({
              title: document.getElementById("title").value,
              description: document.getElementById("description").value,
              owner: document.getElementById("owner").textContent,
              wordsHtml: document.getElementById("wordList").innerHTML
            })
          );

        }


    async function addWord() {
      const f = document.getElementById("front").value.trim();
      const b = document.getElementById("back").value.trim();

      if (!f || !b) return;

      await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .add({
          front: f,
          back: b,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

      document.getElementById("front").value = "";
      document.getElementById("back").value = "";

      await db.collection("wordbooks").doc(bookId).update({
        wordCount: firebase.firestore.FieldValue.increment(1)
      });
    }

    async function deleteWord(id) {
      if (!confirm("この単語を削除しますか？")) return;
      await db.collection("wordbooks").doc(bookId).collection("words").doc(id).delete();

      // ★ 単語数を-1
      await db.collection("wordbooks").doc(bookId).update({
        wordCount: firebase.firestore.FieldValue.increment(-1)
      });
    }

    async function deleteBook() {
      if (!confirm("単語帳を完全に削除しますか？")) return;

      const snap = await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .get();
      const batch = db.batch();

      snap.forEach(doc => {
        batch.delete(doc.ref);
      });

      batch.delete(db.collection("wordbooks").doc(bookId));
      await batch.commit();

      alert("削除しました");
      location.href = "index.html";
    }

    async function duplicateBook() {
      const duplicateBtn = document.getElementById("duplicateBtn");
      const duplicateMsg = document.getElementById("duplicateMsg");

      if (!confirm("この単語帳を複製しますか？")) return;

      duplicateBtn.disabled = true;
      duplicateMsg.className = "notice";
      duplicateMsg.textContent = "複製しています...";

      try {
        // 保存済みの最新データを取得する（入力欄の未保存の変更には依存しない）
        const bookSnap = await db.collection("wordbooks").doc(bookId).get();

        if (!bookSnap.exists) {
          duplicateMsg.textContent = "単語帳が見つかりません";
          duplicateBtn.disabled = false;
          return;
        }

        const bookData = bookSnap.data();

        // 単語のサブコレクションを複製する
        const wordsSnap = await db.collection("wordbooks")
          .doc(bookId)
          .collection("words")
          .orderBy("createdAt")
          .get();

        // 新しい単語帳を作成する（タイトルに「のコピー」を付与）。
        // wordCountは元のフィールド値ではなく、実際にコピーする単語数を使う
        // （元データのwordCountフィールドが何らかの理由で実数とズレていた場合の不整合を防ぐため）
        const newBookRef = await db.collection("wordbooks").add({
          title: (bookData.title || "") + "のコピー",
          description: bookData.description || "",
          isPublic: bookData.isPublic !== undefined ? bookData.isPublic : true,
          owner: currentUser.uid,
          ownerName: currentUser.displayName || "名無し",
          wordCount: wordsSnap.size,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Firestoreのバッチは1回あたり最大500件の操作制限があるため、
        // 単語数が多い場合に備えて複数バッチに分割する
        const BATCH_LIMIT = 450;
        let batch = db.batch();
        let opCount = 0;

        for (const wordDoc of wordsSnap.docs) {
          const w = wordDoc.data();
          const newWordRef = newBookRef.collection("words").doc();

          batch.set(newWordRef, {
            front: w.front,
            back: w.back,
            createdAt: w.createdAt || firebase.firestore.FieldValue.serverTimestamp()
          });

          opCount++;

          if (opCount >= BATCH_LIMIT) {
            await batch.commit();
            batch = db.batch();
            opCount = 0;
          }
        }

        if (opCount > 0) {
          await batch.commit();
        }

        duplicateMsg.className = "success";
        duplicateMsg.textContent = "複製しました";

        // 複製した単語帳の編集画面を開く
        location.href = "edit.html?id=" + newBookRef.id;

      } catch (e) {
        console.error(e);
        duplicateMsg.textContent = "複製に失敗しました: " + e.message;
        duplicateBtn.disabled = false;
      }
    }

    async function saveBook() {
      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("description").value.trim();

      await db.collection("wordbooks").doc(bookId).update({
        title: title,
        description: desc,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      updateCache();
      alert("保存しました");
    }

    /* CSV読み込み */
    async function importCSV() {
      const file = document.getElementById("csvFile").files[0];
      if (!file) return alert("CSVファイルを選択してください");

      const text = await file.text();
      const lines = text.trim().split("\n");

      let addedCount = 0;
      const baseTime = Date.now();
      const area = document.getElementById("wordList");
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const [f, b] = line.split(",");
        if (f && b) {
          const doc = await db.collection("wordbooks")
            .doc(bookId)
            .collection("words")
            .add({
              front: f.trim(),
              back: b.trim(),
              createdAt: new Date(baseTime + i)
            });

          addedCount++;
        }
      }

      if (addedCount > 0) {
        await db.collection("wordbooks").doc(bookId).update({
          wordCount: firebase.firestore.FieldValue.increment(addedCount)
        });
      }

      updateCache();

      alert("CSV読み込み完了");
    }

    /* CSV書き出し */
    async function exportCSV() {
      const snap = await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .orderBy("createdAt")
        .get();
      let csv = "";

      snap.forEach(doc => {
        const w = doc.data();
        csv += `${w.front},${w.back}\n`;
      });

      const blob = new Blob([csv], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const title = document.getElementById("title").value.trim() || "単語帳";
      a.download = `${title}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
    const front = document.getElementById("front");
    const back = document.getElementById("back");

    front.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault(); // フォーム送信を防ぐ（必要に応じて）
        back.focus();
      }
    });
    back.addEventListener("keydown", async function (event) {
      if (event.key === "Enter") {
        event.preventDefault();

        // 単語追加
        await addWord();

        // front に戻る
        front.focus();
      }
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function createWordHTML(id, w) {
      return `
        <div class="wordItem" id="word_${id}">

          <label class="checkWrap">
            <input type="checkbox"
                  class="deleteCheck"
                  value="${id}">
            <span class="checkMark"></span>
          </label>

          <input class="editInput frontInput"
                value="${escapeHtml(w.front)}"
                onchange="updateWord('${id}')"
                data-type="front">

          <button
            class="swapBtn"
            onclick="swapWord('${id}')">
            ⇄
          </button>

          <input class="editInput backInput"
                value="${escapeHtml(w.back)}"
                onchange="updateWord('${id}')"
                data-type="back">

          <button class="danger"
                  onclick="deleteWord('${id}')">
            削除
          </button>

        </div>
      `;
    }

    async function updateWord(id) {
      const row = document.getElementById("word_" + id);

      const inputs = row.querySelectorAll(".editInput");

      let front = "";
      let back = "";

      inputs.forEach(input => {
        if (input.dataset.type === "front") {
          front = input.value.trim();
        } else {
          back = input.value.trim();
        }
      });

      await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .doc(id)
        .update({
          front,
          back
        });
      
    }

    async function deleteSelectedWords() {
      const checks = document.querySelectorAll(".deleteCheck:checked");

      if (checks.length === 0) {
        alert("選択してください");
        return;
      }

      if (!confirm(`${checks.length}個の単語を削除しますか？`)) {
        return;
      }

      const batch = db.batch();

      checks.forEach(check => {
        const ref = db.collection("wordbooks")
          .doc(bookId)
          .collection("words")
          .doc(check.value);

        batch.delete(ref);
      });

      batch.update(
        db.collection("wordbooks").doc(bookId),
        {
          wordCount: firebase.firestore.FieldValue.increment(-checks.length)
        }
      );
      await batch.commit();
    }

    async function saveAndBack() {
      await saveBook();
      history.back();
    }

async function exportReverseCSV() {
  const snap = await db.collection("wordbooks")
    .doc(bookId)
    .collection("words")
    .orderBy("createdAt")
    .get();

  let csv = "";

  snap.forEach(doc => {
    const w = doc.data();

    csv += `${w.back},${w.front}\n`;
  });

  const blob = new Blob([csv], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  const title = document.getElementById("title").value.trim() || "単語帳";
  a.download = `${title}_reverse.csv`;
  a.click();

  URL.revokeObjectURL(url);
}

/* ===== 他の単語帳から単語を取り込む ===== */

let importSelectedBookId = null;
let importWords = []; // {id, front, back} の配列（取り込み元の単語、createdAt順）

async function openImportModal() {
  document.getElementById("importModal").style.display = "flex";
  document.getElementById("importStep1").style.display = "block";
  document.getElementById("importStep2").style.display = "none";

  const listArea = document.getElementById("importBookList");
  listArea.innerHTML = `<div class="importEmpty">読み込み中...</div>`;

  try {
    const snap = await db.collection("wordbooks")
      .where("owner", "==", currentUser.uid)
      .get();

    // 取り込み対象が自分自身の単語帳にならないように除外する
    const books = snap.docs
      .filter(d => d.id !== bookId)
      .map(d => ({ id: d.id, title: d.data().title || "(無題)", wordCount: d.data().wordCount || 0 }));

    if (books.length === 0) {
      listArea.innerHTML = `<div class="importEmpty">取り込み元にできる単語帳がありません</div>`;
      return;
    }

    listArea.innerHTML = "";
    books.forEach(b => {
      const item = document.createElement("div");
      item.className = "importBookItem";
      item.innerHTML = `
        <span class="bookTitle">${escapeHtml(b.title)}</span>
        <span class="bookCount">${b.wordCount}語</span>
      `;
      item.addEventListener("click", () => selectImportBook(b.id, b.title));
      listArea.appendChild(item);
    });

  } catch (e) {
    console.error(e);
    listArea.innerHTML = `<div class="importEmpty">読み込みに失敗しました</div>`;
  }
}

async function selectImportBook(id, title) {
  importSelectedBookId = id;

  document.getElementById("importStep1").style.display = "none";
  document.getElementById("importStep2").style.display = "block";

  const wordArea = document.getElementById("importWordList");
  wordArea.innerHTML = `<div class="importEmpty">読み込み中...</div>`;
  document.getElementById("importMsg").textContent = "";

  try {
    const snap = await db.collection("wordbooks")
      .doc(id)
      .collection("words")
      .orderBy("createdAt")
      .get();

    importWords = snap.docs.map(d => ({
      id: d.id,
      front: d.data().front,
      back: d.data().back
    }));

    if (importWords.length === 0) {
      wordArea.innerHTML = `<div class="importEmpty">単語が登録されていません</div>`;
      return;
    }

    wordArea.innerHTML = "";
    importWords.forEach(w => {
      const row = document.createElement("label");
      row.className = "importWordRow";
      row.innerHTML = `
        <input type="checkbox" class="importWordCheck" data-id="${w.id}" checked>
        <span class="wordPair">${escapeHtml(w.front)} → ${escapeHtml(w.back)}</span>
      `;
      wordArea.appendChild(row);
    });

  } catch (e) {
    console.error(e);
    wordArea.innerHTML = `<div class="importEmpty">読み込みに失敗しました</div>`;
  }
}

function backToBookList() {
  document.getElementById("importStep1").style.display = "block";
  document.getElementById("importStep2").style.display = "none";
}

function toggleSelectAllImportWords() {
  const checks = document.querySelectorAll(".importWordCheck");
  const allChecked = Array.from(checks).every(c => c.checked);
  checks.forEach(c => c.checked = !allChecked);
}

function closeImportModal() {
  document.getElementById("importModal").style.display = "none";
  importSelectedBookId = null;
  importWords = [];
}

async function confirmImportWords() {
  const checks = document.querySelectorAll(".importWordCheck:checked");
  const selectedIds = Array.from(checks).map(c => c.dataset.id);

  if (selectedIds.length === 0) {
    document.getElementById("importMsg").textContent = "取り込む単語を選択してください";
    return;
  }

  const importMsg = document.getElementById("importMsg");
  importMsg.textContent = "取り込んでいます...";

  try {
    // 現在の単語帳に既にある単語の中で、最も新しいcreatedAtを基準にする。
    // これより後の時刻を選択順に割り振ることで、取り込んだ単語が必ず一番下に
    // 元の順番通りに並ぶようにする。
    const existingSnap = await db.collection("wordbooks")
      .doc(bookId)
      .collection("words")
      .orderBy("createdAt", "desc")
      .limit(1)
      .get();

    let baseTime = Date.now();
    if (!existingSnap.empty) {
      const lastCreatedAt = existingSnap.docs[0].data().createdAt;
      if (lastCreatedAt && typeof lastCreatedAt.toMillis === "function") {
        baseTime = Math.max(baseTime, lastCreatedAt.toMillis() + 1);
      }
    }

    // 選択された単語を、取り込み元での並び順を保ったまま処理する
    const selectedIdSet = new Set(selectedIds);
    const orderedSelected = importWords.filter(w => selectedIdSet.has(w.id));

    let addedCount = 0;
    for (let idx = 0; idx < orderedSelected.length; idx++) {
      const w = orderedSelected[idx];
      await db.collection("wordbooks").doc(bookId).collection("words").add({
        front: w.front,
        back: w.back,
        createdAt: new Date(baseTime + idx)
      });
      addedCount++;
    }

    if (addedCount > 0) {
      await db.collection("wordbooks").doc(bookId).update({
        wordCount: firebase.firestore.FieldValue.increment(addedCount)
      });
    }

    updateCache();
    closeImportModal();

  } catch (e) {
    console.error(e);
    importMsg.textContent = "取り込みに失敗しました: " + e.message;
  }
}

async function reverseSelectedWords() {
  const checks = document.querySelectorAll(".deleteCheck:checked");

  if (checks.length === 0) {
    alert("単語を選択してください");
    return;
  }

  if (!confirm(`${checks.length}個の単語の表裏を入れ替えますか？`)) {
    return;
  }

  const batch = db.batch();

  for (const check of checks) {
    const ref = db.collection("wordbooks")
      .doc(bookId)
      .collection("words")
      .doc(check.value);

    const doc = await ref.get();
    const data = doc.data();

    batch.update(ref, {
      front: data.back,
      back: data.front
    });
  }

  await batch.commit();
  updateCache();

  alert("表裏を入れ替えました");
}

async function swapWord(id) {
  const row = document.getElementById("word_" + id);

  const frontInput = row.querySelector('[data-type="front"]');
  const backInput = row.querySelector('[data-type="back"]');

  const f = frontInput.value;
  const b = backInput.value;

  frontInput.value = b;
  backInput.value = f;

  await db.collection("wordbooks")
    .doc(bookId)
    .collection("words")
    .doc(id)
    .update({
      front: b,
      back: f
    });

  updateCache();
}
