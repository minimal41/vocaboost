<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>単語帳編集</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">

  <style>
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .wordItem {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .danger {
      background: #b60033;
    }

    a {
      color: #191970;
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      color: red;
      margin-top: 10px;
    }

    .wordRow {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .wordRow input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      width: calc(50% - 10px);
      min-width: 150px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .wordRow input {
        width: 100%;
      }
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    .titleInput {
      width: 100%;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-bottom: 2px solid #ddd;
      padding: 10px 0;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .titleInput:focus {
      border-bottom: 2px solid #191970;
    }

    .editInput {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .frontInput,
    .backInput {
      width: 35%;
    }

    .deleteCheck {
      transform: scale(1.2);
    }

    .swapBtn {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: #191970;
      color: white;

      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .checkWrap {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .deleteCheck {
      display: none;
    }

    .checkMark {
      width: 26px;
      height: 26px;
      border: 2px solid #191970;
      border-radius: 50%;
      background: white;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .deleteCheck:checked + .checkMark {
      background: linear-gradient(#191970);
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(25,25,112,0.4);
    }

    .deleteCheck:checked + .checkMark::after {
      content: "";
      position: absolute;

      left: 8px;
      top: 4px;

      width: 6px;
      height: 12px;

      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <button id="mypageBtn" class="header-btn" style="display:none" onclick="goPage('mypage.html')">マイページ</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="card">
      <input id="title" class="titleInput" placeholder="タイトル">
      <textarea id="description" placeholder="説明文を入力してください"></textarea>
      <div id="owner" style="margin-top:10px; color:#666; font-size:13px;"></div>
      <button class="danger" onclick="deleteBook()" style="margin-top:15px;">この単語帳を削除</button>
      <div id="msg" class="notice"></div>
    </div>

    <div class="card">
      <h3>単語を追加</h3>
      <div class="wordRow">
        <input id="front" placeholder="例：犬">
        <input id="back" placeholder="例：dog">
      </div>
      <div style="text-align:center;margin-top:10px">
        <button onclick="addWord()">追加</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>単語一覧</h3>
        <button onclick="reverseSelectedWords()">
          選択項目を表裏反転
        </button>
        <button class="danger" onclick="deleteSelectedWords()">
          選択削除
        </button>
      </div>
      <div id="wordList"></div>
    </div>

    <div class="card">
      <h3>CSV操作</h3>
      <input type="file" id="csvFile" accept=".csv,.txt"><br><br>
      <button onclick="importCSV()">CSV読み込み</button>
      <button onclick="exportCSV()">CSV書き出し</button>
      <button onclick="exportReverseCSV()">逆CSV書き出し</button>
    </div>

    <!-- 追加：保存ボタン -->
    <div class="card" style="text-align:center;">
      <button onclick="saveAndBack()">保存</button>
    </div>

  </main>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="mypage.html">マイページ</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const params = new URLSearchParams(location.search);
    const bookId = params.get("id");

    let currentUser = null;
    let bookOwner = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const mypageBtn = document.getElementById("mypageBtn");

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        mypageBtn.style.display = "inline-block";
        loadBook();
      } else {
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        mypageBtn.style.display = "none";
        alert("ログインしてください");
        location.href = "login.html";
      }
    });

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      if (currentUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      auth.signOut();
    }



    async function loadBook() {

      const cacheKey = `edit_${bookId}`;

      // キャッシュを先に表示
      const cache = localStorage.getItem(cacheKey);

      if (cache) {
        try {
          const data = JSON.parse(cache);

          document.getElementById("title").value = data.title;
          document.getElementById("description").value = data.description;
          document.getElementById("owner").textContent = data.owner;
          document.getElementById("wordList").innerHTML = data.wordsHtml;

        } catch(e){}
      }

      // Firestore取得開始
      const bookPromise = db.collection("wordbooks")
        .doc(bookId)
        .get();

      const wordsPromise = db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .orderBy("createdAt")
        .get();

      const bookDoc = await bookPromise;

      if (!bookDoc.exists) {
        alert("単語帳が見つかりません");
        location.href = "index.html";
        return;
      }

      const data = bookDoc.data();

      bookOwner = data.owner;

      if (currentUser.uid !== bookOwner) {
        alert("他人の単語帳は編集できません");
        location.href = "view.html?id=" + bookId;
        return;
      }

      document.getElementById("title").value = data.title;
      document.getElementById("description").value = data.description || "";
      document.getElementById("owner").textContent =
        "作成者: " + data.ownerName;

      const wordsSnap = await wordsPromise;

      const area = document.getElementById("wordList");
      const fragment = document.createDocumentFragment();

      wordsSnap.forEach(doc => {
          const div = document.createElement("div");
          div.innerHTML = createWordHTML(doc.id, doc.data());
          fragment.appendChild(div.firstElementChild);
      });

      area.innerHTML = "";
      area.appendChild(fragment);
      updateCache();
    }

    document.getElementById("title").addEventListener("input", updateCache);
    document.getElementById("description").addEventListener("input", updateCache);

    function updateCache() {

      localStorage.setItem(
        `edit_${bookId}`,
        JSON.stringify({
          title: document.getElementById("title").value,
          description: document.getElementById("description").value,
          owner: document.getElementById("owner").textContent,
          wordsHtml: document.getElementById("wordList").innerHTML
        })
      );

    }


    async function addWord() {
      const f = document.getElementById("front").value.trim();
      const b = document.getElementById("back").value.trim();
      if (!f || !b) return;




      const doc = await db.collection("wordbooks")
          .doc(bookId)
          .collection("words")
          .add({
            front:f,
            back:b,
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
          });
      document.getElementById("front").value = "";
      document.getElementById("back").value = "";
      const area=document.getElementById("wordList");

      area.insertAdjacentHTML(
          "beforeend",
          createWordHTML(doc.id,{
              front:f,
              back:b
          })
      );
      // ★ 単語数を+1
      await db.collection("wordbooks").doc(bookId).update({
        wordCount: firebase.firestore.FieldValue.increment(1)
      });

      updateCache();
    }

    async function deleteWord(id) {
      if (!confirm("この単語を削除しますか？")) return;
      await db.collection("wordbooks").doc(bookId).collection("words").doc(id).delete();

      // ★ 単語数を-1
      await db.collection("wordbooks").doc(bookId).update({
        wordCount: firebase.firestore.FieldValue.increment(-1)
      });

      document.getElementById("word_"+id)?.remove();
      updateCache();
    }

    async function deleteBook() {
      if (!confirm("単語帳を完全に削除しますか？")) return;

      const snap = await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .get();
      const batch = db.batch();

      snap.forEach(doc => {
        batch.delete(doc.ref);
      });

      batch.delete(db.collection("wordbooks").doc(bookId));
      await batch.commit();

      alert("削除しました");
      location.href = "index.html";
    }

    async function saveBook() {
      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("description").value.trim();

      await db.collection("wordbooks").doc(bookId).update({
        title: title,
        description: desc,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      updateCache();
      alert("保存しました");
    }

    /* CSV読み込み */
    async function importCSV() {
      const file = document.getElementById("csvFile").files[0];
      if (!file) return alert("CSVファイルを選択してください");

      const text = await file.text();
      const lines = text.trim().split("\n");

      let addedCount = 0;
      const baseTime = Date.now();
      const area = document.getElementById("wordList");
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const [f, b] = line.split(",");
        if (f && b) {
          const doc = await db.collection("wordbooks")
            .doc(bookId)
            .collection("words")
            .add({
              front: f.trim(),
              back: b.trim(),
              createdAt: new Date(baseTime + i)
            });

          area.insertAdjacentHTML(
            "beforeend",
            createWordHTML(doc.id, {
              front: f.trim(),
              back: b.trim()
            })
          );

          addedCount++;
        }
      }

      if (addedCount > 0) {
        await db.collection("wordbooks").doc(bookId).update({
          wordCount: firebase.firestore.FieldValue.increment(addedCount)
        });
      }

      updateCache();

      alert("CSV読み込み完了");
    }

    /* CSV書き出し */
    async function exportCSV() {
      const snap = await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .orderBy("createdAt")
        .get();
      let csv = "";

      snap.forEach(doc => {
        const w = doc.data();
        csv += `${w.front},${w.back}\n`;
      });

      const blob = new Blob([csv], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const title = document.getElementById("title").value.trim() || "単語帳";
      a.download = `${title}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
    const front = document.getElementById("front");
    const back = document.getElementById("back");

    front.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault(); // フォーム送信を防ぐ（必要に応じて）
        back.focus();
      }
    });
    back.addEventListener("keydown", async function (event) {
      if (event.key === "Enter") {
        event.preventDefault();

        // 単語追加
        await addWord();

        // front に戻る
        front.focus();
      }
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function createWordHTML(id, w) {
      return `
        <div class="wordItem" id="word_${id}">

          <label class="checkWrap">
            <input type="checkbox"
                  class="deleteCheck"
                  value="${id}">
            <span class="checkMark"></span>
          </label>

          <input class="editInput frontInput"
                value="${escapeHtml(w.front)}"
                onchange="updateWord('${id}')"
                data-type="front">

          <button
            class="swapBtn"
            onclick="swapWord('${id}')">
            ⇄
          </button>

          <input class="editInput backInput"
                value="${escapeHtml(w.back)}"
                onchange="updateWord('${id}')"
                data-type="back">

          <button class="danger"
                  onclick="deleteWord('${id}')">
            削除
          </button>

        </div>
      `;
    }

    async function updateWord(id) {
      const row = document.getElementById("word_" + id);

      const inputs = row.querySelectorAll(".editInput");

      let front = "";
      let back = "";

      inputs.forEach(input => {
        if (input.dataset.type === "front") {
          front = input.value.trim();
        } else {
          back = input.value.trim();
        }
      });

      await db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .doc(id)
        .update({
          front,
          back
        });
      
      updateCache();
    }

    async function deleteSelectedWords() {
      const checks = document.querySelectorAll(".deleteCheck:checked");

      if (checks.length === 0) {
        alert("選択してください");
        return;
      }

      if (!confirm(`${checks.length}個の単語を削除しますか？`)) {
        return;
      }

      const batch = db.batch();

      checks.forEach(check => {
        const ref = db.collection("wordbooks")
          .doc(bookId)
          .collection("words")
          .doc(check.value);

        batch.delete(ref);
      });

      batch.update(
        db.collection("wordbooks").doc(bookId),
        {
          wordCount: firebase.firestore.FieldValue.increment(-checks.length)
        }
      );
      await batch.commit();

      checks.forEach(check=>{
          document.getElementById("word_"+check.value)?.remove();
      });

      updateCache();
    }

    async function saveAndBack() {
      await saveBook();
      history.back();
    }

async function exportReverseCSV() {
  const snap = await db.collection("wordbooks")
    .doc(bookId)
    .collection("words")
    .orderBy("createdAt")
    .get();

  let csv = "";

  snap.forEach(doc => {
    const w = doc.data();

    csv += `${w.back},${w.front}\n`;
  });

  const blob = new Blob([csv], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  const title = document.getElementById("title").value.trim() || "単語帳";
  a.download = `${title}_reverse.csv`;
  a.click();

  URL.revokeObjectURL(url);
}

async function reverseSelectedWords() {
  const checks = document.querySelectorAll(".deleteCheck:checked");

  if (checks.length === 0) {
    alert("単語を選択してください");
    return;
  }

  if (!confirm(`${checks.length}個の単語の表裏を入れ替えますか？`)) {
    return;
  }

  const batch = db.batch();

  for (const check of checks) {
    const ref = db.collection("wordbooks")
      .doc(bookId)
      .collection("words")
      .doc(check.value);

    const doc = await ref.get();
    const data = doc.data();

    batch.update(ref, {
      front: data.back,
      back: data.front
    });
  }

  await batch.commit();

  document.querySelectorAll(".deleteCheck:checked").forEach(check=>{

      const row=document.getElementById("word_"+check.value);

      const front=row.querySelector('[data-type="front"]');
      const back=row.querySelector('[data-type="back"]');

      const temp=front.value;
      front.value=back.value;
      back.value=temp;

      check.checked=false;
  });

  updateCache();

  alert("表裏を入れ替えました");
}

async function swapWord(id) {
  const row = document.getElementById("word_" + id);

  const frontInput = row.querySelector('[data-type="front"]');
  const backInput = row.querySelector('[data-type="back"]');

  const front = frontInput.value;
  const back = backInput.value;

  // 画面上で入れ替え
  frontInput.value = back;
  backInput.value = front;

  // Firestoreに保存
  await db.collection("wordbooks")
    .doc(bookId)
    .collection("words")
    .doc(id)
    .update({
      front: back,
      back: front
    });

  updateCache();
}

  </script>

</body>

</html>
