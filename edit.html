<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>単語帳編集</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>

  <style>
    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .wordItemCols {
      display: grid;
      grid-template-columns: 22px 26px minmax(80px, 1fr) 32px minmax(80px, 1fr) 96px;
      align-items: center;
      column-gap: 8px;
      min-width: 480px;
    }

    .wordItemCols .smallBtn {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .smallBtn {
      background: var(--color-danger);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      color: var(--color-accent-text);
      border: none;
      cursor: pointer;
    }

    .wordListHeader {
      margin-top: 10px;
      min-width: 480px;
    }

    .wordListHeader button {
      justify-self: center;
      white-space: nowrap;
    }

    #wordList {
      overflow-x: auto;
    }

    .wordItem {
      border-bottom: 1px solid var(--color-border);
      padding: 10px;
      background: var(--color-surface);
      transition: transform 0.15s ease;
    }

    .wordItem.dragging {
      position: fixed;
      z-index: 1000;
      box-sizing: border-box;
      box-shadow: 0 10px 24px var(--color-shadow), 0 3px 8px var(--color-shadow);
      transform: scale(1.03);
      opacity: 0.97;
      border-radius: 10px;
      border-bottom: none;
      pointer-events: none;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .wordItemPlaceholder {
      border: 2px dashed var(--color-accent);
      border-radius: 8px;
      background: var(--color-bg);
      box-sizing: border-box;
      margin: 4px 0;
    }

    .danger {
      background: var(--color-danger);
    }

    a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      color: var(--color-danger);
      margin-top: 10px;
    }

    .success {
      color: var(--color-success);
      margin-top: 10px;
    }

    .wordRow {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .wordRow input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 14px;
      width: calc(50% - 10px);
      min-width: 150px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .wordRow input {
        width: 100%;
      }
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    .titleInput {
      width: 100%;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-bottom: 2px solid var(--color-border);
      padding: 10px 0;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .titleInput:focus {
      border-bottom: 2px solid var(--color-accent);
    }

    .editInput {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      font-size: 14px;
    }

    .frontInput,
    .backInput {
      width: 100%;
      box-sizing: border-box;
    }

    .deleteCheck {
      transform: scale(1.2);
    }

    .dragHandle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .dragHandle span {
      display: block;
      width: 16px;
      height: 2px;
      border-radius: 1px;
      background: var(--color-text-sub);
    }

    .dragHandle:active {
      cursor: grabbing;
    }

    .wordItem.dragging {
      opacity: 0.5;
      background: var(--color-bg);
      border-radius: 8px;
    }

    .publicToggleRow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .publicToggleRow label {
      font-weight: normal;
      cursor: pointer;
    }

    .publicToggleRow input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .publicStatus {
      font-size: 12px;
      color: var(--color-text-sub);
    }

    .swapBtn {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: var(--color-accent);
      color: var(--color-accent-text);

      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .checkWrap {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .deleteCheck {
      display: none;
    }

    .checkMark {
      width: 26px;
      height: 26px;
      box-sizing: border-box;
      flex-shrink: 0;
      border: 2px solid var(--color-accent);
      border-radius: 50%;
      background: var(--color-surface);
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 2px 6px var(--color-shadow);
    }

    .deleteCheck:checked + .checkMark {
      background: var(--color-accent);
      transform: scale(1.1);
      box-shadow: 0 4px 12px var(--color-shadow);
    }

    .deleteCheck:checked + .checkMark::after {
      content: "";
      position: absolute;

      left: 50%;
      top: 50%;

      width: 6px;
      height: 12px;

      border: solid white;
      border-width: 0 3px 3px 0;
      transform: translate(-50%, -60%) rotate(45deg);
    }

    /* 他の単語帳から取り込むモーダル */
    .modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    .modalBox {
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .modalDesc {
      font-size: 13px;
      color: var(--color-text-sub);
      margin-bottom: 10px;
    }

    .importBookList,
    .importWordList {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }

    .importBookItem {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .importBookItem:last-child {
      border-bottom: none;
    }

    .importBookItem:hover {
      background: var(--color-bg);
    }

    .importBookItem .bookTitle {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .importBookItem .bookCount {
      font-size: 12px;
      color: var(--color-text-sub);
      flex-shrink: 0;
    }

    .importWordRow {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .importWordRow:last-child {
      border-bottom: none;
    }

    .importWordRow:hover {
      background: var(--color-bg);
    }

    .importWordRow .wordPair {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .smallActionBtn {
      background: var(--color-border);
      color: var(--color-text);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .importEmpty {
      padding: 20px;
      text-align: center;
      color: var(--color-text-sub);
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none" onclick="goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div id="restrictionBanner" class="card" style="display:none; border:2px solid var(--color-danger);">
      <strong>このアカウントは現在制限されています。</strong>
      <p id="restrictionBannerText" style="margin:6px 0 0;"></p>
    </div>

    <div class="card">
      <input id="title" class="titleInput" placeholder="タイトル">
      <textarea id="description" placeholder="説明文を入力してください"></textarea>
      <div id="owner" style="margin-top:10px; color:var(--color-text-sub); font-size:13px;"></div>

      <div class="publicToggleRow">
        <input type="checkbox" id="isPublic" onchange="togglePublic()">
        <label for="isPublic">公開する</label>
        <span class="publicStatus" id="publicStatus"></span>
      </div>
      <p id="forcedPrivateNotice" class="notice" style="display:none;">
        運営により強制的に非公開に設定されているため、この単語帳は公開できません
      </p>

      <button class="danger" onclick="deleteBook()" style="margin-top:15px;">この単語帳を削除</button>
      <div id="msg" class="notice"></div>
    </div>

    <div class="card">
      <button onclick="duplicateBook()" id="duplicateBtn">この単語帳を複製</button>
      <div id="duplicateMsg" class="notice"></div>
    </div>

    <div class="card">
      <h3>単語を追加</h3>
      <div class="wordRow">
        <input id="front" placeholder="例：犬">
        <input id="back" placeholder="例：dog">
      </div>
      <div style="text-align:center;margin-top:10px">
        <button onclick="addWord()">追加</button>
      </div>
    </div>

    <div class="card">
      <h3>単語一覧</h3>
      <div class="wordListHeader wordItemCols">
        <span></span>
        <button id="selectAllBtn" onclick="toggleSelectAllWords()">
          全選択
        </button>
        <span></span>
        <button onclick="reverseSelectedWords()">
          選択項目を表裏反転
        </button>
        <span></span>
        <button class="danger" onclick="deleteSelectedWords()">
          選択削除
        </button>
      </div>
      <p style="font-size:12px;color:var(--color-text-sub);text-align:left;margin:6px 2px;">
        ☰ を掴んでドラッグすると単語の並び順を変更できます
      </p>
      <div id="wordList"></div>
    </div>

    <div class="card">
      <h3>CSV操作</h3>
      <input type="file" id="csvFile" accept=".csv,.txt"><br><br>
      <button onclick="importCSV()">CSV読み込み</button>
      <button onclick="exportCSV()">CSV書き出し</button>
      <button onclick="exportReverseCSV()">逆CSV書き出し</button>
      <button onclick="openImportModal()">他の単語帳から取り込む</button>
    </div>

    <!-- 追加：保存ボタン -->
    <div class="card" style="text-align:center;">
      <button onclick="saveAndBack()">保存</button>
    </div>

  </main>

  <!-- 他の単語帳から単語を取り込むモーダル -->
  <div id="importModal" class="modalOverlay" style="display:none;">
    <div class="modalBox">
      <h3>他の単語帳から取り込む</h3>

      <div id="importStep1">
        <p class="modalDesc">取り込み元の単語帳を選んでください</p>
        <div id="importBookList" class="importBookList"></div>
      </div>

      <div id="importStep2" style="display:none;">
        <p class="modalDesc">取り込む単語を選んでください</p>
        <div style="text-align:right; margin-bottom:8px;">
          <button type="button" class="smallActionBtn" onclick="toggleSelectAllImportWords()">全選択/解除</button>
        </div>
        <div id="importWordList" class="importWordList"></div>
        <div id="importMsg" class="notice"></div>
        <div class="modalActions">
          <button type="button" onclick="backToBookList()">単語帳選択に戻る</button>
          <button type="button" onclick="confirmImportWords()">選択した単語を取り込む</button>
        </div>
      </div>

      <div class="modalActions">
        <button type="button" onclick="closeImportModal()">閉じる</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Firestoreオフラインキャッシュ
    db.enablePersistence({
      synchronizeTabs: true
    }).catch(err => {
      console.log("Persistence:", err.code);
    });

    const params = new URLSearchParams(location.search);
    const bookId = params.get("id");

    let currentUser = null;
    let bookOwner = null;
    let bookForcedPrivate = false;
    let bookListener = null;
    let wordsListener = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    // ログイン情報のキャッシュを利用（他ページと統一されたキー名 "cachedUser" を使用）
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    function handleSignedOut() {
      localStorage.removeItem("cachedUser");
      statusDiv.textContent = "ログアウト中";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      settingsBtn.style.display = "none";
      alert("ログインしてください");
      location.href = "login.html";
    }

    /* Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
       一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
       残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
       未ログインのままかを再確認する（実際はログインしたままなのに強制的に
       ログイン画面へ飛ばされてしまう不具合を防ぐため）。 */
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
        loadBook();
        checkRestrictionStatus(user.uid);
      } else if (localStorage.getItem("cachedUser")) {
        (function () {
          // 端末やネットワークが遅いと1回・1.5秒の再確認だけでは間に合わないことがあるため、
          // 間隔を広げながら最大4回(合計15秒)まで再確認してから本当に未ログインと判断する。
          const delays = [1000, 2000, 4000, 8000];
          const recheck = (i) => {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (i + 1 < delays.length) recheck(i + 1);
              else handleSignedOut();
            }, delays[i]);
          };
          recheck(0);
        })();
      } else {
        handleSignedOut();
      }
    });

    // アカウントが運営によって書き込み制限されているかを確認し、
    // 制限中であれば単語の追加・編集・削除等をブロックしてバナーを表示する
    async function checkRestrictionStatus(uid) {
      try {
        const snap = await db.collection("users").doc(uid).get();
        const data = snap.exists ? snap.data() : null;
        if (!data || !data.restrictedUntil) return;

        const until = data.restrictedUntil.toDate ? data.restrictedUntil.toDate() : new Date(data.restrictedUntil);
        if (until <= new Date()) return;

        window.__isRestricted = true;
        const label = until.getFullYear() >= 2900 ? "無期限" : until.toLocaleDateString("ja-JP") + "まで";
        document.getElementById("restrictionBannerText").textContent =
          `単語帳の編集・単語の追加はできません（解除予定: ${label}）`;
        document.getElementById("restrictionBanner").style.display = "block";
      } catch (e) {
        console.error("restriction check failed", e);
      }
    }

    function blockIfRestricted() {
      if (window.__isRestricted) {
        alert("アカウントが制限されているため、この操作はできません");
        return true;
      }
      return false;
    }

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    }



    async function loadBook() {

      // auth.onAuthStateChangedは状況によって複数回発火することがあり、
      // その都度loadBook()が呼ばれると古いonSnapshotリスナーが解除されないまま
      // 残ってしまう。単語帳を削除した際、この残った古いリスナーが
      // 「ドキュメントが存在しない」を検知して誤って
      // 「単語帳が見つかりません」が表示される不具合があったため、
      // 新しいリスナーを貼る前に既存のリスナーを必ず解除しておく
      if (bookListener) {
        bookListener();
        bookListener = null;
      }
      if (wordsListener) {
        wordsListener();
        wordsListener = null;
      }

      const cacheKey = `edit_${bookId}`;

      // キャッシュを先に表示
      const cache = localStorage.getItem(cacheKey);

      if (cache) {
        try {
          const data = JSON.parse(cache);

          document.getElementById("title").value = data.title;
          document.getElementById("description").value = data.description;
          document.getElementById("owner").textContent = data.owner;
          document.getElementById("wordList").innerHTML = data.wordsHtml;

          if (typeof data.isPublic === "boolean") {
            document.getElementById("isPublic").checked = data.isPublic;
            updatePublicStatusText(data.isPublic);
          }

        } catch(e){}
      }

      // 並び替え機能のため、単語に order フィールドが無い場合はここで一度だけ付与する
      await ensureWordOrder();

      bookListener = db.collection("wordbooks")
        .doc(bookId)
        .onSnapshot(doc => {

          if (!doc.exists) {
            alert("単語帳が見つかりません");
            location.href = "index.html";
            return;
          }

          const data = doc.data();

          bookOwner = data.owner;

          if (currentUser.uid !== bookOwner) {
            alert("他人の単語帳は編集できません");
            location.href = "view.html?id=" + bookId;
            return;
          }

          document.getElementById("title").value =
            data.title || "";

          document.getElementById("description").value =
            data.description || "";

          document.getElementById("owner").textContent =
            "作成者: " + data.ownerName;

          const isPublic = data.isPublic !== false;
          bookForcedPrivate = data.forcedPrivate === true;

          const isPublicCheckbox = document.getElementById("isPublic");
          isPublicCheckbox.checked = isPublic;
          isPublicCheckbox.disabled = bookForcedPrivate;
          document.getElementById("forcedPrivateNotice").style.display = bookForcedPrivate ? "block" : "none";
          updatePublicStatusText(isPublic);

          updateCache();

      });

      wordsListener = db.collection("wordbooks")
        .doc(bookId)
        .collection("words")
        .orderBy("order")
        .onSnapshot(snapshot => {

          const area = document.getElementById("wordList");

          area.innerHTML = "";

          snapshot.forEach(doc => {

            area.insertAdjacentHTML(
              "beforeend",

        // ===== 単語の並び替え（ドラッグ&ドロップ） =====

        // 既存の単語に order フィールドが無い場合、createdAt順に基づいて
        // 一括で付与する（初回のみ実行される移行処理）
        async function ensureWordOrder() {
          const snap = await db.collection("wordbooks")
            .doc(bookId)
            .collection("words")
            .orderBy("createdAt")
            .get();

          if (snap.empty) return;

          const hasMissing = snap.docs.some(d => d.data().order === undefined);
          if (!hasMissing) return;

          const batch = db.batch();
          snap.docs.forEach((d, idx) => {
            batch.update(d.ref, { order: (idx + 1) * 1000 });
          });
          await batch.commit();
        }

        function setupDragReorder(listId) {
          const list = document.getElementById(listId);
          if (!list) return;

          list.addEventListener("pointerdown", (e) => {
            const handle = e.target.closest(".dragHandle");
            if (!handle) return;

            const item = handle.closest(".wordItem");
            if (!item) return;

            e.preventDefault();

            const pointerId = e.pointerId;
            handle.setPointerCapture(pointerId);

            const startRect = item.getBoundingClientRect();
            const startY = e.clientY;

            // ドラッグ中、元の場所を確保しておくためのプレースホルダーを挿入
            const placeholder = document.createElement("div");
            placeholder.className = "wordItemPlaceholder";
            placeholder.style.height = startRect.height + "px";
            item.parentNode.insertBefore(placeholder, item.nextSibling);

            // 要素を画面に固定し、ポインターに追従して自由に動かせるようにする
            item.classList.add("dragging");
            item.style.position = "fixed";
            item.style.top = startRect.top + "px";
            item.style.left = startRect.left + "px";
            item.style.width = startRect.width + "px";

            const onMove = (ev) => {
              if (ev.pointerId !== pointerId) return;

              // ポインターの動きにそのまま追従させる（浮き上がった状態で移動）
              const deltaY = ev.clientY - startY;
              item.style.top = (startRect.top + deltaY) + "px";

              const currentCenter = startRect.top + startRect.height / 2 + deltaY;

              const siblings = Array.from(list.querySelectorAll(".wordItem:not(.dragging)"));

              let after = null;
              for (const sib of siblings) {
                const box = sib.getBoundingClientRect();
                if (currentCenter < box.top + box.height / 2) {
                  after = sib;
                  break;
                }
              }

              movePlaceholder(list, placeholder, after);
            };

            const onUp = (ev) => {
              if (ev.pointerId !== pointerId) return;

              handle.releasePointerCapture(pointerId);
              handle.removeEventListener("pointermove", onMove);
              handle.removeEventListener("pointerup", onUp);
              handle.removeEventListener("pointercancel", onUp);

              // プレースホルダーの位置に要素を戻し、固定表示を解除する
              placeholder.parentNode.insertBefore(item, placeholder);
              placeholder.remove();

              item.classList.remove("dragging");
              item.style.position = "";
              item.style.top = "";
              item.style.left = "";
              item.style.width = "";

              finalizeWordOrder(list);
            };

            handle.addEventListener("pointermove", onMove);
            handle.addEventListener("pointerup", onUp);
            handle.addEventListener("pointercancel", onUp);
          });
        }

        // プレースホルダーの移動先が変わったとき、他の単語がなめらかに
        // スライドして見えるようにする（FLIPテクニック）
        function movePlaceholder(list, placeholder, after) {
          const currentNext = placeholder.nextElementSibling || null;
          const target = after || null;

          if (target === placeholder) return;
          if (target === currentNext) return;

          const items = Array.from(list.children).filter(
            el => !el.classList.contains("dragging")
          );

          const firstRects = new Map();
          items.forEach(el => firstRects.set(el, el.getBoundingClientRect()));

          if (target) {
            list.insertBefore(placeholder, target);
          } else {
            list.appendChild(placeholder);
          }

          items.forEach(el => {
            const first = firstRects.get(el);
            const last = el.getBoundingClientRect();
            const deltaY = first.top - last.top;

            if (deltaY) {
              el.style.transition = "none";
              el.style.transform = `translateY(${deltaY}px)`;
              requestAnimationFrame(() => {
                el.style.transition = "transform 0.15s ease";
                el.style.transform = "";
              });
            }
          });
        }

        async function finalizeWordOrder(list) {
          if (blockIfRestricted()) return;

          const items = Array.from(list.querySelectorAll(".wordItem"));

          try {
            const batch = db.batch();
            items.forEach((item, idx) => {
              const id = item.id.replace("word_", "");
              const ref = db.collection("wordbooks")
                .doc(bookId)
                .collection("words")
                .doc(id);
              batch.update(ref, { order: (idx + 1) * 1000 });
            });
            await batch.commit();
            updateCache();
          } catch (e) {
            console.error(e);
            alert("並び替えの保存に失敗しました");
          }
        }

    async function duplicateBook() {
      if (blockIfRestricted()) return;

      const duplicateBtn = document.getElementById("duplicateBtn");
      const duplicateMsg = document.getElementById("duplicateMsg");

      if (!confirm("この単語帳を複製しますか？")) return;

      duplicateBtn.disabled = true;
      duplicateMsg.className = "notice";
      duplicateMsg.textContent = "複製しています...";

      try {
        // 保存済みの最新データを取得する（入力欄の未保存の変更には依存しない）
        const bookSnap = await db.collection("wordbooks").doc(bookId).get();

        if (!bookSnap.exists) {
          duplicateMsg.textContent = "単語帳が見つかりません";
          duplicateBtn.disabled = false;
          return;
        }

        const bookData = bookSnap.data();

        // 単語のサブコレクションを複製する
        const wordsSnap = await db.collection("wordbooks")
          .doc(bookId)
          .collection("words")
          .orderBy("createdAt")
          .get();

        // list.html/view.htmlが未ログインの閲覧者にも作成者の写真を表示できるよう、
        // ownerNameと同様にwordbookドキュメント側へ写真も複製して保存しておく
        // （usersコレクションの読み取りにはログインが必要なため）
        let ownerPhotoURL = null;
        try {
          const ownerDoc = await db.collection("users").doc(currentUser.uid).get();
          ownerPhotoURL = ownerDoc.exists ? (ownerDoc.data().photoURL || null) : null;
        } catch (e) {
          console.warn("自分の写真の取得に失敗しました", e);
        }

        // 新しい単語帳を作成する（タイトルに「のコピー」を付与）。
        // wordCountは元のフィールド値ではなく、実際にコピーする単語数を使う
        // （元データのwordCountフィールドが何らかの理由で実数とズレていた場合の不整合を防ぐため）
        const newBookRef = await db.collection("wordbooks").add({
          title: (bookData.title || "") + "のコピー",
          description: bookData.description || "",
          isPublic: bookData.isPublic !== undefined ? bookData.isPublic : true,
          owner: currentUser.uid,
          ownerName: currentUser.displayName || "名無し",
          ownerPhotoURL: ownerPhotoURL,
          wordCount: wordsSnap.size,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Firestoreのバッチは1回あたり最大500件の操作制限があるため、
        // 単語数が多い場合に備えて複数バッチに分割する
        const BATCH_LIMIT = 450;
        let batch = db.batch();
        let opCount = 0;

        for (const wordDoc of wordsSnap.docs) {
          const w = wordDoc.data();
          const newWordRef = newBookRef.collection("words").doc();

          const newWordData = {
            front: w.front,
            back: w.back,
            createdAt: w.createdAt || firebase.firestore.FieldValue.serverTimestamp()
          };
          if (w.order !== undefined) {
            newWordData.order = w.order;
          }
          batch.set(newWordRef, newWordData);

          opCount++;

          if (opCount >= BATCH_LIMIT) {
            await batch.commit();
            batch = db.batch();
            opCount = 0;
          }
        }

        if (opCount > 0) {
          await batch.commit();
        }

        duplicateMsg.className = "success";
        duplicateMsg.textContent = "複製しました";

        // 複製した単語帳の編集画面を開く
        location.href = "edit.html?id=" + newBookRef.id;

      } catch (e) {
        console.error(e);
        duplicateMsg.textContent = "複製に失敗しました: " + e.message;
        duplicateBtn.disabled = false;
      }
    }

    // 単語一覧の各行でEnterを押すと、左→右→次の行の左→次の行の右…の順にフォーカスが移動する
    // (変更を保存するとFirestoreのonSnapshotで行DOMが丸ごと再構築されるため、
    //  移動先を pendingWordFocus に記録しておき、再構築後にも再度フォーカスを当て直す)
    let pendingWordFocus = null;

    function applyPendingWordFocus() {
      if (!pendingWordFocus) return;
      const row = document.getElementById("word_" + pendingWordFocus.id);
      const input = row && row.querySelector(`[data-type="${pendingWordFocus.type}"]`);
      if (input) {
        input.focus();
        pendingWordFocus = null;
      }
    }

    document.getElementById("wordList").addEventListener("keydown", function (event) {
      if (event.key !== "Enter") return;
      const target = event.target;
      if (!target.classList || !target.classList.contains("editInput")) return;

      const row = target.closest(".wordItem");
      if (!row) return;

      event.preventDefault();

      let targetRow = row;
      let targetType = "front";
      if (target.dataset.type === "front") {
        targetType = "back";
      } else {
        targetRow = row.nextElementSibling;
      }
      if (!targetRow) return;

      pendingWordFocus = { id: targetRow.id.replace(/^word_/, ""), type: targetType };
      applyPendingWordFocus();
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

                data-type="back">

    }

  const allChecked = Array.from(checks).every(c => c.checked);
  checks.forEach(c => c.checked = !allChecked);
}

function closeImportModal() {
  document.getElementById("importModal").style.display = "none";
  importSelectedBookId = null;
  importWords = [];
}

async function confirmImportWords() {
  if (blockIfRestricted()) return;

  const checks = document.querySelectorAll(".importWordCheck:checked");
  const selectedIds = Array.from(checks).map(c => c.dataset.id);

  if (selectedIds.length === 0) {
    document.getElementById("importMsg").textContent = "取り込む単語を選択してください";
    return;
  }

  const importMsg = document.getElementById("importMsg");
  importMsg.textContent = "取り込んでいます...";

  try {
    // 現在の単語帳に既にある単語の中で、最も新しいcreatedAtを基準にする。
    // これより後の時刻を選択順に割り振ることで、取り込んだ単語が必ず一番下に
    // 元の順番通りに並ぶようにする。
    const existingSnap = await db.collection("wordbooks")
      .doc(bookId)
      .collection("words")
      .orderBy("createdAt", "desc")
      .limit(1)
      .get();

    let baseTime = Date.now();
    if (!existingSnap.empty) {
      const lastCreatedAt = existingSnap.docs[0].data().createdAt;
      if (lastCreatedAt && typeof lastCreatedAt.toMillis === "function") {
        baseTime = Math.max(baseTime, lastCreatedAt.toMillis() + 1);
      }
    }

    // 選択された単語を、取り込み元での並び順を保ったまま処理する
    const selectedIdSet = new Set(selectedIds);
    const orderedSelected = importWords.filter(w => selectedIdSet.has(w.id));

    let addedCount = 0;
    for (let idx = 0; idx < orderedSelected.length; idx++) {
      const w = orderedSelected[idx];
      await db.collection("wordbooks").doc(bookId).collection("words").add({
        front: w.front,
        back: w.back,
        createdAt: new Date(baseTime + idx),
        order: baseTime + idx
      });
      addedCount++;
    }

    if (addedCount > 0) {
      await db.collection("wordbooks").doc(bookId).update({
        wordCount: firebase.firestore.FieldValue.increment(addedCount)
      });
    }

    updateCache();
    closeImportModal();

  } catch (e) {
    console.error(e);
    importMsg.textContent = "取り込みに失敗しました: " + e.message;
  }
}

function toggleSelectAllWords() {
  const checks = document.querySelectorAll("#wordList .deleteCheck");
  const btn = document.getElementById("selectAllBtn");

  if (checks.length === 0) return;

  const allChecked = Array.from(checks).every(cb => cb.checked);

  checks.forEach(cb => cb.checked = !allChecked);
  btn.textContent = allChecked ? "全選択" : "全解除";
}

async function reverseSelectedWords() {
  if (blockIfRestricted()) return;

  const checks = document.querySelectorAll(".deleteCheck:checked");

  if (checks.length === 0) {
    alert("単語を選択してください");
    return;
  }

  if (!confirm(`${checks.length}個の単語の表裏を入れ替えますか？`)) {
    return;
  }

  const batch = db.batch();

  for (const check of checks) {
    const ref = db.collection("wordbooks")
      .doc(bookId)
      .collection("words")
      .doc(check.value);

    const doc = await ref.get();
    const data = doc.data();

    batch.update(ref, {
      front: data.back,
      back: data.front
    });
  }

  await batch.commit();
  updateCache();

  alert("表裏を入れ替えました");
}

async function swapWord(id) {
  if (blockIfRestricted()) return;

  const row = document.getElementById("word_" + id);

  const frontInput = row.querySelector('[data-type="front"]');
  const backInput = row.querySelector('[data-type="back"]');

  const f = frontInput.value;
  const b = backInput.value;

  frontInput.value = b;
  backInput.value = f;

  await db.collection("wordbooks")
    .doc(bookId)
    .collection("words")
    .doc(id)
    .update({
      front: b,
      back: f
    });

  updateCache();
}

  }

  if (wordsListener) {
    wordsListener();
  }

});
