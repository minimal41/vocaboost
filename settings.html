<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>設定</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .card h2 {
      margin-top: 0;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      width: 90%;
      margin-top: 8px;
    }

    .notice {
      color: var(--color-danger);
    }

    .success {
      color: var(--color-success);
    }

    /* ===== プロフィール写真設定 ===== */
    .avatar-preview {
      width: 96px;
      height: 96px;
      margin: 0 auto 15px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-icon {
      width: 60%;
      height: 60%;
      color: var(--color-text-sub);
      display: flex;
    }

    .avatar-icon svg {
      width: 100%;
      height: 100%;
    }

    /* ===== プロフィール写真：トリミングモーダル ===== */
    .cropModalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      box-sizing: border-box;
    }

    .cropModalBox {
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
      text-align: center;
    }

    .cropModalDesc {
      font-size: 12px;
      color: var(--color-text-sub);
      margin: 4px 0 14px;
    }

    .cropViewport {
      width: 260px;
      height: 260px;
      margin: 0 auto;
      max-width: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--color-bg);
      position: relative;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .cropViewport.dragging {
      cursor: grabbing;
    }

    .cropViewport img {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      pointer-events: none;
    }

    .cropZoomSlider {
      width: 260px;
      max-width: 100%;
      margin: 14px auto 0;
      display: block;
    }

    .cropModalActions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    /* ===== 表示設定（フォント・ダークモード） ===== */
    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
    }

    .option-row:last-child {
      border-bottom: none;
    }

    .option-row-clickable {
      cursor: pointer;
      user-select: none;
      transition: background-color .15s;
      margin: 0 -10px;
      padding: 14px 10px;
      border-radius: 8px;
    }

    .option-row-clickable:hover {
      background-color: var(--color-bg);
    }

    .option-row .option-label {
      font-weight: bold;
    }

    .option-row .option-desc {
      font-size: 12px;
      color: var(--color-text-sub);
      font-weight: normal;
      margin-top: 2px;
    }

    /* フォント選択：検索ボックス */
    .font-search {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 14px;
      margin-top: 10px;
    }

    /* フォント選択：リスト */
    .font-list {
      margin-top: 10px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }

    .font-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background-color .15s;
    }

    .font-item:last-child {
      border-bottom: none;
    }

    .font-item:hover {
      background: var(--color-bg);
    }

    .font-item.active {
      background: var(--color-accent);
    }

    .font-item.active .font-item-label,
    .font-item.active .font-item-category {
      color: var(--color-accent-text);
    }

    .font-item-main {
      min-width: 0;
      flex: 1;
    }

    .font-item-label {
      font-size: 15px;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .font-item-category {
      font-size: 12px;
      color: var(--color-text-sub);
      margin-top: 2px;
    }

    .font-item-preview {
      font-size: 18px;
      color: var(--color-text);
      flex-shrink: 0;
    }

    .font-item.active .font-item-preview {
      color: var(--color-accent-text);
    }

    .font-list-empty {
      padding: 20px;
      text-align: center;
      color: var(--color-text-sub);
      font-size: 14px;
    }

    /* ダークモード：トグルスイッチ */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-track {
      position: absolute;
      cursor: pointer;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: var(--color-border);
      border-radius: 28px;
      transition: .2s;
    }

    .switch-track::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .2s;
    }

    .switch input:checked + .switch-track {
      background-color: var(--color-accent);
    }

    .switch input:checked + .switch-track::before {
      transform: translateX(22px);
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none" onclick="goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>

    <div class="card">
      <h2>ユーザー情報</h2>
      <p>UID: <span id="uid"></span></p>
      <p>Email: <span id="email"></span></p>
      <p>ユーザー名: <span id="usernameText">未設定</span></p>
      <p>作成した単語帳数: <span id="bookCount">0</span></p>
    </div>

    <div class="card">
      <h2>プロフィール写真</h2>
      <div class="avatar-preview">
        <img id="avatarImg" alt="プロフィール写真" style="display:none;">
        <span id="avatarIcon" class="avatar-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9Z"/></svg>
        </span>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none">
      <button type="button" onclick="document.getElementById('avatarInput').click()">写真を選択</button>
      <button type="button" id="avatarRemoveBtn" onclick="removeAvatar()" style="display:none;">削除する</button>
      <div id="avatarMsg" class="notice"></div>
    </div>

    <div class="card">
      <h2>ユーザー名設定・変更</h2>
      <form autocomplete="off" onsubmit="return false;">
        <input type="text" id="usernameInput" name="vocaboost_username_change" placeholder="新しいユーザー名" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" onclick="updateUsername()">変更する</button>
      </form>
      <div id="nameMsg" class="notice"></div>
    </div>

    <div class="card">
      <h2>パスワード変更</h2>
      <form autocomplete="off" onsubmit="return false;">
        <input type="password" id="currentPass" name="vocaboost_current_pass" placeholder="現在のパスワード" autocomplete="off">
        <input type="password" id="newPass" name="vocaboost_new_pass" placeholder="新しいパスワード" autocomplete="new-password">
        <input type="password" id="newPassConfirm" name="vocaboost_new_pass_confirm" placeholder="新しいパスワード（確認）" autocomplete="new-password">
        <button type="button" onclick="changePassword()">変更する</button>
      </form>
      <div id="passMsg" class="notice"></div>
    </div>

    <div class="card">
      <h2>表示設定</h2>

      <div class="option-row" style="display:block;">
        <div class="option-label">フォント</div>
        <div class="option-desc">サイト全体の文字フォントを変更します（Google Fontsの日本語対応フォントから選べます）</div>

        <input
          type="text"
          id="fontSearch"
          class="font-search"
          placeholder="フォント名やカテゴリで検索（例：明朝、丸ゴシック、Noto）"
          autocomplete="off"
        >

        <div class="font-list" id="fontList"></div>
      </div>

      <label class="option-row option-row-clickable" for="darkModeToggle">
        <div>
          <div class="option-label">ダークモード</div>
          <div class="option-desc">画面全体を暗い配色に切り替えます</div>
        </div>
        <span class="switch">
          <input type="checkbox" id="darkModeToggle">
          <span class="switch-track"></span>
        </span>
      </label>
    </div>

  </main>

  <div id="cropModal" class="cropModalOverlay" style="display:none;">
    <div class="cropModalBox">
      <h3>写真の位置を調整</h3>
      <p class="cropModalDesc">ドラッグで位置を、スライダーで拡大・縮小を調整できます</p>
      <div id="cropViewport" class="cropViewport">
        <img id="cropImage" alt="" draggable="false">
      </div>
      <input type="range" id="cropZoom" class="cropZoomSlider" min="100" max="300" value="100">
      <div class="cropModalActions">
        <button type="button" onclick="cancelCrop()">キャンセル</button>
        <button type="button" onclick="confirmCrop()">この写真にする</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    /* ===== Firebase設定（完全版） ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    const uidSpan = document.getElementById("uid");
    const emailSpan = document.getElementById("email");
    const usernameTextSpan = document.getElementById("usernameText");
    const bookCountSpan = document.getElementById("bookCount");

    // ログイン情報のキャッシュを利用してヘッダーを即時表示
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    // ユーザー情報（UID・Email・ユーザー名・単語帳数）のキャッシュを利用して即時表示する。
    // Firebaseの認証確認(非同期)が完了するまで欄が空白のままになるのを防ぐ。
    const PROFILE_CACHE_KEY = "settingsProfileCache";
    const cachedProfile = JSON.parse(localStorage.getItem(PROFILE_CACHE_KEY) || "null");

    if (cachedProfile) {
      uidSpan.textContent = cachedProfile.uid || "";
      emailSpan.textContent = cachedProfile.email || "";
      usernameTextSpan.textContent = cachedProfile.username || "未設定";
      bookCountSpan.textContent = cachedProfile.bookCount ?? 0;
    }

    /* ===== プロフィール写真 =====
       account-widgets.js の読み込みタイミングに依存しないよう、
       このページ内で完結する形で写真の表示・検証・アップロードを行う。 */
    const PROFILE_PHOTO_DATA_URL_RE = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
    const AVATAR_OUTPUT_SIZE = 480;

    function isValidPhotoDataUrl(url) {
      return typeof url === "string" && PROFILE_PHOTO_DATA_URL_RE.test(url);
    }

    let currentPhotoURL = (cachedProfile && cachedProfile.photoURL) || null;

    const avatarImg = document.getElementById("avatarImg");
    const avatarIcon = document.getElementById("avatarIcon");
    const avatarRemoveBtn = document.getElementById("avatarRemoveBtn");

    function renderAvatarPreview() {
      if (isValidPhotoDataUrl(currentPhotoURL)) {
        avatarImg.src = currentPhotoURL;
        avatarImg.style.display = "block";
        avatarIcon.style.display = "none";
        avatarRemoveBtn.style.display = "inline-block";
      } else {
        avatarImg.style.display = "none";
        avatarIcon.style.display = "flex";
        avatarRemoveBtn.style.display = "none";
      }
    }

    renderAvatarPreview();

    async function loadAvatar() {
      try {
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        const data = userDoc.exists ? userDoc.data() : {};
        currentPhotoURL = data.photoURL || null;
        renderAvatarPreview();
        saveProfileCache({ photoURL: currentPhotoURL });
      } catch (e) {
        console.error(e);
      }
    }

    /* ===== トリミングモーダル =====
       選択した画像を丸い枠(cropViewport)の中でドラッグ移動・スライダーでの拡大縮小により
       自分で構図を決められるようにし、確定時に枠内に写っている範囲だけを
       AVATAR_OUTPUT_SIZE 四方のJPEGとして書き出す。 */
    const CROP_VIEWPORT_SIZE = 260;

    const cropModal = document.getElementById("cropModal");
    const cropViewport = document.getElementById("cropViewport");
    const cropImage = document.getElementById("cropImage");
    const cropZoom = document.getElementById("cropZoom");

    let cropNaturalWidth = 0;
    let cropNaturalHeight = 0;
    let cropBaseScale = 1;
    let cropOffsetX = 0;
    let cropOffsetY = 0;
    let cropZoomValue = 100;
    let cropDragging = false;
    let cropDragStartX = 0;
    let cropDragStartY = 0;
    let cropDragStartOffsetX = 0;
    let cropDragStartOffsetY = 0;

    function cropCurrentScale() {
      return cropBaseScale * (cropZoomValue / 100);
    }

    // 画像が常に丸い枠を隙間なく覆うように、オフセットの取りうる範囲を制限する
    function clampCropOffset() {
      const scale = cropCurrentScale();
      const scaledW = cropNaturalWidth * scale;
      const scaledH = cropNaturalHeight * scale;
      const minX = Math.min(0, CROP_VIEWPORT_SIZE - scaledW);
      const minY = Math.min(0, CROP_VIEWPORT_SIZE - scaledH);
      cropOffsetX = Math.min(0, Math.max(minX, cropOffsetX));
      cropOffsetY = Math.min(0, Math.max(minY, cropOffsetY));
    }

    function applyCropTransform() {
      const scale = cropCurrentScale();
      cropImage.style.width = (cropNaturalWidth * scale) + "px";
      cropImage.style.height = (cropNaturalHeight * scale) + "px";
      cropImage.style.left = cropOffsetX + "px";
      cropImage.style.top = cropOffsetY + "px";
    }

    function openCropModal(dataUrl) {
      cropImage.onload = () => {
        cropNaturalWidth = cropImage.naturalWidth;
        cropNaturalHeight = cropImage.naturalHeight;
        // 「cover」相当（枠より小さい辺のほうを基準に拡大し、隙間ができないようにする）
        cropBaseScale = Math.max(
          CROP_VIEWPORT_SIZE / cropNaturalWidth,
          CROP_VIEWPORT_SIZE / cropNaturalHeight
        );
        cropZoomValue = 100;
        cropZoom.value = 100;
        cropOffsetX = (CROP_VIEWPORT_SIZE - cropNaturalWidth * cropBaseScale) / 2;
        cropOffsetY = (CROP_VIEWPORT_SIZE - cropNaturalHeight * cropBaseScale) / 2;
        applyCropTransform();
        cropModal.style.display = "flex";
      };
      cropImage.src = dataUrl;
    }

    function closeCropModal() {
      cropModal.style.display = "none";
      cropImage.src = "";
    }

    function cropOffsetFromPointer(e) {
      const dx = e.clientX - cropDragStartX;
      const dy = e.clientY - cropDragStartY;
      cropOffsetX = cropDragStartOffsetX + dx;
      cropOffsetY = cropDragStartOffsetY + dy;
      clampCropOffset();
      applyCropTransform();
    }

    cropViewport.addEventListener("pointerdown", (e) => {
      cropDragging = true;
      cropViewport.classList.add("dragging");
      cropDragStartX = e.clientX;
      cropDragStartY = e.clientY;
      cropDragStartOffsetX = cropOffsetX;
      cropDragStartOffsetY = cropOffsetY;
      cropViewport.setPointerCapture(e.pointerId);
    });

    cropViewport.addEventListener("pointermove", (e) => {
      if (!cropDragging) return;
      cropOffsetFromPointer(e);
    });

    function endCropDrag() {
      cropDragging = false;
      cropViewport.classList.remove("dragging");
    }

    cropViewport.addEventListener("pointerup", endCropDrag);
    cropViewport.addEventListener("pointercancel", endCropDrag);

    cropZoom.addEventListener("input", () => {
      const oldScale = cropCurrentScale();
      cropZoomValue = Number(cropZoom.value);
      const newScale = cropCurrentScale();

      // 枠の中心が指す画像上の位置を、ズーム後も変わらないようにする
      const center = CROP_VIEWPORT_SIZE / 2;
      const imgX = (center - cropOffsetX) / oldScale;
      const imgY = (center - cropOffsetY) / oldScale;
      cropOffsetX = center - imgX * newScale;
      cropOffsetY = center - imgY * newScale;

      clampCropOffset();
      applyCropTransform();
    });

    function cancelCrop() {
      closeCropModal();
    }

    // list.html/view.htmlは未ログインの閲覧者でも作成者の写真を表示できるよう、
    // wordbookドキュメント側にownerPhotoURLとして写真を複製して持っている。
    // 写真を変更・削除した際は、自分が既に作成済みの単語帳にもこの複製を反映する。
    async function propagatePhotoToOwnedBooks(photoURL) {
      try {
        const snap = await db.collection("wordbooks")
          .where("owner", "==", currentUser.uid)
          .get();

        if (snap.empty) return;

        const BATCH_LIMIT = 450;
        let batch = db.batch();
        let opCount = 0;

        for (const doc of snap.docs) {
          batch.update(doc.ref, { ownerPhotoURL: photoURL });
          opCount++;
          if (opCount >= BATCH_LIMIT) {
            await batch.commit();
            batch = db.batch();
            opCount = 0;
          }
        }

        if (opCount > 0) {
          await batch.commit();
        }
      } catch (e) {
        console.error("所有する単語帳への写真の反映に失敗しました", e);
      }
    }

    async function confirmCrop() {
      const msg = document.getElementById("avatarMsg");
      const scale = cropCurrentScale();
      const sSize = CROP_VIEWPORT_SIZE / scale;
      const sx = -cropOffsetX / scale;
      const sy = -cropOffsetY / scale;

      const canvas = document.createElement("canvas");
      canvas.width = AVATAR_OUTPUT_SIZE;
      canvas.height = AVATAR_OUTPUT_SIZE;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(cropImage, sx, sy, sSize, sSize, 0, 0, AVATAR_OUTPUT_SIZE, AVATAR_OUTPUT_SIZE);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);

      closeCropModal();

      msg.textContent = "アップロード中...";
      msg.className = "notice";

      try {
        await db.collection("users").doc(currentUser.uid).set({
          photoURL: dataUrl
        }, { merge: true });

        currentPhotoURL = dataUrl;
        renderAvatarPreview();
        saveProfileCache({ photoURL: dataUrl });
        propagatePhotoToOwnedBooks(dataUrl);

        msg.textContent = "プロフィール写真を変更しました";
        msg.className = "success";
      } catch (err) {
        console.error(err);
        msg.textContent = "エラー: " + err.message;
        msg.className = "notice";
      }
    }

    document.getElementById("avatarInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;

      const msg = document.getElementById("avatarMsg");

      if (!file.type.startsWith("image/")) {
        msg.textContent = "画像ファイルを選択してください";
        msg.className = "notice";
        return;
      }

      msg.textContent = "";
      msg.className = "notice";

      const reader = new FileReader();
      reader.onerror = () => {
        msg.textContent = "ファイルの読み込みに失敗しました";
        msg.className = "notice";
      };
      reader.onload = () => openCropModal(reader.result);
      reader.readAsDataURL(file);
    });

    async function removeAvatar() {
      const msg = document.getElementById("avatarMsg");
      try {
        await db.collection("users").doc(currentUser.uid).set({
          photoURL: firebase.firestore.FieldValue.delete()
        }, { merge: true });

        currentPhotoURL = null;
        renderAvatarPreview();
        saveProfileCache({ photoURL: null });
        propagatePhotoToOwnedBooks(null);

        msg.textContent = "プロフィール写真を削除しました";
        msg.className = "success";
      } catch (err) {
        console.error(err);
        msg.textContent = "エラー: " + err.message;
        msg.className = "notice";
      }
    }

    function saveProfileCache(partial) {
      const current = JSON.parse(localStorage.getItem(PROFILE_CACHE_KEY) || "null") || {};
      const updated = { ...current, ...partial };
      localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(updated));
    }

    function handleSignedOut() {
      localStorage.removeItem("cachedUser");
      localStorage.removeItem(PROFILE_CACHE_KEY);
      location.href = "login.html";
    }

    /* ===== ログインチェック =====
       Firebaseが端末に保存された認証状態を復元し終える前に、
       onAuthStateChangedが一時的にnullで発火することがある。
       ログイン中のキャッシュ(cachedUser)が残っている場合は即座にログアウト扱いにせず、
       少し待ってから本当に未ログインのままかを再確認する
       （その間に正しいユーザーで再度発火すれば、このタイマーは何もしない）。
       これにより、実際はログインしたままなのに強制的にログイン画面へ
       飛ばされてしまう不具合を防ぐ。 */
    auth.onAuthStateChanged(async user => {
      if (!user) {
        if (localStorage.getItem("cachedUser")) {
          setTimeout(() => {
            if (!auth.currentUser) handleSignedOut();
          }, 1500);
          return;
        }
        handleSignedOut();
        return;
      }

      currentUser = user;

      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";

        uidSpan.textContent = user.uid;
        emailSpan.textContent = user.email;
        usernameTextSpan.textContent = user.displayName || "未設定";

        saveProfileCache({
          uid: user.uid,
          email: user.email,
          username: user.displayName || "未設定"
        });

        loadBookCount();
        cleanupEmptyBooks();
        loadAvatar();
      } else {
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        settingsBtn.style.display = "none";
      }
    });

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      localStorage.removeItem(PROFILE_CACHE_KEY);
      auth.signOut();
    }

    /* ===== 作成単語帳数 ===== */
    async function loadBookCount() {
      try {
        const snap = await db.collection("wordbooks")
          .where("owner", "==", currentUser.uid)
          .get();

        bookCountSpan.textContent = snap.size;
        saveProfileCache({ bookCount: snap.size });
      } catch (e) {
        console.error(e);
      }
    }

    /* ===== 空の単語帳を自動削除 (DBからも完全に消去) ===== */
    async function cleanupEmptyBooks() {
      try {
        // wordCountフィールドで絞り込み、削除候補になりうる単語帳だけを取得する。
        // 単語帳が増えるほど全件取得が重くなるのを避けるための最適化。
        let snap;
        try {
          snap = await db.collection("wordbooks")
            .where("owner", "==", currentUser.uid)
            .where("wordCount", "==", 0)
            .get();
        } catch (e) {
          // 複合インデックスが無い環境向けのフォールバック
          console.warn("wordCount絞り込みクエリに失敗。全件取得にフォールバックします。", e);
          const all = await db.collection("wordbooks")
            .where("owner", "==", currentUser.uid)
            .get();
          snap = {
            docs: all.docs.filter(d => (d.data().wordCount || 0) === 0)
          };
        }

        const now = Date.now();
        const ONE_HOUR = 60 * 60 * 1000;

        for (const doc of snap.docs) {
          const data = doc.data();

          // 作成直後のものを消さないよう、1時間以上経過しているかチェック
          const createdAt = data.createdAt ? data.createdAt.toDate().getTime() : 0;

          if (now - createdAt <= ONE_HOUR) continue;

          // wordCountが0でも古いデータでフィールド自体が無い/不整合な場合があるため、
          // 削除前に実際のサブコレクションも確認する（最大1件だけ取得すれば十分）
          const wordsSnap = await db.collection("wordbooks").doc(doc.id).collection("words").limit(1).get();

          if (wordsSnap.empty) {
            await db.collection("wordbooks").doc(doc.id).delete();
            console.log("Cleanup: Deleted empty book", doc.id);
          }
        }
        // 削除後にカウントを更新
        loadBookCount();
      } catch (e) {
        console.warn("Cleanup failed:", e);
      }
    }

    /* ===== ユーザー名変更 ===== */
    async function updateUsername() {
      const newName = document.getElementById("usernameInput").value.trim();
      const msg = document.getElementById("nameMsg");

      if (!newName) {
        msg.textContent = "ユーザー名を入力してください";
        msg.className = "notice";
        return;
      }

      try {
        await currentUser.updateProfile({
          displayName: newName
        });

        await db.collection("users").doc(currentUser.uid).set({
          username: newName
        }, { merge: true });

        usernameTextSpan.textContent = newName;
        saveProfileCache({ username: newName });
        msg.textContent = "ユーザー名を変更しました";
        msg.className = "success";
        document.getElementById("usernameInput").value = "";
      } catch (e) {
        msg.textContent = "エラー: " + e.message;
        msg.className = "notice";
      }
    }

    /* ===== パスワード変更 ===== */
    async function changePassword() {
      const current = document.getElementById("currentPass").value;
      const newPass = document.getElementById("newPass").value;
      const newPassConfirm = document.getElementById("newPassConfirm").value;
      const msg = document.getElementById("passMsg");

      if (!current || !newPass || !newPassConfirm) {
        msg.textContent = "すべて入力してください";
        msg.className = "notice";
        return;
      }

      if (newPass !== newPassConfirm) {
        msg.textContent = "新しいパスワードが一致しません";
        msg.className = "notice";
        return;
      }

      try {
        const cred = firebase.auth.EmailAuthProvider.credential(
          currentUser.email,
          current
        );

        await currentUser.reauthenticateWithCredential(cred);
        await currentUser.updatePassword(newPass);

        msg.textContent = "パスワードを変更しました";
        msg.className = "success";

        document.getElementById("currentPass").value = "";
        document.getElementById("newPass").value = "";
        document.getElementById("newPassConfirm").value = "";
      } catch (e) {
        msg.textContent = "エラー: " + e.message;
        msg.className = "notice";
      }
    }

    // ブラウザのパスワードマネージャーが自動入力したメールアドレス断片などが
    // ユーザー名入力欄に残ってしまう場合があるため、複数のタイミングでクリアする
    function clearUsernameAutofill() {
      const input = document.getElementById("usernameInput");
      if (input) input.value = "";
    }

    window.addEventListener("load", () => {
      clearUsernameAutofill();
      setTimeout(clearUsernameAutofill, 100);
      setTimeout(clearUsernameAutofill, 500);
    });

    document.addEventListener("DOMContentLoaded", clearUsernameAutofill);

    /* ===== フォント・ダークモード設定 =====
       theme.js が起動時に <html data-theme> / --font-family をセット済み。
       ここでは設定ページ上のUI状態をそれに合わせ、変更時にlocalStorageへ保存する。 */
    const FONT_KEY = "vocaboost_font";
    const THEME_KEY = "vocaboost_theme";
    const DEFAULT_FONT = "standard";

    const fontSearch = document.getElementById("fontSearch");
    const fontList = document.getElementById("fontList");
    const darkModeToggle = document.getElementById("darkModeToggle");

    // 「標準」を先頭に追加した全フォントリスト
    const ALL_FONTS = [
      { family: "standard", label: "標準", category: "OS標準フォント" },
      ...window.VOCABOOST_GOOGLE_FONTS
    ];

    const currentFont = localStorage.getItem(FONT_KEY) || DEFAULT_FONT;

    // フォントのプレビュー表示用に、まだ読み込んでいないフォントのCSSを読み込む
    // （Google Fonts / ローカル同梱フォントの読み込みは theme.js の共通関数に委譲する）
    function ensurePreviewFontLoaded(entry) {
      if (entry.family === "standard") return;
      window.VOCABOOST_LOAD_FONT(entry);
    }

    function selectFont(font) {
      localStorage.setItem(FONT_KEY, font);

      if (font === "standard") {
        document.documentElement.style.removeProperty("--font-family");
        document.documentElement.setAttribute("data-font", "standard");
      } else {
        const entry = ALL_FONTS.find(f => f.family === font);
        document.documentElement.removeAttribute("data-font");
        if (entry) {
          ensurePreviewFontLoaded(entry);
          document.documentElement.style.setProperty(
            "--font-family",
            `"${entry.family}", var(--font-standard)`
          );
        }
      }

      renderFontList(fontSearch.value);
    }

    function renderFontList(query) {
      const q = (query || "").trim().toLowerCase();

      const filtered = ALL_FONTS.filter(f =>
        f.label.toLowerCase().includes(q) ||
        f.family.toLowerCase().includes(q) ||
        (f.category || "").toLowerCase().includes(q)
      );

      fontList.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "font-list-empty";
        empty.textContent = "該当するフォントが見つかりません";
        fontList.appendChild(empty);
        return;
      }

      filtered.forEach(entry => {
        const item = document.createElement("div");
        item.className = "font-item" + (entry.family === currentSelectedFont() ? " active" : "");

        const main = document.createElement("div");
        main.className = "font-item-main";

        const label = document.createElement("div");
        label.className = "font-item-label";
        label.textContent = entry.label;

        const category = document.createElement("div");
        category.className = "font-item-category";
        category.textContent = entry.category || "";

        main.appendChild(label);
        main.appendChild(category);

        const preview = document.createElement("div");
        preview.className = "font-item-preview";
        preview.textContent = "あア亜Aa";
        if (entry.family !== "standard") {
          preview.style.fontFamily = `"${entry.family}", sans-serif`;
          ensurePreviewFontLoaded(entry);
        }

        item.appendChild(main);
        item.appendChild(preview);

        item.addEventListener("click", () => selectFont(entry.family));

        fontList.appendChild(item);
      });
    }

    function currentSelectedFont() {
      return localStorage.getItem(FONT_KEY) || DEFAULT_FONT;
    }

    fontSearch.addEventListener("input", () => renderFontList(fontSearch.value));

    // 初期表示
    renderFontList("");

    darkModeToggle.checked = localStorage.getItem(THEME_KEY) === "dark";

    darkModeToggle.addEventListener("change", () => {
      if (darkModeToggle.checked) {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem(THEME_KEY, "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem(THEME_KEY, "light");
      }
    });
  </script>

  <script src="account-widgets.js"></script>
</body>
