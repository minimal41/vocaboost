<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>検索</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <style>
    .tabArea {
      margin-bottom: 15px;
    }

    .tab {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      margin: 0 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .active {
      background: var(--color-accent);
      color: var(--color-accent-text);
    }

    .inactive {
      background: var(--color-border);
      color: var(--color-text);
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .card button {
        align-self: flex-end;
      }

      div[style*="margin-bottom:15px;"] {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      input,
      select {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
      }
    }

    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .book-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 6px 0;
    }

    .book-meta-row .creator-btn {
      font-size: 13px;
    }

    /* ユーザー一覧：枠なしで写真+名前だけを表示する（カードの白背景に馴染ませる） */
    .user-identity {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--color-text) !important;
      text-decoration: none !important;
      font-size: 18px;
      font-weight: bold;
    }

    .count {
      font-size: 13px;
      color: var(--color-text);
    }
  </style>
</head>

<body>
  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none" onclick="goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="tabArea">
      <button id="bookTab" class="tab active" onclick="showBooks()">単語帳</button>
      <button id="userTab" class="tab inactive" onclick="showUsers()">ユーザー</button>
    </div>

    <div style="margin-bottom:15px;">
      <input id="search" placeholder="検索" oninput="render()">
      <select id="sortBook" onchange="render()"
        style="padding:10px; border-radius:10px; border:1px solid #ccc; font-size:14px; margin-left:5px; cursor:pointer;">
        <option value="created">作成順（新しい）</option>
        <option value="name">名称順</option>
        <option value="count">単語数順</option>
      </select>
      <select id="sortUser" onchange="render()" style="display:none;
        padding:10px; border-radius:10px; border:1px solid #ccc; font-size:14px; margin-left:5px; cursor:pointer;">
        <option value="count">公開単語帳作成数順</option>
        <option value="created">登録順（新しい）</option>
        <option value="name">名称順</option>
      </select>
    </div>

    <div id="list" style="position: relative; min-height: 200px;">
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">読み込み中...</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">検索</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- キャッシュからの単語帳一覧を即時描画する処理がVOCABOOST_AVATAR_HTMLを使うため、
       account-widgets.js は下のメインスクリプトより先に読み込む -->
  <script src="account-widgets.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let mode = "book"; // book / user
    let books = [];
    let users = [];
    let currentUser = null;
    let usersLoaded = false; // ★ ユーザーデータ読み込み済みフラグ

    // XSS対策: テキストをそのまま innerHTML に差し込まないようにエスケープする
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
      settingsBtn.style.display = "inline-block";
    }

    function handleSignedOut() {
      localStorage.removeItem("cachedUser");
      statusDiv.textContent = "ログアウト中";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      settingsBtn.style.display = "none";
    }

    /* Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
       一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
       残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
       未ログインのままかを再確認する（実際はログインしたままなのに一瞬
       ログアウト状態の表示になってしまう不具合を防ぐため）。 */
    firebase.auth().onAuthStateChanged(user => {
      currentUser = user;

      if (user) {

        localStorage.setItem(
          "cachedUser",
          JSON.stringify({
            uid: user.uid
          })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
      } else if (localStorage.getItem("cachedUser")) {
        setTimeout(() => {
          if (!firebase.auth().currentUser) handleSignedOut();
        }, 1500);
      } else {
        handleSignedOut();
      }
    });

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      firebase.auth().signOut();
    }

    async function load() {

      const cachedBooks = localStorage.getItem("publicBooks");

      // まずキャッシュ表示
      if (cachedBooks) {
        try {
          books = JSON.parse(cachedBooks);
          render();
          hideLoading();
        } catch (e) {
          console.error(e);
        }
      } else {
        // キャッシュがない時だけローディング
        showLoading();
      }

      try {

        const snap = await db.collection("wordbooks")
          .where("isPublic", "==", true)
          .get();

        const bookPromises = snap.docs.map(async (d) => {

          const data = d.data();
          let count = data.wordCount;

          // 古いデータの補完
          if (count === undefined) {
            try {
              const wordSnap = await db
                .collection("wordbooks")
                .doc(d.id)
                .collection("words")
                .get();

              count = wordSnap.size;

              db.collection("wordbooks")
                .doc(d.id)
                .update({
                  wordCount: count
                });

            } catch (e) {
              count = 0;
            }
          }

          return {
            id: d.id,
            title: data.title,
            ownerName: data.ownerName || "不明",
            ownerId: data.owner,
            // ownerNameと同様、wordbookドキュメント側に複製された写真をそのまま使う
            // （usersコレクションの読み取りにはログインが必要なため、未ログインの
            // 閲覧者でも表示できるようにするための複製）
            ownerPhotoURL: data.ownerPhotoURL || null,
            count: count,
            createdAt: data.createdAt || null
          };
        });

        books = await Promise.all(bookPromises);

        // view.html用キャッシュ（作成者ボタンの見た目をview.html側の描画と合わせておく）
        books.forEach(b => {
          localStorage.setItem(
            `book_${b.id}`,
            JSON.stringify({
              owner: b.ownerId,
              title: b.title,
              detailHtml: `
                <a href="user.html?id=${b.ownerId}" class="creator-btn">
                  ${window.VOCABOOST_AVATAR_HTML(b.ownerPhotoURL, 24)}
                  <span>${escapeHtml(b.ownerName)}</span>
                </a>
                <div class="meta-row">計 ${b.count} 単語</div>
              `,
              wordsHtml: ""
            })
          );
        });

        // キャッシュ更新
        localStorage.setItem(
          "publicBooks",
          JSON.stringify(books)
        );

        render();

      } catch (e) {

        console.error("Load failed:", e);

        if (!cachedBooks) {
          alert("読み込みに失敗しました");
        }

      } finally {

        hideLoading();

      }
    }

    function showLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.classList.remove('hidden');
    }

    function hideLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    }

    function showBooks() {
      mode = "book";
      document.getElementById("bookTab").className = "tab active";
      document.getElementById("userTab").className = "tab inactive";
      document.getElementById("sortBook").style.display = "";
      document.getElementById("sortUser").style.display = "none";
      render();
    }

    async function showUsers() {
      mode = "user";
      document.getElementById("bookTab").className = "tab inactive";
      document.getElementById("userTab").className = "tab active";
      document.getElementById("sortBook").style.display = "none";
      document.getElementById("sortUser").style.display = "";

      if (!usersLoaded) {

        const cachedUsers =
          localStorage.getItem("usersCache");

        if (cachedUsers) {
          try {
            users = JSON.parse(cachedUsers);
            usersLoaded = true;
            render();
          } catch (e) {
            console.error(e);
          }
        }

        showLoading();
        try {
          // ユーザーごとの公開単語帳数を再計算
          const userBookCounts = {};
          books.forEach(b => {
            if (b.ownerId) {
              userBookCounts[b.ownerId] = (userBookCounts[b.ownerId] || 0) + 1;
            }
          });

          const snapUsers = await db.collection("users").get();
          users = snapUsers.docs.map(d => {
            const data = d.data();
            const createdAt = data.createdAt;
            return {
              id: d.id,
              username: data.username || "名無し",
              photoURL: data.photoURL || null,
              bookCount: userBookCounts[d.id] || 0,
              // localStorageに保存するためTimestampをミリ秒数値に変換しておく
              createdAtMillis: createdAt && typeof createdAt.toMillis === "function"
                ? createdAt.toMillis()
                : 0
            };
          });
          usersLoaded = true;
          localStorage.setItem(
            "usersCache",
            JSON.stringify(users)
          );
        } catch (e) {
          console.error("User load failed:", e);
        }
        hideLoading();
      }
      render();
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase();
      const sort = mode === "book"
        ? document.getElementById("sortBook").value
        : document.getElementById("sortUser").value;
      const area = document.getElementById("list");
      area.innerHTML = "";

      if (mode === "book") {
        let filtered = books.filter(b => b.title.toLowerCase().includes(q));

        // ソート
        if (sort === "created") {
          filtered.sort((a, b) => {
            if (!a.createdAt) return 1;
            if (!b.createdAt) return -1;
            return b.createdAt.seconds - a.createdAt.seconds;
          });
        } else if (sort === "name") {
          filtered.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
        } else if (sort === "count") {
          filtered.sort((a, b) => b.count - a.count);
        }

        filtered.forEach(b => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
        <div>
          <div class="title">${escapeHtml(b.title)}</div>
          <div class="book-meta-row">
            <a href="user.html?id=${b.ownerId}" class="creator-btn">
              ${window.VOCABOOST_AVATAR_HTML(b.ownerPhotoURL, 24)}
              <span>${escapeHtml(b.ownerName)}</span>
            </a>
            <div class="count">単語数：${b.count}</div>
          </div>
        </div>
        <button onclick="location.href='view.html?id=${b.id}'">開く</button>
      `;
          area.appendChild(div);
        });
      } else {
        let filtered = users.filter(u => u.username.toLowerCase().includes(q));

        // ソート
        if (sort === "name") {
          filtered.sort((a, b) => a.username.localeCompare(b.username, 'ja'));
        } else if (sort === "count") {
          filtered.sort((a, b) => b.bookCount - a.bookCount);
        } else if (sort === "created") {
          filtered.sort((a, b) => (b.createdAtMillis || 0) - (a.createdAtMillis || 0));
        }

        filtered.forEach(u => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
        <div>
          <a href="user.html?id=${u.id}" class="user-identity">
            ${window.VOCABOOST_AVATAR_HTML(u.photoURL, 28)}
            <span>${escapeHtml(u.username)}</span>
          </a>
          <div class="count">作成した単語帳数：${u.bookCount}</div>
        </div>
        <button onclick="location.href='user.html?id=${u.id}'">見る</button>
      `;
          area.appendChild(div);
        });
      }
    }

    load();
  </script>
</body>

</html>
