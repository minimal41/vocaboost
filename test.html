<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>Test</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <style>
    .main {
      margin: 0;
      padding: 0;
      width: 100%;
      flex: 1;
    }

    .card {
      background: var(--color-surface);
      color: var(--color-text);
      max-width: 50%;
      margin: 30px auto;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    input {
      padding: 10px;
      font-size: 16px;
      max-width: 550px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid var(--color-border);
    }

    #ans {
      margin-bottom: 10px;
      width: 100%;
    }

    button {
      background: var(--color-accent);
      color: var(--color-accent-text);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin: 6px;
      font-size: 16px;
    }

    #quiz {
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    #end {
      height: 280px;
    }

    #score {
      font-size: 20px;
    }

    #resultfont {
      font-size: 30px;
      font-weight: bold;
    }

    #q {
      font-size: 30px;
      min-height: 100px;
    }

    #result {
      font-size: 20px;
      min-height: 60px;
    }

    #result .correct,
    #result .wrong {
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #result .correct {
      color: var(--color-accent);
    }

    #result .wrong {
      color: var(--color-danger);
    }

    /* 正解：シンプルな丸（線のみ） */
    #result .correct::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: 3px solid var(--color-accent);
      border-radius: 50%;
      box-sizing: border-box;
      transform: translateY(2px);
    }

    /* 不正解：シンプルなバツ（線のみ） */
    #result .wrong::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      background:
        linear-gradient(45deg, transparent calc(50% - 2px), var(--color-danger) calc(50% - 2px), var(--color-danger) calc(50% + 2px), transparent calc(50% + 2px)),
        linear-gradient(-45deg, transparent calc(50% - 2px), var(--color-danger) calc(50% - 2px), var(--color-danger) calc(50% + 2px), transparent calc(50% + 2px));
      transform: translateY(2px);
    }

    #start {
      height: auto;
      padding-bottom: 30px;
    }
    #progress {
      margin-top: auto;
    }

    #progressWrap {
      width: 100%;
      height: 12px;
      background: var(--color-border);
      border-radius: 10px;
      margin-top: 15px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: var(--color-accent);
      transition: 0.3s;
    }

    #progressText {
      font-size: 14px;
      margin-top: 5px;
    }

    #quizContent {
      flex-grow: 1;
      min-height: 200px;
    }


    @media (max-width: 768px) {
      .card {
        max-width:70%;
      }
      #q{
        font-size:20px;
      }
      #result{
        font-size:16px;
        min-height:80px;
      }
      #ans{
        font-size:14px;
      }
      #resultfont{
        font-size:25px;
      }
    }

    /* 設定項目 */
    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(360px, 90%);
      margin: 10px auto;
      padding: 10px 16px;
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: 14px;
      cursor: pointer;
      transition: .2s;
      user-select: none;
      box-sizing: border-box;
    }

    .option:hover {
      border-color: var(--color-accent);
      background: var(--color-bg);
      transform: translateY(-1px);
    }

    .option input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border: 2px solid var(--color-accent);
      border-radius: 8px;
      background: var(--color-surface);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: .2s;
    }

    .option input[type="checkbox"]:checked {
      background: var(--color-accent);
    }

    .option input[type="checkbox"]::before {
      content: "";
      position: absolute;

      left: 50%;
      top: 50%;

      width: 7px;
      height: 12px;

      border-right: 3px solid white;
      border-bottom: 3px solid white;

      transform: translate(-50%, -58%) rotate(45deg);

      opacity: 0;
      transition: opacity .15s;
    }

    .option span {
      font-size: 18px;
      font-weight: 600;
    }

    .option input[type="checkbox"]:checked::before {
        opacity: 1;
    }

    @media (max-width:768px){

      .option{
        width:95%;
        padding:12px 14px;
      }

      .option input[type="checkbox"]{
        width:30px;
        height:30px;
      }

      .option span{
        font-size:17px;
      }
    }


  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <button id="settingsBtn" class="header-btn" style="display:none"
        onclick="window.goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="window.logout()">ログアウト</button>
    </div>
  </header>

  <!-- 設定画面 -->
  <div class="main" class="start">
    <div class="card" id="start">
      <h2>テスト設定</h2>

      <label class="option">
        <input type="checkbox" id="skipCheck" checked>
        <span>正解済みをスキップ</span>
      </label>

      <label class="option">
        <input type="checkbox" id="randomCheck">
        <span>ランダム出題する</span>
      </label>

      <label class="option">
        <input type="checkbox" id="selfCheck">
        <span>自分で採点する</span>
      </label>

      <label class="option">
        <input type="checkbox" id="swapCheck">
        <span>表と裏を入れ替える</span>
      </label>

      <button onclick="resetLearned()">学習データをリセット</button><br><br>

      <button onclick="startTest()">▶ スタート</button><br><br>
      <button onclick="goBack()">戻る</button>
      <p id="startMsg" style="color:var(--color-danger)"></p>
    </div>
  </div>
  <!-- クイズ -->
  <div class="main">
    <div class="card" id="quiz" style="display:none">

      <!-- 上のコンテンツ -->
      <div id="quizContent">
        <h2 id="q"></h2>
        <input id="ans" placeholder="答えを入力" autocomplete="off"><br>
        <p id="result"></p>
        <button id="answerBtn" onclick="check()">回答 (Enter)</button>
        <div id="selfButtons" style="display:none;">
          <button onclick="markCorrect()">正解</button>
          <button onclick="markWrong()">不正解</button>
        </div>
      </div>

      <!-- 下固定 -->
      <div id="progress">
        <div id="progressWrap">
          <div id="progressBar"></div>
        </div>
        <p id="progressText"></p>
      </div>

    </div>
  </div>

  <!-- 結果 -->
  <div class="main">
    <div class="card" id="end" style="display:none">
      <p id="resultfont">結果</p>
      <p id="score"></p>
      <button onclick="restart()">もう一回</button>
      <button onclick="goBack()">戻る</button>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E", authDomain: "quiz1-4ffdc.firebaseapp.com", projectId: "quiz1-4ffdc", storageBucket: "quiz1-4ffdc.firebasestorage.app", messagingSenderId: "152062126332", appId: "1:152062126332:web:845af237a1a76207214f79" };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    // ログイン情報のキャッシュを利用してヘッダーを即時表示
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
      } else {
        localStorage.removeItem("cachedUser");
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        settingsBtn.style.display = "none";
      }
    });

    window.goPage = (page) => {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    };

    window.logout = () => {
      localStorage.removeItem("cachedUser");
      signOut(auth);
    };

    const id = new URLSearchParams(location.search).get("id");

    let words = [],
        filteredWords = [],
        i = 0,
        correct = 0,
        phase = 0,
        selfMode = false,
        swapMode = false;

    let learned = JSON.parse(localStorage.getItem("learnedWords")) || {};
    if (!learned[id]) learned[id] = [];

    // 並び替え(order)フィールドで取得。未対応の単語帳（orderフィールド未付与）は
    // 結果が空になるため、その場合は作成日時順にフォールバックする
    let snap = await getDocs(query(collection(db, "wordbooks", id, "words"), orderBy("order")));
    if (snap.empty) {
      snap = await getDocs(query(collection(db, "wordbooks", id, "words"), orderBy("createdAt")));
    }
    snap.forEach(d => words.push(d.data()));

    window.startTest = () => {
      selfMode = document.getElementById("selfCheck").checked;
      swapMode = document.getElementById("swapCheck").checked;

      makeList();

      if (filteredWords.length === 0) {
        startMsg.textContent = "すべて正解済みです。リセットしてください。";
        return;
      }

      start.style.display = "none";
      quiz.style.display = "block";
      render();
    };

    function makeList() {
      const skip = document.getElementById("skipCheck").checked;
      const random = document.getElementById("randomCheck").checked;

      if (skip) {
        filteredWords = words.filter(w => !learned[id].includes(w.front));
      } else {
        filteredWords = [...words];
      }

      // ★ ランダムONのときだけシャッフル
      if (random) {
        filteredWords.sort(() => Math.random() - 0.5);
      }
    }

    // swapModeがtrueのとき出題文と正解を入れ替える（表裏を逆にする）
    function getQuestion(word) {
      return swapMode ? word.back : word.front;
    }
    function getAnswerText(word) {
      return swapMode ? word.front : word.back;
    }

    function render() {
      if (i >= filteredWords.length) {
        quiz.style.display = "none";
        end.style.display = "block";
        score.textContent = `${correct}/${filteredWords.length} (${Math.round(correct / filteredWords.length * 100)}%)`;
        return;
      }
      q.textContent = getQuestion(filteredWords[i]);
      ans.value = "";
      ans.readOnly = false;
      result.textContent = "";
      phase = 0;

      ans.style.display = "";
      const answerBtn = document.getElementById("answerBtn");
      answerBtn.style.display = "";
      answerBtn.textContent = "回答 (Enter)";
      document.getElementById("selfButtons").style.display = "none";
      if (filteredWords.length > 0) {
        const progress = Math.round(i / filteredWords.length * 100);
        document.getElementById("progressBar").style.width = progress + "%";
      }
      const progress = Math.round(i / filteredWords.length * 100);
      document.getElementById("progressBar").style.width = progress + "%";
      document.getElementById("progressText").textContent =
        `${i+1}/${filteredWords.length} 問`;
    }

    window.check = () => {
        if (phase === 0) {

            if (selfMode) {

                // 完全一致なら自動で正解
                if (ans.value.trim() === getAnswerText(filteredWords[i])) {

                    result.innerHTML = '<span class="correct">正解</span>';

                    correct++;

                    if (!learned[id].includes(filteredWords[i].front)) {
                        learned[id].push(filteredWords[i].front);
                        localStorage.setItem("learnedWords", JSON.stringify(learned));
                    }

                    phase = 1;
                    document.getElementById("answerBtn").textContent = "次へ (Enter)";
                    return;
                }

                // 完全一致しなかったら自分で採点
                ans.readOnly = true;

                result.innerHTML = `
                <div style="text-align:left;border:1px solid var(--color-border);border-radius:8px;padding:12px;margin-top:10px;">
                    <div><b>あなたの回答</b></div>
                    <div style="margin-bottom:12px;">${ans.value || "（未入力）"}</div>

                    <div><b>正解</b></div>
                    <div>${getAnswerText(filteredWords[i])}</div>
                </div>
                `;

                document.getElementById("answerBtn").style.display = "none";
                document.getElementById("selfButtons").style.display = "block";

                phase = 2;
                return;
            }

            // ここから今までの自動採点
        if (ans.value.trim() === getAnswerText(filteredWords[i])) {
          result.innerHTML = '<span class="correct">正解</span>';
          correct++;
          if (!learned[id].includes(filteredWords[i].front)) {
            learned[id].push(filteredWords[i].front);
            localStorage.setItem("learnedWords", JSON.stringify(learned));
          }
        } else {
          result.innerHTML = '<span class="wrong">不正解</span>　正解: ' + getAnswerText(filteredWords[i]);
        }
        phase = 1;
        document.getElementById("answerBtn").textContent = "次へ (Enter)";
      } else {
        i++;
        render();
      }
    };

    window.markCorrect = () => {

        correct++;

        if (!learned[id].includes(filteredWords[i].front)) {
            learned[id].push(filteredWords[i].front);
            localStorage.setItem("learnedWords", JSON.stringify(learned));
        }

        result.innerHTML += '<br><br><span class="correct">正解</span>';
        document.getElementById("selfButtons").style.display = "none";
        const answerBtn = document.getElementById("answerBtn");
        answerBtn.style.display = "";
        answerBtn.textContent = "次へ (Enter)";
        phase = 1;
    };

    window.markWrong = () => {

        result.innerHTML += '<br><br><span class="wrong">不正解</span>';
        document.getElementById("selfButtons").style.display = "none";
        const answerBtn = document.getElementById("answerBtn");
        answerBtn.style.display = "";
        answerBtn.textContent = "次へ (Enter)";
        phase = 1;
    };
    
    window.restart = () => {
      i = 0; correct = 0;
      end.style.display = "none";
      quiz.style.display = "block";
      makeList();
      render();
    };

    window.resetLearned = () => {
      if (!confirm("学習データを削除しますか？")) return;
      learned[id] = [];
      localStorage.setItem("learnedWords", JSON.stringify(learned));
      startMsg.textContent = "リセットしました。";
    };

    document.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        if (quiz.style.display !== "block") return;

        if (phase === 2) return;

        check();
    });

    window.goBack = () => {
      location.href = `view.html?id=${id}`;
    };
  </script>
</body>

</html>
