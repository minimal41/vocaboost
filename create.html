<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>単語帳作成</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 16px;
    }

    #title{
      width: 80%;
      max-width: 400px;
    }
    #front{
      width: 80%;
      max-width: 400px;
    }
    #back{
      width: 80%;
      max-width: 400px;
    }
    
    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-top: 15px;
    }

    .publicStatus {
      font-size: 12px;
      color: var(--color-text-sub);
    }

    .dragHandle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .dragHandle span {
      display: block;
      width: 16px;
      height: 2px;
      border-radius: 1px;
      background: var(--color-text-sub);
    }

    .dragHandle:active {
      cursor: grabbing;
    }

    .wordRow {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .wordRow input {
      width: 200px;
    }

    .list {
      margin-top: 20px;
      text-align: left;
      overflow-x: auto;
    }

    .wordItemCols {
      display: grid;
      grid-template-columns: 22px 26px minmax(80px, 1fr) 32px minmax(80px, 1fr) 92px;
      align-items: center;
      column-gap: 8px;
      min-width: 480px;
    }

    .wordItemCols .smallBtn {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .wordListHeader {
      margin-top: 15px;
      min-width: 480px;
    }

    .wordListHeader #selectAllBtn {
      grid-column: 2;
      justify-self: center;
      white-space: nowrap;
    }

    .wordListHeader .reverseBtn {
      grid-column: 4;
      justify-self: center;
      white-space: nowrap;
    }

    .wordListHeader .deleteSelectedBtn {
      grid-column: 6;
      justify-self: center;
      width: auto;
      white-space: nowrap;
    }

    .danger {
      background: var(--color-danger);
    }

    .wordItem {
      border-bottom: 1px solid var(--color-border);
      padding: 6px;
      background: var(--color-surface);
      transition: transform 0.15s ease;
    }

    .wordItem.dragging {
      position: fixed;
      z-index: 1000;
      box-sizing: border-box;
      box-shadow: 0 10px 24px var(--color-shadow), 0 3px 8px var(--color-shadow);
      transform: scale(1.03);
      opacity: 0.97;
      border-radius: 10px;
      border-bottom: none;
      pointer-events: none;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .wordItemPlaceholder {
      border: 2px dashed var(--color-accent);
      border-radius: 8px;
      background: var(--color-bg);
      box-sizing: border-box;
      margin: 4px 0;
    }

    .notice {
      color: var(--color-danger);
    }

    .smallBtn {
      background: var(--color-danger);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      color: var(--color-accent-text);
      border: none;
      cursor: pointer;
    }

    .editInput {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      font-size: 14px;
    }

    .frontInput,
    .backInput {
      width: 100%;
      box-sizing: border-box;
    }

    .checkWrap {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .deleteCheck {
      display: none;
    }

    .checkMark {
      width: 26px;
      height: 26px;
      border: 2px solid var(--color-accent);
      border-radius: 50%;
      background: var(--color-surface);
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 2px 6px var(--color-shadow);
    }

    .deleteCheck:checked + .checkMark {
      background: var(--color-accent);
      transform: scale(1.1);
      box-shadow: 0 4px 12px var(--color-shadow);
    }

    .deleteCheck:checked + .checkMark::after {
      content: "";
      position: absolute;

      left: 8px;
      top: 4px;

      width: 6px;
      height: 12px;

      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .swapBtn {
      width: 32px;
      height: 32px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: var(--color-accent);
      color: var(--color-accent-text);

      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    /* 他の単語帳から取り込むモーダル */
    .modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    .modalBox {
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .modalDesc {
      font-size: 13px;
      color: var(--color-text-sub);
      margin-bottom: 10px;
    }

    .importBookList,
    .importWordList {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }

    .importBookItem {
      padding: 12px 14px;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .importBookItem:last-child {
      border-bottom: none;
    }

    .importBookItem:hover {
      background: var(--color-bg);
    }

    .importBookItem .bookTitle {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .importBookItem .bookCount {
      font-size: 12px;
      color: var(--color-text-sub);
      flex-shrink: 0;
    }

    .importWordRow {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .importWordRow:last-child {
      border-bottom: none;
    }

    .importWordRow:hover {
      background: var(--color-bg);
    }

    .importWordRow .wordPair {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .smallActionBtn {
      background: var(--color-border);
      color: var(--color-text);
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .importEmpty {
      padding: 20px;
      text-align: center;
      color: var(--color-text-sub);
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <button id="settingsBtn" class="header-btn" style="display:none" onclick="goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>

    <div class="card">
      <h2>単語帳情報</h2>
      <input id="title" placeholder="単語帳タイトル"><br>
      <textarea id="description" placeholder="説明文（例：考査範囲、授業のメモなど）"
        style="width: 80%; max-width: 400px; height: 80px; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--color-border); font-size: 14px; font-family: inherit; box-sizing: border-box;"></textarea>

      <div class="row">
        <label for="isPublic">公開する</label>
        <input type="checkbox" id="isPublic" checked onchange="onIsPublicChange()">
        <span class="publicStatus" id="publicStatus"></span>
      </div>

      <div id="msg" class="notice"></div>
    </div>

    <div class="card" id="wordArea">
      <h2>単語を追加</h2>

      <div class="wordRow">
        <input id="front" placeholder="例：犬">
        <input id="back" placeholder="例：dog">
      </div>

      <button onclick="addWord()">追加</button>

      <div class="wordListHeader wordItemCols">
        <span></span>
        <button type="button" id="selectAllBtn" onclick="toggleSelectAllWords()">全選択</button>
        <span></span>
        <button type="button" class="reverseBtn" onclick="reverseSelectedWords()">選択項目を表裏反転</button>
        <span></span>
        <button type="button" class="danger deleteSelectedBtn" onclick="deleteSelectedWords()">選択削除</button>
      </div>

      <p style="font-size:12px;color:var(--color-text-sub);text-align:left;margin:6px 2px 0;">
        ☑ で単語を選択すると、真上の ⇄ で表裏反転・「選択削除」でまとめて削除できます／☰ を掴んでドラッグすると並び順を変更できます
      </p>
      <div class="list" id="wordList"></div>

      <hr>

      <h3>CSV操作（ファイルのみ）</h3>
      <input type="file" id="csvFile" accept=".csv,.txt"><br><br>

      <button onclick="importCSV()">CSV読み込み</button>
      <button onclick="exportCSV()">CSV書き出し</button>
      <button onclick="openImportModal()">他の単語帳から取り込む</button>

      <br><br>
      <button onclick="saveBook()">保存する</button>
    </div>

  </main>

  <!-- 他の単語帳から単語を取り込むモーダル -->
  <div id="importModal" class="modalOverlay" style="display:none;">
    <div class="modalBox">
      <h3>他の単語帳から取り込む</h3>

      <div id="importStep1">
        <p class="modalDesc">取り込み元の単語帳を選んでください</p>
        <div id="importBookList" class="importBookList"></div>
      </div>

      <div id="importStep2" style="display:none;">
        <p class="modalDesc">取り込む単語を選んでください</p>
        <div style="text-align:right; margin-bottom:8px;">
          <button type="button" class="smallActionBtn" onclick="toggleSelectAllImportWords()">全選択/解除</button>
        </div>
        <div id="importWordList" class="importWordList"></div>
        <div id="importMsg" class="notice"></div>
        <div class="modalActions">
          <button type="button" onclick="backToBookList()">単語帳選択に戻る</button>
          <button type="button" onclick="confirmImportWords()">選択した単語を取り込む</button>
        </div>
      </div>

      <div class="modalActions">
        <button type="button" onclick="closeImportModal()">閉じる</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footertitle"><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">検索</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let bookId = null;
    let localWordSeq = 0;
    function nextLocalId() {
      localWordSeq++;
      return "local_" + localWordSeq;
    }

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    // ログイン情報のキャッシュを利用してヘッダーを即時表示
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
      } else {
        localStorage.removeItem("cachedUser");
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        settingsBtn.style.display = "none";
        alert("ログインしてください");
        location.href = "login.html";
      }
    });

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    }

    // 公開設定は保存ボタンを押すまでDBに反映しない。ここでは表示テキストの更新のみ行う
    function onIsPublicChange() {
      const checkbox = document.getElementById("isPublic");
      const statusEl = document.getElementById("publicStatus");
      if (statusEl) statusEl.textContent = checkbox.checked ? "（公開されます）" : "（非公開で保存されます）";
    }

    // 単語帳・単語はすべて保存ボタンを押した時点でまとめてDBに書き込む
    async function saveBook() {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const isPublic = document.getElementById("isPublic").checked;
      const msg = document.getElementById("msg");

      if (!title) {
        msg.textContent = "タイトルを入力してください";
        return;
      }

      const words = Array.from(document.querySelectorAll("#wordList .wordItem")).map(row => ({
        front: row.querySelector('[data-type="front"]').value.trim(),
        back: row.querySelector('[data-type="back"]').value.trim()
      })).filter(w => w.front && w.back);

      msg.textContent = "保存しています...";

      try {
        const doc = await db.collection("wordbooks").add({
          title: title,
          description: description,
          isPublic: isPublic,
          owner: currentUser.uid,
          ownerName: currentUser.displayName || "名無し",
          wordCount: words.length,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        bookId = doc.id;

        const batch = db.batch();
        words.forEach((w, idx) => {
          const ref = db.collection("wordbooks").doc(bookId).collection("words").doc();
          batch.set(ref, {
            front: w.front,
            back: w.back,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            order: (idx + 1) * 1000
          });
        });
        await batch.commit();

        location.href = "view.html?id=" + bookId;
      } catch (e) {
        console.error(e);
        msg.textContent = "保存に失敗しました";
      }
    }

    function addWord() {
      const f = document.getElementById("front").value.trim();
      const b = document.getElementById("back").value.trim();
      if (!f || !b) return;

      addWordToList(nextLocalId(), f, b);

      document.getElementById("front").value = "";
      document.getElementById("back").value = "";
    }

    function addWordToList(id, f, b) {
      const div = document.createElement("div");

      div.className = "wordItem wordItemCols";
      div.id = "word_" + id;

      div.innerHTML = `
        <span class="dragHandle" title="ドラッグして並び替え">
          <span></span><span></span><span></span>
        </span>

        <label class="checkWrap">
          <input type="checkbox"
                class="deleteCheck"
                value="${id}">
          <span class="checkMark"></span>
        </label>

        <input
          class="editInput frontInput"
          value="${escapeHtml(f)}"
          data-type="front"
        >

        <button
          class="swapBtn"
          onclick="swapWord('${id}')">
          ⇄
        </button>

        <input
          class="editInput backInput"
          value="${escapeHtml(b)}"
          data-type="back"
        >

        <button class="smallBtn" onclick="deleteWord('${id}')">
          削除
        </button>
      `;

      document.getElementById("wordList").appendChild(div);
    }

    function deleteWord(id) {
      if (!confirm("削除しますか？")) return;
      const row = document.getElementById("word_" + id);
      if (row) row.remove();
    }

    function swapWord(id) {
      const row = document.getElementById("word_" + id);
      if (!row) return;

      const frontInput = row.querySelector('[data-type="front"]');
      const backInput = row.querySelector('[data-type="back"]');

      const f = frontInput.value;
      const b = backInput.value;

      frontInput.value = b;
      backInput.value = f;
    }

    function toggleSelectAllWords() {
      const checks = document.querySelectorAll("#wordList .deleteCheck");
      const btn = document.getElementById("selectAllBtn");

      if (checks.length === 0) return;

      const allChecked = Array.from(checks).every(cb => cb.checked);

      checks.forEach(cb => cb.checked = !allChecked);
      btn.textContent = allChecked ? "全選択" : "全解除";
    }

    function reverseSelectedWords() {
      const checks = document.querySelectorAll(".deleteCheck:checked");

      if (checks.length === 0) {
        alert("単語を選択してください");
        return;
      }

      if (!confirm(`${checks.length}個の単語の表裏を入れ替えますか？`)) {
        return;
      }

      checks.forEach(check => {
        const id = check.value;
        const row = document.getElementById("word_" + id);
        const frontInput = row.querySelector('[data-type="front"]');
        const backInput = row.querySelector('[data-type="back"]');

        const f = frontInput.value;
        const b = backInput.value;

        frontInput.value = b;
        backInput.value = f;
      });

      alert("表裏を入れ替えました");
    }

    function deleteSelectedWords() {
      const checks = document.querySelectorAll(".deleteCheck:checked");

      if (checks.length === 0) {
        alert("選択してください");
        return;
      }

      if (!confirm(`${checks.length}個の単語を削除しますか？`)) {
        return;
      }

      checks.forEach(check => {
        const row = document.getElementById("word_" + check.value);
        if (row) row.remove();
      });
    }

    // ===== 単語の並び替え（ドラッグ&ドロップ） =====

    function setupDragReorder(listId) {
      const list = document.getElementById(listId);
      if (!list) return;

      list.addEventListener("pointerdown", (e) => {
        const handle = e.target.closest(".dragHandle");
        if (!handle) return;

        const item = handle.closest(".wordItem");
        if (!item) return;

        e.preventDefault();

        const pointerId = e.pointerId;
        handle.setPointerCapture(pointerId);

        const startRect = item.getBoundingClientRect();
        const startY = e.clientY;

        // ドラッグ中、元の場所を確保しておくためのプレースホルダーを挿入
        const placeholder = document.createElement("div");
        placeholder.className = "wordItemPlaceholder";
        placeholder.style.height = startRect.height + "px";
        item.parentNode.insertBefore(placeholder, item.nextSibling);

        // 要素を画面に固定し、ポインターに追従して自由に動かせるようにする
        item.classList.add("dragging");
        item.style.position = "fixed";
        item.style.top = startRect.top + "px";
        item.style.left = startRect.left + "px";
        item.style.width = startRect.width + "px";

        const onMove = (ev) => {
          if (ev.pointerId !== pointerId) return;

          // ポインターの動きにそのまま追従させる（浮き上がった状態で移動）
          const deltaY = ev.clientY - startY;
          item.style.top = (startRect.top + deltaY) + "px";

          const currentCenter = startRect.top + startRect.height / 2 + deltaY;

          const siblings = Array.from(list.querySelectorAll(".wordItem:not(.dragging)"));

          let after = null;
          for (const sib of siblings) {
            const box = sib.getBoundingClientRect();
            if (currentCenter < box.top + box.height / 2) {
              after = sib;
              break;
            }
          }

          movePlaceholder(list, placeholder, after);
        };

        const onUp = (ev) => {
          if (ev.pointerId !== pointerId) return;

          handle.releasePointerCapture(pointerId);
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          handle.removeEventListener("pointercancel", onUp);

          // プレースホルダーの位置に要素を戻し、固定表示を解除する
          placeholder.parentNode.insertBefore(item, placeholder);
          placeholder.remove();

          item.classList.remove("dragging");
          item.style.position = "";
          item.style.top = "";
          item.style.left = "";
          item.style.width = "";
        };

        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
        handle.addEventListener("pointercancel", onUp);
      });
    }

    // プレースホルダーの移動先が変わったとき、他の単語がなめらかに
    // スライドして見えるようにする（FLIPテクニック）
    function movePlaceholder(list, placeholder, after) {
      const currentNext = placeholder.nextElementSibling || null;
      const target = after || null;

      if (target === placeholder) return;
      if (target === currentNext) return;

      const items = Array.from(list.children).filter(
        el => !el.classList.contains("dragging")
      );

      const firstRects = new Map();
      items.forEach(el => firstRects.set(el, el.getBoundingClientRect()));

      if (target) {
        list.insertBefore(placeholder, target);
      } else {
        list.appendChild(placeholder);
      }

      items.forEach(el => {
        const first = firstRects.get(el);
        const last = el.getBoundingClientRect();
        const deltaY = first.top - last.top;

        if (deltaY) {
          el.style.transition = "none";
          el.style.transform = `translateY(${deltaY}px)`;
          requestAnimationFrame(() => {
            el.style.transition = "transform 0.15s ease";
            el.style.transform = "";
          });
        }
      });
    }

    setupDragReorder("wordList");
    onIsPublicChange();

    async function importCSV() {
      const file = document.getElementById("csvFile").files[0];
      if (!file) {
        alert("CSVファイルを選択してください");
        return;
      }

      const text = await file.text();
      const lines = text.split("\n");

      for (const line of lines) {
        const [f, b] = line.split(",");
        if (f && b) {
          addWordToList(nextLocalId(), f.trim(), b.trim());
        }
      }

      document.getElementById("csvFile").value = "";
    }

    function exportCSV() {
      const rows = document.querySelectorAll("#wordList .wordItem");
      let csv = "";

      rows.forEach(row => {
        const f = row.querySelector('[data-type="front"]').value;
        const b = row.querySelector('[data-type="back"]').value;
        csv += `${f},${b}\n`;
      });

      const blob = new Blob([csv], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "words.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ===== 他の単語帳から単語を取り込む ===== */

    let importSelectedBookId = null;
    let importWords = []; // {id, front, back} の配列（取り込み元の単語、createdAt順）

    async function openImportModal() {
      document.getElementById("importModal").style.display = "flex";
      document.getElementById("importStep1").style.display = "block";
      document.getElementById("importStep2").style.display = "none";

      const listArea = document.getElementById("importBookList");
      listArea.innerHTML = `<div class="importEmpty">読み込み中...</div>`;

      try {
        const snap = await db.collection("wordbooks")
          .where("owner", "==", currentUser.uid)
          .get();

        const books = snap.docs
          .map(d => ({ id: d.id, title: d.data().title || "(無題)", wordCount: d.data().wordCount || 0 }));

        if (books.length === 0) {
          listArea.innerHTML = `<div class="importEmpty">取り込み元にできる単語帳がありません</div>`;
          return;
        }

        listArea.innerHTML = "";
        books.forEach(b => {
          const item = document.createElement("div");
          item.className = "importBookItem";
          item.innerHTML = `
            <span class="bookTitle">${escapeHtml(b.title)}</span>
            <span class="bookCount">${b.wordCount}語</span>
          `;
          item.addEventListener("click", () => selectImportBook(b.id, b.title));
          listArea.appendChild(item);
        });

      } catch (e) {
        console.error(e);
        listArea.innerHTML = `<div class="importEmpty">読み込みに失敗しました</div>`;
      }
    }

    async function selectImportBook(id, title) {
      importSelectedBookId = id;

      document.getElementById("importStep1").style.display = "none";
      document.getElementById("importStep2").style.display = "block";

      const wordArea = document.getElementById("importWordList");
      wordArea.innerHTML = `<div class="importEmpty">読み込み中...</div>`;
      document.getElementById("importMsg").textContent = "";

      try {
        const snap = await db.collection("wordbooks")
          .doc(id)
          .collection("words")
          .orderBy("createdAt")
          .get();

        importWords = snap.docs.map(d => ({
          id: d.id,
          front: d.data().front,
          back: d.data().back
        }));

        if (importWords.length === 0) {
          wordArea.innerHTML = `<div class="importEmpty">単語が登録されていません</div>`;
          return;
        }

        wordArea.innerHTML = "";
        importWords.forEach(w => {
          const row = document.createElement("label");
          row.className = "importWordRow";
          row.innerHTML = `
            <input type="checkbox" class="importWordCheck" data-id="${w.id}" checked>
            <span class="wordPair">${escapeHtml(w.front)} → ${escapeHtml(w.back)}</span>
          `;
          wordArea.appendChild(row);
        });

      } catch (e) {
        console.error(e);
        wordArea.innerHTML = `<div class="importEmpty">読み込みに失敗しました</div>`;
      }
    }

    function backToBookList() {
      document.getElementById("importStep1").style.display = "block";
      document.getElementById("importStep2").style.display = "none";
    }

    function toggleSelectAllImportWords() {
      const checks = document.querySelectorAll(".importWordCheck");
      const allChecked = Array.from(checks).every(c => c.checked);
      checks.forEach(c => c.checked = !allChecked);
    }

    function closeImportModal() {
      document.getElementById("importModal").style.display = "none";
      importSelectedBookId = null;
      importWords = [];
    }

    function confirmImportWords() {
      const checks = document.querySelectorAll(".importWordCheck:checked");
      const selectedIds = Array.from(checks).map(c => c.dataset.id);

      if (selectedIds.length === 0) {
        document.getElementById("importMsg").textContent = "取り込む単語を選択してください";
        return;
      }

      // 選択された単語を、取り込み元での並び順を保ったまま追加する
      const selectedIdSet = new Set(selectedIds);
      const orderedSelected = importWords.filter(w => selectedIdSet.has(w.id));

      orderedSelected.forEach(w => {
        addWordToList(nextLocalId(), w.front, w.back);
      });

      closeImportModal();
    }

    const front = document.getElementById("front");
    const back = document.getElementById("back");

    front.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault(); // フォーム送信を防ぐ（必要に応じて）
        back.focus();
      }
    });
    back.addEventListener("keydown", async function (event) {
      if (event.key === "Enter") {
        event.preventDefault();

        // 単語追加
        await addWord();

        // front に戻る
        front.focus();
      }
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
