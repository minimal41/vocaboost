<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>Flash</title>
  <link rel="apple-touch-icon" sizes="512x512" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <style>
    .card {
      background: var(--color-surface);
      color: var(--color-text);
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      min-height: 200px;
    }

    #front{
      font-size:30px;
      min-height: 100px;
      white-space: pre-wrap;
    }

    #back {
      font-size: 25px;
      min-height: 60px;
      white-space: pre-wrap;
    }

    #hintBtn {
      font-size: 13px;
      padding: 6px 12px;
    }

    #hintText,
    #noteText {
      font-size: 14px;
      color: var(--color-text-sub);
      margin-top: 8px;
      white-space: pre-wrap;
    }

    #quizCard {
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }

    #quizContent {
      flex-grow: 1;
      /* 答え・ヒント・解説を表示しても下のボタンの位置が動かないよう、あらかじめ高さを確保する */
      min-height: 370px;
    }

    #progress {
      margin-top: auto;
    }

    #progressWrap {
      width: 100%;
      height: 12px;
      background: var(--color-border);
      border-radius: 10px;
      margin-top: 15px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: var(--color-accent);
      transition: 0.3s;
    }

    #progressText {
      font-size: 14px;
      margin-top: 5px;
    }

    /* 高さブレ防止（これ重要） */
    #back {
      min-height: 30px;
    }
    /* 設定項目 */
    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(360px, 90%);
      margin: 10px auto;
      padding: 10px 16px;
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: 14px;
      cursor: pointer;
      transition: .2s;
      user-select: none;
      box-sizing: border-box;
    }

    .option:hover {
      border-color: var(--color-accent);
      background: var(--color-bg);
      transform: translateY(-1px);
    }

    .option input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border: 2px solid var(--color-accent);
      border-radius: 8px;
      background: var(--color-surface);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: .2s;
    }

    .option input[type="checkbox"]:checked {
      background: var(--color-accent);
    }

    .option input[type="checkbox"]::before {
      content: "";
      position: absolute;

      left: 50%;
      top: 50%;

      width: 7px;
      height: 12px;

      border-right: 3px solid white;
      border-bottom: 3px solid white;

      transform: translate(-50%, -58%) rotate(45deg);

      opacity: 0;
      transition: opacity .15s;
    }

    .option span {
      font-size: 18px;
      font-weight: 600;
    }

    .option input[type="checkbox"]:checked::before {
        opacity: 1;
    }

    @media (max-width:768px){

      .option{
        width:95%;
        padding:12px 14px;
      }

      .option input[type="checkbox"]{
        width:30px;
        height:30px;
      }

      .option span{
        font-size:17px;
      }
    }

    /* 覚えた単語のチェック */
    .answerRow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .knownOption {
      display: flex;
      cursor: pointer;
    }

    .knownOption input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      margin: 0;
      border: 2px solid var(--color-accent);
      border-radius: 6px;
      background: var(--color-surface);
      position: relative;
      cursor: pointer;
      transition: .2s;
    }

    .knownOption input[type="checkbox"]:checked {
      background: var(--color-accent);
    }

    .knownOption input[type="checkbox"]::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 11px;
      border-right: 3px solid white;
      border-bottom: 3px solid white;
      transform: translate(-50%, -58%) rotate(45deg);
      opacity: 0;
      transition: opacity .15s;
    }

    .knownOption input[type="checkbox"]:checked::before {
      opacity: 1;
    }

    #knownList {
      max-height: 60vh;
      overflow-y: auto;
      margin: 10px 0 20px;
    }

    #knownList .option span {
      font-size: 16px;
      font-weight: normal;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #knownList .knownBack {
      color: var(--color-text-sub);
    }

    #startMsg {
      min-height: 1em;
    }


    /* 全画面表示 */
    .fullscreenBar {
      text-align: center;
      /* カードの下の余白(40px)を詰めて、カードのすぐ下に置く */
      margin: -28px auto 30px;
    }

    #fullscreenBtn {
      font-size: 14px;
      padding: 8px 14px;
    }

    body.fullscreen-mode header,
    body.fullscreen-mode footer {
      display: none !important;
    }

    body.fullscreen-mode .card {
      max-width: min(1000px, 94vw);
      box-sizing: border-box;
      margin: 3vh auto 12px;
    }

    body.fullscreen-mode .fullscreenBar {
      margin-top: -4px;
      margin-bottom: 12px;
    }

    body.fullscreen-mode #quizCard {
      min-height: calc(100vh - 3vh - 90px);
      min-height: calc(100dvh - 3vh - 90px);
    }

    body.fullscreen-mode #front {
      font-size: 56px;
    }

    body.fullscreen-mode #back {
      font-size: 40px;
    }

    @media (max-width: 768px) {
      body.fullscreen-mode #front {
        font-size: 36px;
      }

      body.fullscreen-mode #back {
        font-size: 28px;
      }
    }


    /* 横スワイプでカードを移動するため、ブラウザの横方向のジェスチャーを抑える */
    #quizCard {
      touch-action: pan-y;
    }

  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none"
        onclick="window.goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="window.logout()">ログアウト</button>
    </div>
  </header>
  <main>
    <div class="card" id="start">
      <h2>フラッシュカード設定</h2>

      <label class="option">
        <input type="checkbox" id="skipKnownCheck" checked>
        <span>チェック済みをスキップ</span>
      </label>

      <label class="option">
        <input type="checkbox" id="randomCheck">
        <span>ランダム出題する</span>
      </label>

      <p id="startMsg"></p>

      <button id="knownListBtn" type="button" onclick="openKnownList()">チェック済みの単語を見る</button>
      <br><br>

      <button id="startBtn" onclick="startFlash()" disabled>読み込み中...</button>
      <br><br>
      <button onclick="goBack()">戻る</button>
    </div>
    <div class="card" id="knownCard" style="display:none">
      <h2>チェック済みの単語</h2>
      <p>チェックを外した単語は、次から出題されるようになります。</p>
      <div id="knownList"></div>
      <button type="button" onclick="closeKnownList()">戻る</button>
    </div>

    <div class="card" id="quizCard" style="display:none">

      <div id="quizContent">
        <h2 id="front"></h2>
        <button id="hintBtn" type="button" onclick="showHint()" style="display:none">ヒントを表示</button>
        <p id="hintText" style="display:none"></p>
        <p id="back" style="display:none"></p>
        <p id="noteText" style="display:none"></p>
      </div>

      <!-- 答えを見るボタンとチェックは、答えの長さで位置が動かないようカードの下の方に固定する -->
      <div class="answerRow">
        <button onclick="showBack()">答えを見る (Enter)</button>
        <label class="knownOption" title="覚えた（次から飛ばす）">
          <input type="checkbox" id="knownCheck" onchange="toggleKnownCurrent()" aria-label="覚えた（次から飛ばす）">
        </label>
      </div>

      <div id="progress">
        <div id="progressWrap">
          <div id="progressBar"></div>
        </div>
        <p id="progressText"></p>
      </div>

    </div>

    <div class="card" id="end" style="display:none">
      <h2>終了！</h2>
      <button onclick="restart()">もう一回</button>
      <button onclick="goBack()">戻る</button>
    </div>
  <div class="fullscreenBar">
    <button id="fullscreenBtn" type="button" onclick="toggleFullscreen()">全画面表示</button>
  </div>
  </main>
  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">検索</a>
        <a href="create.html">作成</a>
        <a href="favorites.html">お気に入り</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 他ページと同じFirebase SDK(compatビルド, 9.23.0)で統一する。
    // 以前このページだけ別バージョンのSDK(modularビルド, 11.8.1)で独自にinitializeAppしていたため、
    // 他ページ(compat 9.23.0)とは別のFirebase Auth/Firestoreインスタンスが動作しており、
    // 同じアカウントの認証状態の同期がずれて、長時間このページを開いたまま学習していると
    // 勝手にログアウト扱いになってしまう不具合の原因になっていた。
    const firebaseConfig = { apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E", authDomain: "quiz1-4ffdc.firebaseapp.com", projectId: "quiz1-4ffdc", storageBucket: "quiz1-4ffdc.firebasestorage.app", messagingSenderId: "152062126332", appId: "1:152062126332:web:845af237a1a76207214f79" };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    // ログイン情報のキャッシュを利用してヘッダーを即時表示
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    function handleSignedOut() {
      // cachedUserは明示的なログアウト操作(logout())でのみ削除する
      // (ここで消すと、次に一時的にnullが発火した際の再確認猶予が効かなくなるため)
      statusDiv.textContent = "ログアウト中";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      settingsBtn.style.display = "none";
    }

    // Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
    // 一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
    // 残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
    // 未ログインのままかを再確認する（暗記中に実際はログインしたままなのに
    // 一瞬ログアウト状態の表示になってしまう不具合を防ぐため）。
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
      } else if (localStorage.getItem("cachedUser")) {
        (function () {
          // 端末やネットワークが遅いと1回・1.5秒の再確認だけでは間に合わないことがあるため、
          // 間隔を広げながら最大4回(合計15秒)まで再確認してから本当に未ログインと判断する。
          const delays = [1000, 2000, 4000, 8000];
          const recheck = (i) => {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (i + 1 < delays.length) recheck(i + 1);
              else {
                handleSignedOut();
                if (window.VOCABOOST_SHOW_SESSION_LOST_NOTICE) {
                  window.VOCABOOST_SHOW_SESSION_LOST_NOTICE(!navigator.onLine);
                }
              }
            }, delays[i]);
          };
          recheck(0);
        })();
      } else {
        handleSignedOut();
      }
    });

    window.goPage = (page) => {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    };

    window.logout = () => {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    };

    const id = new URLSearchParams(location.search).get("id");
    let words = [], originalWords = [], i = 0, show = false;
    const quizCard = document.getElementById("quizCard");
    const endCard = document.getElementById("end");

    // 並び替え(order)フィールドで取得。未対応の単語帳（orderフィールド未付与）は
    // 結果が空になるため、その場合は作成日時順にフォールバックする
    // 読み込みが終わるまでスタートボタンを押せないようにする
    // （以前は読み込み前に押すと単語が0件のまま始まり、すぐ終了画面になっていた）
    (async function loadWords() {
      const startBtn = document.getElementById("startBtn");
      try {
        let snap = await db.collection("wordbooks").doc(id).collection("words").orderBy("order").get();
        if (snap.empty) {
          snap = await db.collection("wordbooks").doc(id).collection("words").orderBy("createdAt").get();
        }
        snap.forEach(d => originalWords.push(d.data()));
        words = originalWords.slice();
        if (originalWords.length === 0) {
          startBtn.textContent = "単語がありません";
          return;
        }
        startBtn.disabled = false;
        startBtn.textContent = "▶ スタート";
        updateKnownCount();
      } catch (e) {
        console.error(e);
        startBtn.textContent = "読み込みに失敗しました";
      }
    })();

    const hintBtn = document.getElementById("hintBtn");
    const hintText = document.getElementById("hintText");
    const noteText = document.getElementById("noteText");

    // 覚えた単語（チェック済み）の記録。単語帳ごとに表面の文字を保存する
    let known = {};
    try {
      known = JSON.parse(localStorage.getItem("flashKnownWords")) || {};
    } catch (e) {
      known = {};
    }
    if (!Array.isArray(known[id])) known[id] = [];

    function saveKnown() {
      try {
        localStorage.setItem("flashKnownWords", JSON.stringify(known));
      } catch (e) {
        console.warn("チェック済みの記録を保存できませんでした（端末の保存容量不足の可能性）", e);
      }
    }

    function setKnown(word, isKnown) {
      const idx = known[id].indexOf(word.front);
      if (isKnown && idx === -1) known[id].push(word.front);
      if (!isKnown && idx !== -1) known[id].splice(idx, 1);
      saveKnown();
    }

    function knownWordsInBook() {
      return originalWords.filter(w => known[id].includes(w.front));
    }

    function updateKnownCount() {
      const btn = document.getElementById("knownListBtn");
      if (btn) btn.textContent = `チェック済みの単語を見る (${knownWordsInBook().length})`;
    }

    // 出題中のカードの「覚えた」チェックを切り替えたとき
    window.toggleKnownCurrent = () => {
      const check = document.getElementById("knownCheck");
      setKnown(words[i], check.checked);
      // フォーカスが残ると、次のEnterやSpaceがチェックボックスに反応してしまうため外す
      check.blur();
    };

    // スタート前のページで、チェック済みの単語を一覧表示する
    window.openKnownList = () => {
      const list = document.getElementById("knownList");
      list.innerHTML = "";
      const items = knownWordsInBook();
      if (items.length === 0) {
        const p = document.createElement("p");
        p.textContent = "チェック済みの単語はありません";
        list.appendChild(p);
      }
      items.forEach(w => {
        const label = document.createElement("label");
        label.className = "option";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = true;
        input.addEventListener("change", () => setKnown(w, input.checked));
        const span = document.createElement("span");
        span.textContent = w.front;
        const backSpan = document.createElement("div");
        backSpan.className = "knownBack";
        backSpan.textContent = w.back || "";
        span.appendChild(backSpan);
        label.appendChild(input);
        label.appendChild(span);
        list.appendChild(label);
      });
      document.getElementById("startMsg").textContent = "";
      document.getElementById("start").style.display = "none";
      document.getElementById("knownCard").style.display = "block";
    };

    window.closeKnownList = () => {
      document.getElementById("knownCard").style.display = "none";
      document.getElementById("start").style.display = "block";
      updateKnownCount();
    };

    function render() {
      if (i >= words.length) {
        quizCard.style.display = "none";
        endCard.style.display = "block";
        return;
      }
      front.textContent = words[i].front;
      back.textContent = words[i].back;
      back.style.display = "none";
      show = false;
      document.getElementById("knownCheck").checked = known[id].includes(words[i].front);

      // ヒントは普段は非表示にしておき、「ヒントを表示」ボタンを押したときだけ見せる
      const hint = words[i].hint || "";
      hintBtn.style.display = hint ? "inline-block" : "none";
      hintText.textContent = hint ? `ヒント: ${hint}` : "";
      hintText.style.display = "none";

      // 解説は答えと一緒に常に表示する
      const note = words[i].note || "";
      noteText.textContent = note ? `解説: ${note}` : "";
      noteText.style.display = "none";

      const progress = Math.round(i / words.length * 100);
      document.getElementById("progressBar").style.width = progress + "%";
      document.getElementById("progressText").textContent =
        `${i+1}/${words.length} 問`;
    }

    window.showHint = () => {
      hintText.style.display = "block";

      // ボタンにフォーカスが残ったままだと、次のEnterキー押下(カードを進める操作)で
      // フォーカスの残ったこのボタンにもEnterが反応してクリックが再発火し、
      // 次のカード以降もヒントが自動で表示され続けてしまう。
      // クリック後はフォーカスを外して、Enterキーがこのボタンに反応しないようにする。
      hintBtn.blur();
    };

    window.showBack = () => {
      if (!show) {
        revealAnswer();
      } else {
        i++;
        render();
      }
    };

    window.restart = () => {
      i = 0;

      applyOrder();
      if (words.length === 0) {
        showNoWordsMessage();
        return;
      }

      endCard.style.display = "none";
      quizCard.style.display = "flex";

      render();
    };

    document.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;

      // Enterキーはここで処理するが、その時点でボタン(ヒント表示ボタンなど)に
      // フォーカスが残っていると、ブラウザ標準の「Enterでフォーカス中のボタンを
      // クリックする」動作が別途発火し、同じEnter一回でその関数が余分に
      // 呼ばれてしまう(例: ヒントを一度表示すると次のカード以降も
      // 自動でヒントが表示され続ける不具合の原因になっていた)。
      // それを防ぐため、Enterのデフォルト動作は抑止して自前の処理だけを行う。
      // カード表示中以外(スタート前・終了後)は何もしない
      if (quizCard.style.display !== "flex") return;
      e.preventDefault();

      showBack();
    });

    // 左右の矢印キーやスワイプで前後に移動する。
    // 進む: 1 → 1の答え → 2 → 2の答え、戻る: 2の答え → 2 → 1の答え → 1
    function revealAnswer() {
      back.style.display = "block";
      noteText.style.display = noteText.textContent ? "block" : "none";
      show = true;
    }

    function goNextCard() {
      if (i >= words.length) return;
      showBack();
    }

    function goPrevCard() {
      if (show) {
        // 答えを表示中なら、同じカードの答えを隠した状態に戻る
        back.style.display = "none";
        noteText.style.display = "none";
        show = false;
        return;
      }
      if (i <= 0) return;
      // 前のカードには、答えを表示した状態で戻る
      i--;
      render();
      revealAnswer();
    }

    document.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      if (quizCard.style.display !== "flex") return;
      e.preventDefault();
      if (e.key === "ArrowRight") goNextCard();
      else goPrevCard();
    });

    // 左へスワイプで次のカード、右へスワイプで前のカード
    let touchStartX = null, touchStartY = null;
    quizCard.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) {
        touchStartX = null;
        return;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    quizCard.addEventListener("touchend", e => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null;
      // 縦のスクロールと区別するため、横方向に十分動いたときだけ反応する
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (dx < 0) goNextCard();
      else goPrevCard();
    });


    window.goBack = () => {
      location.href = `view.html?id=${id}`;
    };


    // 偏りのないシャッフル（Fisher-Yates）。
    // 以前の sort(() => Math.random() - 0.5) は並びに偏りが出るうえ、
    // 元の配列を並べ替えてしまうため、ランダムを外して再スタートしても元の順に戻らなかった
    function shuffled(list) {
      const a = list.slice();
      for (let k = a.length - 1; k > 0; k--) {
        const r = Math.floor(Math.random() * (k + 1));
        [a[k], a[r]] = [a[r], a[k]];
      }
      return a;
    }

    function escapeTestHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function applyOrder() {
      const random = document.getElementById("randomCheck").checked;
      const skip = document.getElementById("skipKnownCheck").checked;

      // 「チェック済みをスキップ」がONなら、覚えたとチェックした単語は出題しない
      const base = skip
        ? originalWords.filter(w => !known[id].includes(w.front))
        : originalWords;

      if (random) {
        words = shuffled(base);
      } else {
        words = base.slice();
      }
    }

    // 出題する単語がないとき（すべてチェック済みのとき）はスタート前のページに戻して知らせる
    function showNoWordsMessage() {
      quizCard.style.display = "none";
      endCard.style.display = "none";
      document.getElementById("start").style.display = "block";
      updateKnownCount();
      document.getElementById("startMsg").textContent =
        "すべての単語がチェック済みです。チェックを外すか、「チェック済みをスキップ」をオフにしてください。";
    }

    window.startFlash = () => {
      applyOrder();
      if (words.length === 0) {
        showNoWordsMessage();
        return;
      }

      document.getElementById("start").style.display = "none";
      quizCard.style.display = "flex";

      render();
    };
  </script>

  <script>
    // 全画面表示：ヘッダーやフッターを隠してカードだけを表示する。
    // ブラウザの全画面(Fullscreen API)が使える端末ではそれも使う
    // （iPhoneのSafariなど使えない端末でも、ヘッダー・フッターは隠れる）
    (function () {
      const btn = document.getElementById("fullscreenBtn");

      function setFullscreenMode(on) {
        document.body.classList.toggle("fullscreen-mode", on);
        btn.textContent = on ? "全画面を終了" : "全画面表示";
      }

      function browserFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      window.toggleFullscreen = () => {
        const on = !document.body.classList.contains("fullscreen-mode");
        setFullscreenMode(on);
        const el = document.documentElement;
        try {
          if (on) {
            if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } else if (browserFullscreenElement()) {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        } catch (e) {
          // 全画面にできなくても、ヘッダー・フッターを隠す表示は続ける
        }
        // フォーカスが残ると、次のEnterでこのボタンが押されてしまうため外す
        btn.blur();
      };

      // Escキーなどでブラウザの全画面が解除されたら、表示も元に戻す
      function onFullscreenChange() {
        if (!browserFullscreenElement()) setFullscreenMode(false);
      }
      document.addEventListener("fullscreenchange", onFullscreenChange);
      document.addEventListener("webkitfullscreenchange", onFullscreenChange);
    })();
  </script>
