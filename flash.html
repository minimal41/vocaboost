<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>Flash</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <style>
    .card {
      background: var(--color-surface);
      color: var(--color-text);
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      min-height: 200px;
    }

    #front{
      font-size:30px;
      min-height: 100px;
    }

    #back {
      font-size: 25px;
      min-height: 60px;
    }
    #quizCard {
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }

    #quizContent {
      flex-grow: 1;
      min-height: 120px;
    }

    #progress {
      margin-top: auto;
    }

    #progressWrap {
      width: 100%;
      height: 12px;
      background: var(--color-border);
      border-radius: 10px;
      margin-top: 15px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: var(--color-accent);
      transition: 0.3s;
    }

    #progressText {
      font-size: 14px;
      margin-top: 5px;
    }

    /* 高さブレ防止（これ重要） */
    #back {
      min-height: 30px;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none"
        onclick="window.goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="window.logout()">ログアウト</button>
    </div>
  </header>
  <main>
    <div class="card" id="start">
      <h2>フラッシュカード設定</h2>

      <label>
        <input type="checkbox" id="randomCheck">ランダム出題
      </label><br><br>

      <button onclick="startFlash()">▶ スタート</button>
      <br><br>
      <button onclick="goBack()">戻る</button>
    </div>
    <div class="card" id="quizCard" style="display:none">

      <div id="quizContent">
        <h2 id="front"></h2>
        <p id="back" style="display:none"></p>
        <button onclick="showBack()">答えを見る (Enter)</button>
      </div>

      <div id="progress">
        <div id="progressWrap">
          <div id="progressBar"></div>
        </div>
        <p id="progressText"></p>
      </div>

    </div>

    <div class="card" id="end" style="display:none">
      <h2>終了！</h2>
      <button onclick="restart()">もう一回</button>
      <button onclick="goBack()">戻る</button>
    </div>
  </main>
  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E", authDomain: "quiz1-4ffdc.firebaseapp.com", projectId: "quiz1-4ffdc", storageBucket: "quiz1-4ffdc.firebasestorage.app", messagingSenderId: "152062126332", appId: "1:152062126332:web:845af237a1a76207214f79" };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    // ログイン情報のキャッシュを利用してヘッダーを即時表示
    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    function handleSignedOut() {
      localStorage.removeItem("cachedUser");
      statusDiv.textContent = "ログアウト中";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      settingsBtn.style.display = "none";
    }

    // Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
    // 一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
    // 残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
    // 未ログインのままかを再確認する（暗記中に実際はログインしたままなのに
    // 一瞬ログアウト状態の表示になってしまう不具合を防ぐため）。
    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({ uid: user.uid })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
      } else if (localStorage.getItem("cachedUser")) {
        setTimeout(() => {
          if (!auth.currentUser) handleSignedOut();
        }, 1500);
      } else {
        handleSignedOut();
      }
    });

    window.goPage = (page) => {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    };

    window.logout = () => {
      localStorage.removeItem("cachedUser");
      signOut(auth);
    };

    const id = new URLSearchParams(location.search).get("id");
    let words = [], i = 0, show = false;
    const quizCard = document.getElementById("quizCard");
    const endCard = document.getElementById("end");

    // 並び替え(order)フィールドで取得。未対応の単語帳（orderフィールド未付与）は
    // 結果が空になるため、その場合は作成日時順にフォールバックする
    let snap = await getDocs(query(collection(db, "wordbooks", id, "words"), orderBy("order")));
    if (snap.empty) {
      snap = await getDocs(query(collection(db, "wordbooks", id, "words"), orderBy("createdAt")));
    }
    snap.forEach(d => words.push(d.data()));

    function render() {
      if (i >= words.length) {
        quizCard.style.display = "none";
        endCard.style.display = "block";
        return;
      }
      front.textContent = words[i].front;
      back.textContent = words[i].back;
      back.style.display = "none";
      show = false;
      const progress = Math.round(i / words.length * 100);
      document.getElementById("progressBar").style.width = progress + "%";
      document.getElementById("progressText").textContent =
        `${i+1}/${words.length} 問`;
    }

    window.showBack = () => {
      if (!show) {
        back.style.display = "block";
        show = true;
      } else {
        i++;
        render();
      }
    };

    window.restart = () => {
      i = 0;

      applyOrder();

      endCard.style.display = "none";
      quizCard.style.display = "flex";

      render();
    };

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") showBack();
    });


    window.goBack = () => {
      location.href = `view.html?id=${id}`;
    };

    function applyOrder() {
      const random = document.getElementById("randomCheck").checked;

      if (random) {
        words.sort(() => Math.random() - 0.5);
      }
    }

    window.startFlash = () => {
      applyOrder();

      document.getElementById("start").style.display = "none";
      quizCard.style.display = "flex";

      render();
    };
  </script>
  <script src="account-widgets.js"></script>
</body>

</html>
