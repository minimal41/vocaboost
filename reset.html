<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
<title>パスワード再設定</title>

<link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
<link rel="icon" type="image/x-icon" href="./images/favicon.ico">

<link rel="stylesheet" type="text/css" href="style.css">
<link rel="stylesheet" type="text/css" href="login.css">
</head>

<body>

<div class="card">

  <h2>パスワード再設定</h2>

  <form onsubmit="resetPassword(); return false;">

    <div class="mailaddress">
      <input id="emailHead" placeholder="メール">
      <div class="domain">@edu.nishiyamato.ed.jp</div>
    </div>

    <input
      id="password"
      type="password"
      placeholder="新しいパスワード"
    >

    <input
      id="password2"
      type="password"
      placeholder="新しいパスワード（確認）"
    >

    <button type="submit">
      パスワードを変更
    </button>

    <div class="notice" id="msg"></div>

    <div class="link">
      <a href="login.html">
        ログインに戻る
      </a>
    </div>

  </form>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
  authDomain: "quiz1-4ffdc.firebaseapp.com",
  projectId: "quiz1-4ffdc"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const params = new URLSearchParams(location.search);

const oobCode = params.get("oobCode");

window.resetPassword = async function(){

  const input =
    document.getElementById("emailHead").value.trim();

  const pass =
    document.getElementById("password").value;

  const pass2 =
    document.getElementById("password2").value;

  const msg =
    document.getElementById("msg");

  msg.textContent = "";

  if(!input || !pass || !pass2){
    msg.textContent = "すべて入力してください";
    return;
  }

  if(pass !== pass2){
    msg.textContent =
      "パスワードが一致しません";
    return;
  }

  let email = "";

  if(input.includes("@")){
    email = input;
  }else{
    email = input + "@edu.nishiyamato.ed.jp";
  }

  try{

    await auth.confirmPasswordReset(
      oobCode,
      pass
    );

    msg.textContent =
      "パスワードを変更しました";

    setTimeout(()=>{
      location.href = "login.html";
    },1500);

  }catch(e){

    msg.textContent =
      "エラー：" + e.message;

    console.error(e);

  }

};

</script>

<script src="analytics-tracker.js"></script>

</body>
</html>
