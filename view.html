<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>View</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <style>
    .main {
      flex: 1;
    }

    .card {
      background: white;
      max-width: 45%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      align-items: center;
      min-height: 480px;
      box-sizing: border-box;
    }

    #title {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .detail-info {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .detail-info a {
      color: #191970;
      text-decoration: underline;
    }

    #description {
      text-align: left;
      font-size: 14px;
      color: #333;
      background: #f9faff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    #btn3 {
      display: flex;
      align-items: center;
      text-align: center;
    }

    a.btn {
      background: white;
      color: #191970;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #191970;
      width: 100%;
      margin-left: 5px;
      margin-right: 5px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .word {
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
      cursor: text;
    }
    .detail-info {
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .card{
        max-width:90%;
      }
      #title{
        font-size: 20px;
      }
      #detailInfo{
        font-size: 12px;
      }
      #words{
        font-size: 14px;
      }
    }
    #description a {
      color: #191970;
      text-decoration: underline;
      word-break: break-all;
    }
    #words{
      user-select: none;
    }

    #btn3{
      user-select: none;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <button id="mypageBtn" class="header-btn" style="display:none"
        onclick="window.goPage('mypage.html')">マイページ</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="window.logout()">ログアウト</button>
    </div>
  </header>
  <div class="main">
    <div class="card">
      <h2 id="title"></h2>
      <div id="detailInfo" class="detail-info"></div>
      <div id="description" style="display:none"></div>
      <div id="btn3">
        <a class="btn" id="editBtn" style="display:none">編集</a>
        <a class="btn" id="flashBtn" onclick="goStudy('flash.html')">暗記</a>
        <a class="btn" id="testBtn" onclick="goStudy('test.html')">テスト</a>
      </div>
      <div id="words"></div>
    </div>
  </div>
  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="mypage.html">マイページ</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E", authDomain: "quiz1-4ffdc.firebaseapp.com", projectId: "quiz1-4ffdc", storageBucket: "quiz1-4ffdc.firebasestorage.app", messagingSenderId: "152062126332", appId: "1:152062126332:web:845af237a1a76207214f79" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const id = new URLSearchParams(location.search).get("id");
    const cacheKey = `book_${id}`;
    let owner;
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const mypageBtn = document.getElementById("mypageBtn");

    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      mypageBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    window.goPage = (page) => {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      if (currentUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    };

    window.logout = () => {

      localStorage.removeItem("cachedUser");

      auth.signOut();
    };

    // キャッシュがあれば先に表示
    const cachedBook = localStorage.getItem(cacheKey);

    if (cachedBook) {
      try {
        const data = JSON.parse(cachedBook);

        document.getElementById("title").textContent = data.title || "";
        document.getElementById("detailInfo").innerHTML = data.detailHtml || "";
        document.getElementById("words").innerHTML = data.wordsHtml || "";

        if (data.descriptionHtml) {
          const desc = document.getElementById("description");
          desc.innerHTML = data.descriptionHtml;
          desc.style.display = "block";
        }

        // 自分の単語帳なら編集ボタンを即表示
        const savedUser =
          JSON.parse(localStorage.getItem("cachedUser"));

        if (
          savedUser &&
          data.owner &&
          savedUser.uid === data.owner
        ) {
          const editBtn = document.getElementById("editBtn");

          editBtn.style.display = "inline";
          editBtn.href = `edit.html?id=${id}`;
        }

      } catch (e) {
        console.error(e);
      }
    }

    const qWords = query(
      collection(db, "wordbooks", id, "words"),
      orderBy("createdAt")
    );

    // 単語帳情報と単語一覧を同時取得
    const [bookSnap, wSnap] = await Promise.all([
      getDoc(doc(db, "wordbooks", id)),
      getDocs(qWords)
    ]);

    if (!bookSnap.exists()) {
      alert("単語帳が見つかりません");
      location.href = "index.html";
    }

    const book = bookSnap.data();
    owner = book.owner;

    document.getElementById("title").textContent = book.title;

    // 詳細情報
    const details = [];

    if (book.ownerName) {
      details.push(`作成者: <a href="user.html?id=${owner}">${book.ownerName}</a>`);
    }

    const updateDate =
      book.updatedAt
        ? book.updatedAt.toDate()
        : (book.createdAt ? book.createdAt.toDate() : null);

    if (updateDate) {
      const y = updateDate.getFullYear();
      const m = updateDate.getMonth() + 1;
      const d = updateDate.getDate();

      details.push(`最終更新: ${y}/${m}/${d}`);
    }

    if (book.wordCount !== undefined) {
      details.push(`計 ${book.wordCount} 単語`);
    }

    document.getElementById("detailInfo").innerHTML =
      details.join(" | ");

    if (book.description) {

      const descDiv = document.getElementById("description");

      const linkedText = book.description.replace(
        /(https?:\/\/[^\s]+)/g,
        (url) => {

          const internalPrefix =
            "https://minimal41.github.io/vocaboost/view.html";

          if (url.startsWith(internalPrefix)) {
            return `<a href="${url}">${url}</a>`;
          }

          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
        }
      );

      descDiv.innerHTML = linkedText;
      descDiv.style.display = "block";
    }

    const wordsDiv = document.getElementById("words");

    let wordsHtml = "";

    wSnap.forEach(d => {
      const data = d.data();

      wordsHtml += `
        <div class="word">
          ${data.front} - ${data.back}
        </div>
      `;
    });

    wordsDiv.innerHTML = wordsHtml;

    // 最新データをキャッシュ保存
    localStorage.setItem(
      cacheKey,
      JSON.stringify({
        owner: owner,
        title: book.title,
        detailHtml: document.getElementById("detailInfo").innerHTML,
        descriptionHtml: document.getElementById("description").innerHTML,
        wordsHtml
      })
    );

    window.goStudy = (page) => {
      if (currentUser) {
        location.href = `${page}?id=${id}`;
      } else {
        const redirect = `${page}?id=${id}`;
        location.href = `login.html?redirect=${encodeURIComponent(redirect)}`;
      }
    };

    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (user) {

        localStorage.setItem(
          "cachedUser",
          JSON.stringify({
            uid: user.uid
          })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        mypageBtn.style.display = "inline-block";

        if (user.uid === owner) {
          const editBtn = document.getElementById("editBtn");
          editBtn.style.display = "inline";
          editBtn.href = `edit.html?id=${id}`;
        }
      } else {
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        mypageBtn.style.display = "none";
      }
    });
  </script>
</body>

</html>
