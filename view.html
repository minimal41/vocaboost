<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <title>View</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <style>
    .main {
      flex: 1;
    }

    .card {
      background: var(--color-surface);
      color: var(--color-text);
      max-width: 45%;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      align-items: center;
      min-height: 480px;
      box-sizing: border-box;
    }

    #title {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .detail-info {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      text-align: center;
      font-size: 13px;
      color: var(--color-text-sub);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .detail-info a {
      color: var(--color-accent);
      text-decoration: underline;
    }

    .meta-row {
      margin: 0;
    }

    #description {
      text-align: left;
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    #btn3 {
      display: flex;
      align-items: center;
      text-align: center;
    }

    a.btn {
      background: var(--color-surface);
      color: var(--color-accent);
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid var(--color-accent);
      width: 100%;
      margin-left: 5px;
      margin-right: 5px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .word {
      border-bottom: 1px solid var(--color-border);
      padding: 6px 0;
      cursor: text;
    }
    .detail-info {
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .card{
        max-width:90%;
      }
      #title{
        font-size: 20px;
      }
      #detailInfo{
        font-size: 12px;
      }
      #words{
        font-size: 14px;
      }
    }
    #description a {
      color: var(--color-accent);
      text-decoration: underline;
      word-break: break-all;
    }
    #words{
      user-select: none;
    }

    #btn3{
      user-select: none;
    }

    #reportLink {
      display: none;
      width: 100%;
      text-align: center;
      margin: 4px 0 20px;
      font-size: 12px;
      color: var(--color-text-sub);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    .modalBox {
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 460px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .modalDesc {
      font-size: 13px;
      color: var(--color-text-sub);
      margin-bottom: 10px;
    }

    .modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    #reportReason {
      width: 100%;
      box-sizing: border-box;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }

    .notice {
      color: var(--color-danger);
      min-height: 1.2em;
      font-size: 13px;
    }

    .success {
      color: var(--color-success);
      min-height: 1.2em;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle"><a href="index.html"><img src="./images/rogo.png" height="70vh"></a></p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none"
        onclick="window.goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="window.logout()">ログアウト</button>
    </div>
  </header>
  <div class="main">
    <div class="card">
      <h2 id="title"></h2>
      <div id="detailInfo" class="detail-info"></div>
      <button type="button" id="reportLink" onclick="openReportModal()">この単語帳を報告する</button>
      <div id="description" style="display:none"></div>
      <div id="btn3">
        <a class="btn" id="editBtn" style="display:none">編集</a>
        <a class="btn" id="flashBtn" onclick="goStudy('flash.html')">暗記</a>
        <a class="btn" id="testBtn" onclick="goStudy('test.html')">テスト</a>
      </div>
      <div id="words"></div>
    </div>
  </div>

  <div id="reportModal" class="modalOverlay" style="display:none;">
    <div class="modalBox">
      <h3>この単語帳を報告する</h3>
      <p class="modalDesc">通報内容は運営にのみ共有されます。通報理由を入力してください（必須）。</p>
      <textarea id="reportReason" placeholder="例：不適切な内容が含まれている、スパム など"></textarea>
      <div id="reportMsg" class="notice"></div>
      <div class="modalActions">
        <button type="button" onclick="closeReportModal()">キャンセル</button>
        <button type="button" onclick="submitReport()">通報する</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div><img src="./images/rogo.png" height="70vh"></div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">公開単語帳</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E", authDomain: "quiz1-4ffdc.firebaseapp.com", projectId: "quiz1-4ffdc", storageBucket: "quiz1-4ffdc.firebasestorage.app", messagingSenderId: "152062126332", appId: "1:152062126332:web:845af237a1a76207214f79" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const id = new URLSearchParams(location.search).get("id");
    const cacheKey = `book_${id}`;
    let owner;
    let currentUser = null;

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");

    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {
      settingsBtn.style.display = "inline-block";
      logoutBtn.style.display = "inline-block";
      loginBtn.style.display = "none";
    }

    window.goPage = (page) => {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    };

    window.logout = () => {

      localStorage.removeItem("cachedUser");

      auth.signOut();
    };

    // キャッシュがあれば先に表示
    const cachedBook = localStorage.getItem(cacheKey);

    if (cachedBook) {
      try {
        const data = JSON.parse(cachedBook);

        document.getElementById("title").textContent = data.title || "";
        document.getElementById("detailInfo").innerHTML = data.detailHtml || "";
        document.getElementById("words").innerHTML = data.wordsHtml || "";

        if (data.descriptionHtml) {
          const desc = document.getElementById("description");
          desc.innerHTML = data.descriptionHtml;
          desc.style.display = "block";
        }

        // 自分の単語帳なら編集ボタンを即表示
        const savedUser =
          JSON.parse(localStorage.getItem("cachedUser"));

        if (
          savedUser &&
          data.owner &&
          savedUser.uid === data.owner
        ) {
          const editBtn = document.getElementById("editBtn");

          editBtn.style.display = "inline";
          editBtn.href = `edit.html?id=${id}`;
        }

      } catch (e) {
        console.error(e);
      }
    }

    // 単語帳情報を先に取得
    const bookSnap = await getDoc(doc(db, "wordbooks", id));

    // 単語一覧：並び替え(order)フィールドで取得する。
    // まだ並び替え機能導入前（orderフィールド未付与）の単語帳では
    // 該当クエリの結果が空になるため、その場合は作成日時順にフォールバックする
    let wSnap = await getDocs(query(
      collection(db, "wordbooks", id, "words"),
      orderBy("order")
    ));

    if (wSnap.empty) {
      wSnap = await getDocs(query(
        collection(db, "wordbooks", id, "words"),
        orderBy("createdAt")
      ));
    }

    if (!bookSnap.exists()) {
      alert("単語帳が見つかりません");
      location.href = "index.html";
    }

    const book = bookSnap.data();
    owner = book.owner;

    document.getElementById("title").textContent = book.title;

    // XSS対策: テキストをそのまま innerHTML に差し込まないようにエスケープする
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 作成者の写真：未ログインの閲覧者は users コレクションを読み取れない
    // （Firestoreルールでログイン必須のため）ので、ownerNameと同様に
    // wordbookドキュメント側に複製されたownerPhotoURLをそのまま使う。
    const ownerPhotoURL = book.ownerPhotoURL || null;

    // 詳細情報：作成者は外枠付きボタン風リンク、それ以外はテキストで表示する
    let creatorHtml = "";
    if (book.ownerName) {
      creatorHtml = `
        <a href="user.html?id=${owner}" class="creator-btn">
          ${window.VOCABOOST_AVATAR_HTML(ownerPhotoURL, 24)}
          <span>${escapeHtml(book.ownerName)}</span>
        </a>
      `;
    }

    const metaParts = [];

    const updateDate =
      book.updatedAt
        ? book.updatedAt.toDate()
        : (book.createdAt ? book.createdAt.toDate() : null);

    if (updateDate) {
      const y = updateDate.getFullYear();
      const m = updateDate.getMonth() + 1;
      const d = updateDate.getDate();

      metaParts.push(`最終更新: ${y}/${m}/${d}`);
    }

    if (book.wordCount !== undefined) {
      metaParts.push(`計 ${book.wordCount} 単語`);
    }

    const metaHtml = metaParts.length
      ? `<div class="meta-row">${metaParts.join(" | ")}</div>`
      : "";

    document.getElementById("detailInfo").innerHTML = creatorHtml + metaHtml;

    const descDiv = document.getElementById("description");

    if (book.description) {

      const linkedText = book.description.replace(
        /(https?:\/\/[^\s]+)/g,
        (url) => {

          const internalPrefix =
            "https://minimal41.github.io/vocaboost/view.html";

          if (url.startsWith(internalPrefix)) {
            return `<a href="${url}">${url}</a>`;
          }

          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
        }
      );

      descDiv.innerHTML = linkedText;
      descDiv.style.display = "block";
    } else {
      // 説明文が削除された場合、古い内容がDOMやキャッシュに残らないようクリアする
      descDiv.innerHTML = "";
      descDiv.style.display = "none";
    }

    const wordsDiv = document.getElementById("words");

    let wordsHtml = "";

    wSnap.forEach(d => {
      const data = d.data();

      wordsHtml += `
        <div class="word">
          ${data.front} - ${data.back}
        </div>
      `;
    });

    wordsDiv.innerHTML = wordsHtml;

    // 最新データをキャッシュ保存
    localStorage.setItem(
      cacheKey,
      JSON.stringify({
        owner: owner,
        title: book.title,
        detailHtml: document.getElementById("detailInfo").innerHTML,
        descriptionHtml: document.getElementById("description").innerHTML,
        wordsHtml
      })
    );

    window.goStudy = (page) => {
      if (currentUser) {
        location.href = `${page}?id=${id}`;
      } else {
        const redirect = `${page}?id=${id}`;
        location.href = `login.html?redirect=${encodeURIComponent(redirect)}`;
      }
    };

    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (user) {

        localStorage.setItem(
          "cachedUser",
          JSON.stringify({
            uid: user.uid
          })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";

        if (user.uid === owner) {
          const editBtn = document.getElementById("editBtn");
          editBtn.style.display = "inline";
          editBtn.href = `edit.html?id=${id}`;
        } else {
          document.getElementById("reportLink").style.display = "block";
        }
      } else {
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        settingsBtn.style.display = "none";
      }
    });

    window.openReportModal = () => {
      if (!currentUser) {
        alert("ログインしてください");
        return;
      }
      document.getElementById("reportReason").value = "";
      document.getElementById("reportMsg").textContent = "";
      document.getElementById("reportMsg").className = "notice";
      document.getElementById("reportModal").style.display = "flex";
    };

    window.closeReportModal = () => {
      document.getElementById("reportModal").style.display = "none";
    };

    window.submitReport = async () => {
      const reason = document.getElementById("reportReason").value.trim();
      const msg = document.getElementById("reportMsg");

      if (!reason) {
        msg.className = "notice";
        msg.textContent = "通報理由を入力してください";
        return;
      }
      if (!currentUser) {
        msg.className = "notice";
        msg.textContent = "ログインしてください";
        return;
      }

      msg.className = "notice";
      msg.textContent = "送信しています...";

      try {
        await addDoc(collection(db, "reports"), {
          type: "wordbook",
          targetId: id,
          targetLabel: book.title || "",
          reason: reason,
          reportedBy: currentUser.uid,
          reportedByEmail: currentUser.email || "",
          createdAt: serverTimestamp()
        });

        // 運営のヘッダー通知ベルにだけ届く通知（通報理由の中身は含めない）
        try {
          await addDoc(collection(db, "notifications"), {
            title: "新しい通報があります",
            body: `単語帳「${book.title || "(無題)"}」が通報されました`,
            target: "admin",
            targetUserIds: [],
            createdAt: serverTimestamp(),
            createdBy: currentUser.uid
          });
        } catch (e) {
          console.error("admin notification failed", e);
        }

        msg.className = "success";
        msg.textContent = "通報しました。ご協力ありがとうございます。";
        setTimeout(() => { window.closeReportModal(); }, 1200);
      } catch (e) {
        console.error(e);
        msg.className = "notice";
        msg.textContent = "送信に失敗しました: " + e.message;
      }
    };
  </script>
  <script src="account-widgets.js"></script>
</body>

</html>
