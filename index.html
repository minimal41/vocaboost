<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <link rel="apple-touch-icon" sizes="512x512" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <title>Vocaboost</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <script>
    // ページの初期読み込みと競合しないよう、load完了後にService Workerを登録する
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(registration => {
          console.log('ServiceWorker registration successful.');
        }).catch(err => {
          console.log('ServiceWorker registration failed.');
        });
      });
    }
  </script>
  <style>
    .card {
      background: var(--color-bg);
      border-radius: 12px;
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      text-align: center;
      justify-content: center;
    }

    .list {
      background: var(--color-surface);
      color: var(--color-text);
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    .wordbook {
      display: flex;
      justify-content: space-between;
      min-height: 20px;
      width: 100%;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }
    .wordbook a {
      display: block;
      padding: 10px;
      width: 100%;
      border: solid thin var(--color-accent);
      border-radius: 10px;
    }

    a {
      text-decoration: none;
      color: var(--color-accent);
      font-weight: bold;
    }

    html,
    body {
      height: 100vw;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }

    main {
      flex: 1;
      max-width: 1000px;
      margin: 30px auto;
      text-align: center;
    }


    #dashboard {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    #myBooks {
      width: 42%;
      min-height: 200px;
      position: relative;
    }

    #noticeBox {
      width: 42%;
      min-height: 200px;
    }

    #noticeBox ul {
      padding-left: 20px;
      text-align: left;
    }

    #noticeBox li {
      margin-bottom: 8px;
    }

    .maincard {
      font-size: 20px;
      border: solid 2px var(--color-accent);
      background-color: var(--color-surface);
      color: var(--color-accent);
      width: 40%;
      height: 100px;
    }

    .maincard1,
    .maincard2,
    .maincard3 {
      font-size: 20px;
      border: solid 2px var(--color-accent);
      background-color: var(--color-surface);
      color: var(--color-accent);
      width: 28%;
      min-width: 160px;
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .cardpicture1,
    .cardpicture2,
    .cardpicture3 {
      height: 55px;
      width: auto;
      max-width: 90%;
      display: block;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .cardpicture1,
      .cardpicture2,
      .cardpicture3 {
        height: 40px;
      }
    }
    .openword {
      color: var(--color-text);
      font-weight: normal;
    }
    @media (max-width: 768px) {
      html,body {
        width: 100vw;
        background-color: var(--color-surface);
      }
      .card {
        background-color: var(--color-surface);
      }
      .myBooksh2 {
        display: none;
      }
      #dashboard {
        text-align :center;
        width: 100%;
        display: block;
      }
      #myBooks {
        width:90%;
        min-height: 200px;
        font-size: 14px;
      }
      #noticeBox {
        width:90%;
        min-height: 200px;
        border: solid;
        border-radius: 10px;
      }
      /* スマホ幅：3つのボタンを横一列に並べ、枠なし・薄い水色の丸いボタンにする */
      .card {
        flex-wrap: nowrap;
        gap: 12px;
        padding: 4px 8px;
      }
      .maincard1,
      .maincard2,
      .maincard3 {
        flex: 0 1 100px;
        width: auto;
        min-width: 0;
        height: auto;
        aspect-ratio: 1 / 1;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 50%;
        /* パソコン版のページ背景と同じ色 */
        background-color: var(--color-bg);
        color: var(--color-accent);
        font-size: 14px;
        font-weight: bold;
      }
      html[data-theme="dark"] .maincard1,
      html[data-theme="dark"] .maincard2,
      html[data-theme="dark"] .maincard3 {
        color: var(--color-text);
      }
      .cardpicture1,
      .cardpicture2,
      .cardpicture3 {
        height: 34px;
        max-width: 70%;
      }
      .modal-content {
        width: 90%;
        margin: 0;
        padding: 0;
      }
      .modal-title {
        font-size: 14px;
      }
      .modalnaiyou {
        font-size: 14px;
      }
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }
    .modal-content {
      background-color: #fefefe;  /* モーダルウィンドウの背景色 */
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888888;
      border-radius: 12px;
      width: 40%;  /* モーダルウィンドウの横幅 */
      text-align:center;
      
    }
    .modal-title {
      color: #800000; /* モーダルウィンドウの文字の色 */
      font-size: 18px; /* モーダルウィンドウの文字の大きさ */
      font-weight: bold;
      line-height: 200%;
      text-align: center;
    }
    .close-button {
      color: #aaaaaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }
    .close-button:hover,
    .close-button:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    .modallink{
      text-decoration: underline;
    }
    #bookList{
      user-select: none;
    }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Firestoreオフラインキャッシュ
    db.enablePersistence()
      .then(() => {
        console.log("Firestore persistence enabled");
      })
      .catch(err => {
        console.log("Persistence Error:", err);
      });

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");
    const dashboardDiv = document.getElementById("dashboard");
    const bookListDiv = document.getElementById("bookList");

    let currentUser = null;

    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {

      dashboardDiv.style.display = "flex";

      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
      settingsBtn.style.display = "inline-block";

      // キャッシュされた単語帳を即表示
      loadMyBooks(savedUser.uid);
    }

    const cachedUser = auth.currentUser;

    if (cachedUser) {
      dashboardDiv.style.display = "flex";
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
      settingsBtn.style.display = "inline-block";

      // 先に単語帳表示
      loadMyBooks(cachedUser.uid);
    }
  
    function handleSignedOut() {
      statusDiv.textContent = "ログアウト中";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      settingsBtn.style.display = "none";
      dashboardDiv.style.display = "none";
      hideLoading();
      // cachedUserは明示的なログアウト操作(logout())でのみ削除する
      // (ここで消すと、次に一時的にnullが発火した際の再確認猶予が効かなくなるため)
    }

    /* Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
       一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
       残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
       未ログインのままかを再確認する（実際はログインしたままなのにダッシュボードが
       一瞬消えてログアウト状態の表示になってしまう不具合を防ぐため）。 */
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({
            uid: user.uid
          })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
        dashboardDiv.style.display = "flex";
        loadMyBooks(user.uid);
      } else if (localStorage.getItem("cachedUser")) {
        (function () {
          // 端末やネットワークが遅いと1回・1.5秒の再確認だけでは間に合わないことがあるため、
          // 間隔を広げながら最大4回(合計15秒)まで再確認してから本当に未ログインと判断する。
          const delays = [1000, 2000, 4000, 8000];
          const recheck = (i) => {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (i + 1 < delays.length) recheck(i + 1);
              else {
                handleSignedOut();
                if (window.VOCABOOST_SHOW_SESSION_LOST_NOTICE) {
                  window.VOCABOOST_SHOW_SESSION_LOST_NOTICE(!navigator.onLine);
                }
              }
            }, delays[i]);
          };
          recheck(0);
        })();
      } else {
        handleSignedOut();
      }
    });

    function showLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
      }
    }

    function hideLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    }

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    }

    function displayBooks(books) {
      bookListDiv.innerHTML = "";

      if (!books || books.length === 0) {
        bookListDiv.innerHTML = "<p>まだ単語帳がありません</p>";
        return;
      }

      books.forEach(book => {
        const div = document.createElement("div");
        div.className = "wordbook";

        // タイトルはユーザー入力のためtextContentで設定する（HTMLとして解釈させない）
        const link = document.createElement("a");
        link.href = "view.html?id=" + encodeURIComponent(book.id);
        link.className = "openword";
        const span = document.createElement("span");
        span.textContent = book.title || "(無題)";
        link.appendChild(span);
        div.appendChild(link);

        bookListDiv.appendChild(div);
      });
    }

    function loadMyBooks(uid) {

      // まずキャッシュ表示
      const cacheKey = `myBooks_${uid}`;
      const cachedBooks = localStorage.getItem(cacheKey);

      if (cachedBooks) {
        try {
          displayBooks(JSON.parse(cachedBooks));
          hideLoading();
        } catch (e) {
          console.log(e);
        }
      }

      // 最新データ取得
      if (!cachedBooks) {
        showLoading();
      }

      const finish = (books) => {
        // 描画を最優先で行う。キャッシュ保存(localStorage)は容量超過(QuotaExceededError)
        // などで失敗することがあるが、その場合でも取得できたデータは必ず表示する。
        displayBooks(books);

        hideLoading();

        try {
          localStorage.setItem(
            cacheKey,
            JSON.stringify(books)
          );
        } catch (e) {
          console.warn("単語帳一覧のキャッシュ保存に失敗しました(表示には影響しません)", e);
        }
      };

      // 表示・並び替えに使うのはid/title/createdAtだけだが、以前は
      // ...doc.data()で単語帳ドキュメント全体（作成者の写真ownerPhotoURL等の
      // base64画像を含む）をそのままキャッシュに保存していたため、単語帳を
      // 多く持つユーザーほどlocalStorageの容量超過(QuotaExceededError)を
      // 起こしやすくなっていた。表示に必要な項目だけを抜き出して保存する。
      const toBooks = (snapshot) => {
        const books = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          books.push({
            id: doc.id,
            title: data.title,
            createdAt: data.createdAt
          });
        });
        return books;
      };

      // createdAtでの並び替えにはowner/createdAtの複合インデックスが必要。
      // 未作成の環境や、作成直後でcreatedAtがまだ無い/反映されていない単語帳が
      // 単語帳一覧から消えてしまわないよう、失敗時はorderByなしで取得して
      // クライアント側で並び替える。
      // Firestoreのオフライン永続化(enablePersistence)により、電波が無い状態でも
      // get()自体は「成功」で返ってくることがあるが、その内容はローカルの
      // Firestoreキャッシュにたまたま無かっただけの不完全な結果(0件)の場合がある
      // (snapshot.metadata.fromCache === true で判別できる)。
      // すでに自前のキャッシュ(cachedBooks)で単語帳を表示できている状態でこれが
      // 起きると、本当は単語帳があるのに「まだ単語帳がありません」に上書きされて
      // しまうため、fromCacheかつ0件で、かつ表示中のキャッシュがある場合は
      // 上書きしない（オンライン復帰後の取得で正しく反映される）。
      function shouldSkipEmptyFromCacheResult(snapshot) {
        return !!(snapshot.metadata && snapshot.metadata.fromCache && snapshot.empty && cachedBooks);
      }

      db.collection("wordbooks")
        .where("owner", "==", uid)
        .orderBy("createdAt", "desc")
        .get()
        .then(snapshot => {
          if (shouldSkipEmptyFromCacheResult(snapshot)) {
            hideLoading();
            return;
          }
          finish(toBooks(snapshot));
        })
        .catch(err => {
          console.warn("createdAt順の取得に失敗。フォールバックします。", err);

          db.collection("wordbooks")
            .where("owner", "==", uid)
            .get()
            .then(snapshot => {
              if (shouldSkipEmptyFromCacheResult(snapshot)) {
                hideLoading();
                return;
              }

              const books = toBooks(snapshot);

              books.sort((a, b) => {
                const aTime = a.createdAt ? a.createdAt.toMillis() : 0;
                const bTime = b.createdAt ? b.createdAt.toMillis() : 0;
                return bTime - aTime;
              });

              finish(books);
            })
            .catch(fallbackErr => {
              hideLoading();
              console.error(fallbackErr);

              if (!cachedBooks) {
                alert("読み込みエラー: " + fallbackErr.message);
              }
            });
        });
    }

    async function addCreatedAtToOldData() {
      const snapshot = await db.collection("wordbooks").get();

      let count = 0;

      for (const doc of snapshot.docs) {
        const data = doc.data();

        // createdAt が無いものだけ追加
        if (!data.createdAt) {
          await db.collection("wordbooks").doc(doc.id).update({
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          count++;
          console.log("追加:", doc.id);
        }
      }

      alert(count + " 件に createdAt を追加しました");
    }
  </script>
