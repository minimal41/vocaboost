<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=yes">
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <title>Vocaboost</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <script>
    // ページの初期読み込みと競合しないよう、load完了後にService Workerを登録する
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(registration => {
          console.log('ServiceWorker registration successful.');
        }).catch(err => {
          console.log('ServiceWorker registration failed.');
        });
      });
    }
  </script>
  <style>
    .card {
      background: var(--color-bg);
      border-radius: 12px;
      align-items: center;
      display: flex;
      text-align: center;
      justify-content: center;
    }

    .list {
      background: var(--color-surface);
      color: var(--color-text);
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    .wordbook {
      display: flex;
      justify-content: space-between;
      min-height: 20px;
      width: 100%;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }
    .wordbook a {
      display: block;
      padding: 10px;
      width: 100%;
      border: solid thin var(--color-accent);
      border-radius: 10px;
    }

    a {
      text-decoration: none;
      color: var(--color-accent);
      font-weight: bold;
    }

    html,
    body {
      height: 100vw;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }

    main {
      flex: 1;
      max-width: 1000px;
      margin: 30px auto;
      text-align: center;
    }


    #dashboard {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    #myBooks {
      width: 42%;
      min-height: 200px;
      position: relative;
    }

    #noticeBox {
      width: 42%;
      min-height: 200px;
    }

    #noticeBox ul {
      padding-left: 20px;
      text-align: left;
    }

    #noticeBox li {
      margin-bottom: 8px;
    }

    .maincard {
      font-size: 20px;
      border: solid 2px var(--color-accent);
      background-color: var(--color-surface);
      color: var(--color-accent);
      width: 40%;
      height: 100px;
    }

    .maincard1 {
      font-size: 20px;
      border: solid 2px var(--color-accent);
      background-color: var(--color-surface);
      color: var(--color-accent);
      width: 40%;
      height: 100px;
      margin-right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .maincard2 {
      font-size: 20px;
      border: solid 2px var(--color-accent);
      background-color: var(--color-surface);
      color: var(--color-accent);
      width: 40%;
      height: 100px;
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .cardpicture1 {
      height: 55px;
      width: auto;
      max-width: 90%;
      display: block;
    }
    .cardpicture2 {
      height: 55px;
      width: auto;
      max-width: 90%;
      display: block;
    }
    @media (max-width: 768px) {
      .cardpicture1,
      .cardpicture2 {
        height: 40px;
      }
    }
    .openword {
      color: var(--color-text);
      font-weight: normal;
    }
    @media (max-width: 768px) {
      html,body {
        width: 100vw;
        background-color: var(--color-surface);
      }
      .card {
        background-color: var(--color-surface);
      }
      .myBooksh2 {
        display: none;
      }
      #dashboard {
        text-align :center;
        width: 100%;
        display: block;
      }
      #myBooks {
        width:90%;
        min-height: 200px;
        font-size: 14px;
      }
      #noticeBox {
        width:90%;
        min-height: 200px;
        border: solid;
        border-radius: 10px;
      }
      .maincard1 {
        height: 80px;
      }
      .maincard2 {
        height: 80px;
      }
      .modal-content {
        width: 90%;
        margin: 0;
        padding: 0;
      }
      .modal-title {
        font-size: 14px;
      }
      .modalnaiyou {
        font-size: 14px;
      }
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }
    .modal-content {
      background-color: #fefefe;  /* モーダルウィンドウの背景色 */
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888888;
      border-radius: 12px;
      width: 40%;  /* モーダルウィンドウの横幅 */
      text-align:center;
      
    }
    .modal-title {
      color: #800000; /* モーダルウィンドウの文字の色 */
      font-size: 18px; /* モーダルウィンドウの文字の大きさ */
      font-weight: bold;
      line-height: 200%;
      text-align: center;
    }
    .close-button {
      color: #aaaaaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }
    .close-button:hover,
    .close-button:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    .modallink{
      text-decoration: underline;
    }
    #bookList{
      user-select: none;
    }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
      authDomain: "quiz1-4ffdc.firebaseapp.com",
      projectId: "quiz1-4ffdc",
      storageBucket: "quiz1-4ffdc.firebasestorage.app",
      messagingSenderId: "152062126332",
      appId: "1:152062126332:web:845af237a1a76207214f79"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Firestoreオフラインキャッシュ
    db.enablePersistence()
      .then(() => {
        console.log("Firestore persistence enabled");
      })
      .catch(err => {
        console.log("Persistence Error:", err);
      });

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const settingsBtn = document.getElementById("settingsBtn");
    const dashboardDiv = document.getElementById("dashboard");
    const bookListDiv = document.getElementById("bookList");

    let currentUser = null;

    const savedUser =
      JSON.parse(localStorage.getItem("cachedUser"));

    if (savedUser) {

      dashboardDiv.style.display = "flex";

      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
      settingsBtn.style.display = "inline-block";

      // キャッシュされた単語帳を即表示
      loadMyBooks(savedUser.uid);
    }

    const cachedUser = auth.currentUser;

    if (cachedUser) {
      dashboardDiv.style.display = "flex";
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
      settingsBtn.style.display = "inline-block";

      // 先に単語帳表示
      loadMyBooks(cachedUser.uid);
    }
  
    function handleSignedOut() {
      statusDiv.textContent = "ログアウト中";
      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      settingsBtn.style.display = "none";
      dashboardDiv.style.display = "none";
      hideLoading();
      localStorage.removeItem("cachedUser");
    }

    /* Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
       一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
       残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
       未ログインのままかを再確認する（実際はログインしたままなのにダッシュボードが
       一瞬消えてログアウト状態の表示になってしまう不具合を防ぐため）。 */
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        localStorage.setItem(
          "cachedUser",
          JSON.stringify({
            uid: user.uid
          })
        );
        statusDiv.textContent = "ログイン中: " + user.uid;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        settingsBtn.style.display = "inline-block";
        dashboardDiv.style.display = "flex";
        loadMyBooks(user.uid);
      } else if (localStorage.getItem("cachedUser")) {
        (function () {
          // 端末やネットワークが遅いと1回・1.5秒の再確認だけでは間に合わないことがあるため、
          // 間隔を広げながら最大4回(合計15秒)まで再確認してから本当に未ログインと判断する。
          const delays = [1000, 2000, 4000, 8000];
          const recheck = (i) => {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (i + 1 < delays.length) recheck(i + 1);
              else handleSignedOut();
            }, delays[i]);
          };
          recheck(0);
        })();
      } else {
        handleSignedOut();
      }
    });

    function showLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.remove('hidden');
      }
    }

    function hideLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    }

    function goPage(page) {
      if (page === "index.html") {
        location.href = "index.html";
        return;
      }
      // currentUserはFirebaseの認証確認(非同期)が完了するまでnullのままのため、
      // ページ読み込み直後にボタンを押すと「未ログイン」と誤判定されることがあった。
      // localStorageのキャッシュがあれば、確認が終わっていなくても遷移してよいと判断する。
      const hasCachedUser = !!localStorage.getItem("cachedUser");
      if (currentUser || hasCachedUser) {
        location.href = page;
      } else {
        alert("ログインしてください");
        location.href = "login.html";
      }
    }

    function logout() {
      localStorage.removeItem("cachedUser");
      auth.signOut();
    }

    function displayBooks(books) {
      bookListDiv.innerHTML = "";

      if (!books || books.length === 0) {
        bookListDiv.innerHTML = "<p>まだ単語帳がありません</p>";
        return;
      }

      books.forEach(book => {
        const div = document.createElement("div");
        div.className = "wordbook";

        div.innerHTML = `
          <a href="view.html?id=${book.id}" class="openword">
            <span>${book.title}</span>
          </a>
        `;

        bookListDiv.appendChild(div);
      });
    }

    function loadMyBooks(uid) {

      // まずキャッシュ表示
      const cacheKey = `myBooks_${uid}`;
      const cachedBooks = localStorage.getItem(cacheKey);

      if (cachedBooks) {
        try {
          displayBooks(JSON.parse(cachedBooks));
          hideLoading();
        } catch (e) {
          console.log(e);
        }
      }

      // 最新データ取得
      if (!cachedBooks) {
        showLoading();
      }

      db.collection("wordbooks")
        .where("owner", "==", uid)
        .orderBy("createdAt", "desc")
        .get()
        .then(snapshot => {

          const books = [];

          snapshot.forEach(doc => {
            books.push({
              id: doc.id,
              ...doc.data()
            });
          });

          // キャッシュ保存
          localStorage.setItem(
            cacheKey,
            JSON.stringify(books)
          );

          displayBooks(books);

          hideLoading();
        })
        .catch(err => {
          hideLoading();
          console.error(err);

          if (!cachedBooks) {
            alert("読み込みエラー: " + err.message);
          }
        });
    }

    async function addCreatedAtToOldData() {
      const snapshot = await db.collection("wordbooks").get();

      let count = 0;

      for (const doc of snapshot.docs) {
        const data = doc.data();

        // createdAt が無いものだけ追加
        if (!data.createdAt) {
          await db.collection("wordbooks").doc(doc.id).update({
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          count++;
          console.log("追加:", doc.id);
        }
      }

      alert(count + " 件に createdAt を追加しました");
    }
  </script>
