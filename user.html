<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>ユーザー情報</title>
  <link rel="apple-touch-icon" sizes="1024x1024" href="./images/icon.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="theme.js"></script>
  <style>
    .card {
      background: var(--color-surface);
      color: var(--color-text);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .wordbook {
      display: flex;
      justify-content: space-between;
      min-height: 20px;
      width: 100%;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .wordbook a {
      display: block;
      padding: 10px;
      width: 100%;
      border: solid thin var(--color-accent);
      border-radius: 10px;
      color: var(--color-text);
      font-weight: normal;
      text-decoration: none;
    }

    a {
      text-decoration: none;
      color: var(--color-accent);
      font-weight: bold;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    .list {
      background: var(--color-surface);
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    #reportLink {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      color: var(--color-text-sub);
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    .modalBox {
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 460px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: left;
    }

    .modalDesc {
      font-size: 13px;
      color: var(--color-text-sub);
      margin-bottom: 10px;
    }

    .modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    #reportReason {
      width: 100%;
      box-sizing: border-box;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }

    .notice {
      color: var(--color-danger);
      min-height: 1.2em;
      font-size: 13px;
    }

    .success {
      color: var(--color-success);
      min-height: 1.2em;
      font-size: 13px;
    }

    .profile-avatar {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <header>
    <p class="headertitle">
      <a href="index.html"><img src="./images/rogo.png" height="70vh"></a>
    </p>
    <div id="status" style="display:none">ログイン確認中...</div>
    <div>
      <span id="notifBellContainer"></span>
      <button id="settingsBtn" class="header-btn" style="display:none" onclick="goPage('settings.html')">設定</button>
      <button id="loginBtn" class="header-btn" onclick="location.href='login.html'">ログイン</button>
      <button id="logoutBtn" class="header-btn" style="display:none" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>ユーザー情報</h2>
      <div id="avatarContainer" class="profile-avatar"></div>
      <p id="userNameText">読み込み中...</p>
      <button type="button" id="reportLink" onclick="openReportModal()">このユーザーを報告する</button>
    </div>

    <div class="list">
      <h3>公開している単語帳</h3>
      <div id="bookList"></div>
    </div>
  </main>

  <div id="reportModal" class="modalOverlay" style="display:none;">
    <div class="modalBox">
      <h3>このユーザーを報告する</h3>
      <p class="modalDesc">通報内容は運営にのみ共有されます。通報理由を入力してください（必須）。</p>
      <textarea id="reportReason" placeholder="例：不適切な単語帳を作成している、迷惑行為など"></textarea>
      <div id="reportMsg" class="notice"></div>
      <div class="modalActions">
        <button type="button" onclick="closeReportModal()">キャンセル</button>
        <button type="button" onclick="submitReport()">通報する</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footertitle"><img src="./images/rogo.png" height="70vh">
      </div>
      <div class="footer-links">
        <a href="index.html">ホーム</a>
        <a href="list.html">検索</a>
        <a href="create.html">作成</a>
        <a href="settings.html">設定</a>
        <a href="update.html">更新履歴</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
      <div class="copy">© 2026 TEAM-Minimal, Shiratae</div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const firebaseConfig = {
        apiKey: "AIzaSyD7CJmO3eAO0o2EPRDsVqTtZ_whRd_3-3E",
        authDomain: "quiz1-4ffdc.firebaseapp.com",
        projectId: "quiz1-4ffdc",
        storageBucket: "quiz1-4ffdc.firebasestorage.app",
        messagingSenderId: "152062126332",
        appId: "1:152062126332:web:845af237a1a76207214f79"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const auth = firebase.auth();
      let currentUser = null;
      let targetUsername = null;

      const statusDiv = document.getElementById("status");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const settingsBtn = document.getElementById("settingsBtn");

      // ログイン情報のキャッシュを利用してヘッダーを即時表示
      const savedUser =
        JSON.parse(localStorage.getItem("cachedUser"));

      if (savedUser) {
        settingsBtn.style.display = "inline-block";
        logoutBtn.style.display = "inline-block";
        loginBtn.style.display = "none";
      }

      function handleSignedOut() {
        localStorage.removeItem("cachedUser");
        statusDiv.textContent = "ログアウト中";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        settingsBtn.style.display = "none";
      }

      // Firebaseが端末に保存された認証状態を復元し終える前に、onAuthStateChangedが
      // 一時的にnullで発火することがある。ログイン中のキャッシュ(cachedUser)が
      // 残っている場合は即座にログアウト扱いにせず、少し待ってから本当に
      // 未ログインのままかを再確認する（実際はログインしたままなのに一瞬
      // ログアウト状態の表示になってしまう不具合を防ぐため）。
      auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
          localStorage.setItem(
            "cachedUser",
            JSON.stringify({ uid: user.uid })
          );
          statusDiv.textContent = "ログイン中: " + user.uid;
          loginBtn.style.display = "none";
          logoutBtn.style.display = "inline-block";
          settingsBtn.style.display = "inline-block";

          const reportLink = document.getElementById("reportLink");
          if (reportLink && uid && user.uid !== uid) {
            reportLink.style.display = "inline";
          }
        } else if (localStorage.getItem("cachedUser")) {
          setTimeout(() => {
            if (!auth.currentUser) handleSignedOut();
          }, 1500);
        } else {
          handleSignedOut();
        }
      });

      window.goPage = function (page) {
        if (page === "index.html") {
          location.href = "index.html";
          return;
        }
        const hasCachedUser = !!localStorage.getItem("cachedUser");
        if (currentUser || hasCachedUser) {
          location.href = page;
        } else {
          alert("ログインしてください");
          location.href = "login.html";
        }
      };

      window.logout = function () {
        localStorage.removeItem("cachedUser");
        auth.signOut();
      };

      // XSS対策: テキストをそのまま innerHTML に差し込まないようにエスケープする
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // createdAt が Firestore Timestamp / Date / 数値 / 文字列 のどれでも
      // 比較可能な数値(ミリ秒)に変換する
      function toMillis(createdAt) {
        if (!createdAt) return 0;
        if (typeof createdAt.toMillis === "function") return createdAt.toMillis();
        if (createdAt instanceof Date) return createdAt.getTime();
        const t = new Date(createdAt).getTime();
        return isNaN(t) ? 0 : t;
      }

      function renderBooksHtml(books) {
        if (books.length === 0) {
          return "<p>公開単語帳はありません</p>";
        }
        return books.map(b => `
          <div class="wordbook">
            <a href="view.html?id=${encodeURIComponent(b.id)}">
              ${escapeHtml(b.title)}
            </a>
          </div>
        `).join("");
      }

      const params = new URLSearchParams(location.search);
      const uid = params.get("id");
      const cacheKey = `user_${uid}`;

      const userNameText = document.getElementById("userNameText");
      const avatarContainer = document.getElementById("avatarContainer");
      const bookList = document.getElementById("bookList");

      if (!uid) {
        if (userNameText) {
          userNameText.textContent = "ユーザーIDがありません";
        }
        return;
      }

      // 単語帳一覧を取得する。
      // owner + isPublic + orderBy(createdAt) は複合インデックスが必要なため、
      // 未作成の環境でもクエリが失敗して全体が止まらないよう、
      // orderBy 付きクエリが失敗した場合は orderBy なしで再取得し、
      // 取得後にJS側で createdAt 降順にソートするフォールバックを用意する。
      async function fetchBooks(uid) {
        let snap;
        try {
          snap = await db.collection("wordbooks")
            .where("owner", "==", uid)
            .where("isPublic", "==", true)
            .orderBy("createdAt", "desc")
            .get();
        } catch (e) {
          console.warn("orderBy付きクエリに失敗。インデックス無しクエリにフォールバックします。", e);
          snap = await db.collection("wordbooks")
            .where("owner", "==", uid)
            .where("isPublic", "==", true)
            .get();
        }

        const books = [];
        snap.forEach(doc => {
          const b = doc.data();
          books.push({
            id: doc.id,
            title: b.title || "(無題)",
            createdAtMillis: toMillis(b.createdAt)
          });
        });

        // 取得元がソート済みかどうかに関わらず、必ず作成日時の降順に並べ直す
        books.sort((a, b) => b.createdAtMillis - a.createdAtMillis);

        return books;
      }

      async function loadUser() {
        const cachedData = localStorage.getItem(cacheKey);

        if (cachedData) {
          try {
            const data = JSON.parse(cachedData);
            userNameText.textContent = "ユーザー名: " + data.username;
            if (avatarContainer) avatarContainer.innerHTML = data.avatarHtml || "";
            bookList.innerHTML = data.booksHtml;
          } catch (e) {
            console.error(e);
          }
        }

        // ユーザー情報と単語帳一覧の取得を分離する。
        // 以前は Promise.all + 単一の try/catch でまとめていたため、
        // 単語帳側のクエリだけが失敗した場合でも
        // ユーザー名側まで「読み込みエラー」表示になってしまっていた。
        let username = null;
        let avatarHtml = null;
        try {
          const userDoc = await db.collection("users").doc(uid).get();

          if (!userDoc.exists) {
            if (userNameText) {
              userNameText.textContent = "ユーザーが見つかりません";
            }
            return;
          }

          const userData = userDoc.data();
          username = userData.username || "名無し";
          targetUsername = username;
          avatarHtml = window.VOCABOOST_AVATAR_HTML(userData.photoURL, 120);

          if (userNameText) {
            userNameText.textContent = "ユーザー名: " + username;
          }
          if (avatarContainer) {
            avatarContainer.innerHTML = avatarHtml;
          }
        } catch (e) {
          console.error(e);
          if (userNameText) {
            userNameText.textContent = "読み込みエラー";
          }
          // ユーザー情報が取得できない場合でも、単語帳の取得は別途試みる
        }

        let booksHtml = null;
        try {
          const books = await fetchBooks(uid);
          booksHtml = renderBooksHtml(books);
          bookList.innerHTML = booksHtml;
        } catch (e) {
          console.error(e);
          bookList.innerHTML = "<p>単語帳の読み込みに失敗しました</p>";
        }

        // 両方が正常に取得できた場合のみキャッシュを更新する
        if (username !== null && booksHtml !== null) {
          try {
            localStorage.setItem(
              cacheKey,
              JSON.stringify({ username, avatarHtml, booksHtml })
            );
          } catch (e) {
            console.warn("キャッシュの保存に失敗しました", e);
          }
        }
      }

      loadUser();

      window.openReportModal = function () {
        if (!currentUser) {
          alert("ログインしてください");
          return;
        }
        document.getElementById("reportReason").value = "";
        const msg = document.getElementById("reportMsg");
        msg.className = "notice";
        msg.textContent = "";
        document.getElementById("reportModal").style.display = "flex";
      };

      window.closeReportModal = function () {
        document.getElementById("reportModal").style.display = "none";
      };

      window.submitReport = async function () {
        const reason = document.getElementById("reportReason").value.trim();
        const msg = document.getElementById("reportMsg");

        if (!reason) {
          msg.className = "notice";
          msg.textContent = "通報理由を入力してください";
          return;
        }
        if (!currentUser) {
          msg.className = "notice";
          msg.textContent = "ログインしてください";
          return;
        }

        msg.className = "notice";
        msg.textContent = "送信しています...";

        try {
          await db.collection("reports").add({
            type: "user",
            targetId: uid,
            targetLabel: targetUsername || "",
            reason: reason,
            reportedBy: currentUser.uid,
            reportedByEmail: currentUser.email || "",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          // 運営のヘッダー通知ベルにだけ届く通知（通報理由の中身は含めない）
          try {
            await db.collection("notifications").add({
              title: "新しい通報があります",
              body: `ユーザー「${targetUsername || uid}」が通報されました`,
              target: "admin",
              targetUserIds: [],
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              createdBy: currentUser.uid
            });
          } catch (e) {
            console.error("admin notification failed", e);
          }

          msg.className = "success";
          msg.textContent = "通報しました。ご協力ありがとうございます。";
          setTimeout(() => { window.closeReportModal(); }, 1200);
        } catch (e) {
          console.error(e);
          msg.className = "notice";
          msg.textContent = "送信に失敗しました: " + e.message;
        }
      };

    });
  </script>

  <script src="account-widgets.js"></script>
  <script src="analytics-tracker.js"></script>
</body>

</html>
